async function doSaveSessionInfo(sessionId){
  const nameEl = document.getElementById('edit-sname-'+sessionId);
  const from = document.getElementById('edit-from-'+sessionId);
  const to = document.getElementById('edit-to-'+sessionId);
  const loc = document.getElementById('edit-loc-'+sessionId);
  const speaker = document.getElementById('edit-speaker-'+sessionId);
  const desc = document.getElementById('edit-desc-'+sessionId);
  const logoInput = document.getElementById('edit-slogo-'+sessionId);
  if(!from) return;
  const prevInfo = SESSION_INFO[sessionId] || {};
  const newName = nameEl && nameEl.value.trim() ? nameEl.value.trim() : prevInfo.name;
  const uploadedLogo = await readImageFileToDataUrl(logoInput, 300);
  SESSION_INFO[sessionId] = {
    ...prevInfo,
    name: newName,
    timeFrom: from.value.trim(),
    timeTo: to.value.trim(),
    location: loc.value.trim(),
    speaker: speaker.value.trim(),
    desc: desc.value.trim(),
    logo: uploadedLogo || prevInfo.logo || null,
  };
  // Apply immediately to the live in-memory session object so the UI reflects
  // the change right away, without depending on a storage round-trip.
  const found = findSessionById(sessionId);
  if(found && newName) found.session.name = newName;
  await saveSessionInfo(SESSION_INFO);
  state.editingSessionId = null;
  showToast('تم حفظ تفاصيل الفقرة');
  render();
}

async function doExportFullBackup(){
  showToast('بيتم تجهيز النسخة الاحتياطية...');
  try{
    const galleryPhotos = {};
    const allPids = new Set();
    GALLERY_ALBUMS.forEach(a=>(a.photoIds||[]).forEach(pid=>allPids.add(pid)));
    allPids.forEach(pid=>{ if(GALLERY_PHOTO_CACHE[pid]) galleryPhotos[pid] = GALLERY_PHOTO_CACHE[pid]; });
    // صور المشاركين الخاصة (Photo) — لازم نجيبها من التخزين لأنها مش كلها محمّلة في الكاش وقت التصدير
    const allParticipantPhotoIds = new Set();
    Object.values(PARTICIPANT_PHOTOS).forEach(ids=>(ids||[]).forEach(id=>allParticipantPhotoIds.add(id)));
    await Promise.all([...allParticipantPhotoIds].map(async id=>{
      if(!PARTICIPANT_PHOTO_CACHE[id]){
        try{ const r = await window.storage.get('glavera-participant-photo-'+id, true); if(r && r.value) PARTICIPANT_PHOTO_CACHE[id] = r.value; }catch(e){}
      }
    }));
    const participantPhotos = {};
    allParticipantPhotoIds.forEach(id=>{ if(PARTICIPANT_PHOTO_CACHE[id]) participantPhotos[id] = PARTICIPANT_PHOTO_CACHE[id]; });
    // وسائط الشات (صور/صوت/فيديو) — نجيبها من التخزين لو مش محمّلة في الكاش
    const chatMediaIds = new Set(CHAT_MESSAGES.filter(m=>m.mediaId).map(m=>m.mediaId));
    await Promise.all([...chatMediaIds].map(async id=>{
      if(!CHAT_MEDIA_CACHE[id]){
        try{ const r = await window.storage.get('glavera-chat-media-'+id, true); if(r && r.value) CHAT_MEDIA_CACHE[id] = r.value; }catch(e){}
      }
    }));
    const chatMedia = {};
    chatMediaIds.forEach(id=>{ if(CHAT_MEDIA_CACHE[id]) chatMedia[id] = CHAT_MEDIA_CACHE[id]; });
    const backup = {
      exportedAt: new Date().toISOString(),
      app: 'glavera3',
      version: 1,
      data: {
        CHECKINS, SESSION_INFO, PROFILE_EXTRA, CHEERS, BONUS, GIFT_POINTS,
        GAME_STATS, GAME_ROOMS, LOGISTICS, CONF_SETTINGS, TEAM_MESSAGES, DAILY_MESSAGE,
        POINT_CODES, WALL_POSTS, QUESTIONS, REPORTS, OPINIONS, TRASH, DAY_OVERRIDES,
        SESSION_OVERRIDES, CUSTOM_SESSIONS, ADMIN_ALERTS, TEAM_OVERRIDES, TEAM_BONUS,
        CUSTOM_PARTICIPANTS, CUSTOM_TEAMS, GALLERY_ALBUMS, galleryPhotos,
        PARTICIPANT_PHOTOS, participantPhotos, CHAT_MESSAGES, chatMedia, CHEFS, CHEF_PHOTOS
      }
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type:'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `glavera3-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('✅ اتحمّلت النسخة الاحتياطية');
  }catch(e){
    console.error('backup export failed', e);
    showToast('⚠️ حصلت مشكلة في تجهيز النسخة الاحتياطية', true);
  }
}

/* ============================= OTP-STYLE CODE BOXES ============================= */
function syncOtpHidden(){
  const boxes = document.querySelectorAll('.otp-box');
  const hidden = document.getElementById('login-code-input');
  if(hidden) hidden.value = Array.from(boxes).map(b=>b.value).join('');
  updateOtpProgress();
}
function updateOtpProgress(){
  const boxes = document.querySelectorAll('.otp-box');
  if(!boxes.length) return;
  const filledCount = Array.from(boxes).filter(b=>b.value).length;
  const pct = Math.round((filledCount/boxes.length)*100);
  const fill = document.getElementById('otp-progress-fill');
  if(fill) fill.style.width = pct+'%';
  const lock = document.querySelector('.otp-lock');
  const btn = document.getElementById('otp-submit-btn');
  const allFilled = filledCount === boxes.length;
  if(lock) lock.classList.toggle('unlocked', allFilled);
  if(lock && allFilled) lock.textContent = '🔓';
  else if(lock) lock.textContent = '🔐';
  if(btn) btn.classList.toggle('otp-ready-btn', allFilled);
  if(allFilled){
    boxes.forEach((b,i)=>{
      setTimeout(()=>{ b.classList.add('ready'); setTimeout(()=>b.classList.remove('ready'), 550); }, i*70);
    });
  }
}
function attachSessionCodeBoxes(){
  document.querySelectorAll('.session-code-box').forEach(box=>{
    if(box.dataset.bound) return;
    box.dataset.bound = '1';
    box.addEventListener('input', ()=>{
      box.value = box.value.replace(/[^a-zA-Z0-9*#@%+=]/g,'').toUpperCase().slice(0,1);
      const group = document.querySelectorAll(`.session-code-box[data-group="${box.dataset.group}"]`);
      const idx = parseInt(box.dataset.idx,10);
      const wasFilled = box.classList.contains('filled');
      box.classList.toggle('filled', !!box.value);
      const visual = box.parentElement && box.parentElement.querySelector('.otp-digit-visual');
      if(visual){
        visual.textContent = box.value;
        visual.classList.remove('show');
        void visual.offsetWidth;
        if(box.value) visual.classList.add('show');
      }
      if(box.value && !wasFilled){
        box.classList.remove('spark');
        void box.offsetWidth;
        box.classList.add('spark');
        SND.otpType(idx);
        const rect = box.getBoundingClientRect();
        goldDustBurst(rect.left+rect.width/2, rect.top+rect.height/2, 8);
      }
      if(box.value && idx < group.length-1){ group[idx+1].focus(); }
      const allFilled = Array.from(group).every(b=>b.value);
      if(allFilled){
        const code = Array.from(group).map(b=>b.value).join('');
        tryCheckin(code).then(ok=>{
          if(!ok){
            group.forEach(b=>{
              b.value = '';
              b.classList.remove('filled');
              const v = b.parentElement && b.parentElement.querySelector('.otp-digit-visual');
              if(v){ v.textContent=''; v.classList.remove('show'); }
            });
            group[0].focus();
          }
        });
      }
    });
    box.addEventListener('keydown', (e)=>{
      const group = document.querySelectorAll(`.session-code-box[data-group="${box.dataset.group}"]`);
      const idx = parseInt(box.dataset.idx,10);
      if(e.key==='Backspace' && !box.value && idx>0){ group[idx-1].focus(); }
    });
  });
}
function attachOtpBoxes(){
  const boxes = document.querySelectorAll('.otp-box');
  if(!boxes.length) return;
  boxes.forEach((box, idx)=>{
    box.addEventListener('input', ()=>{
      box.value = box.value.replace(/[^0-9]/g,'').slice(0,1);
      const wasFilled = box.classList.contains('filled');
      box.classList.toggle('filled', !!box.value);
      const visual = box.parentElement && box.parentElement.querySelector('.otp-digit-visual');
      if(visual){
        visual.textContent = box.value;
        visual.classList.remove('show');
        void visual.offsetWidth;
        if(box.value) visual.classList.add('show');
      }
      if(box.value && !wasFilled){
        box.classList.remove('spark');
        void box.offsetWidth;
        box.classList.add('spark');
        if(box.classList.contains('otp-circle')){
          SND.otpType(idx);
          const rect = box.getBoundingClientRect();
          goldDustBurst(rect.left+rect.width/2, rect.top+rect.height/2, 8);
        } else {
          SND.click();
        }
      }
      syncOtpHidden();
      if(box.value && idx < boxes.length-1){ boxes[idx+1].focus(); }
    });
    box.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !box.value && idx>0){ boxes[idx-1].focus(); }
      else if(e.key==='Enter'){ doLogin(); }
    });
  });
  updateOtpProgress();
}
function fillOtpBoxes(code){
  const boxes = document.querySelectorAll('.otp-box');
  if(!boxes.length) return;
  const chars = code.split('');
  boxes.forEach((box,i)=>{
    box.value = chars[i]||'';
    box.classList.toggle('filled', !!box.value);
    const visual = box.parentElement && box.parentElement.querySelector('.otp-digit-visual');
    if(visual){
      visual.textContent = box.value;
      visual.classList.remove('show');
      void visual.offsetWidth;
      if(box.value) visual.classList.add('show');
    }
  });
  syncOtpHidden();
  SND.click();
}
function syncAdminOtpHidden(){
  const boxes = document.querySelectorAll('.admin-otp-box');
  const hidden = document.getElementById('admin-pass-input');
  if(hidden) hidden.value = Array.from(boxes).map(b=>b.value).join('');
  updateAdminOtpProgress();
}
function updateAdminOtpProgress(){
  const boxes = document.querySelectorAll('.admin-otp-box');
  if(!boxes.length) return;
  const filledCount = Array.from(boxes).filter(b=>b.value).length;
  const pct = Math.round((filledCount/boxes.length)*100);
  const fill = document.getElementById('admin-otp-progress-fill');
  if(fill) fill.style.width = pct+'%';
  const btn = document.getElementById('admin-otp-submit-btn');
  const allFilled = filledCount === boxes.length;
  if(btn) btn.classList.toggle('otp-ready-btn', allFilled);
  if(allFilled){ doAdminUnlock(); }
}
function attachAdminOtpBoxes(){
  const boxes = document.querySelectorAll('.admin-otp-box');
  if(!boxes.length) return;
  boxes.forEach((box, idx)=>{
    box.addEventListener('input', ()=>{
      box.value = box.value.replace(/[^0-9]/g,'').slice(0,1);
      const wasFilled = box.classList.contains('filled');
      box.classList.toggle('filled', !!box.value);
      if(box.value && !wasFilled){
        box.classList.remove('spark');
        void box.offsetWidth;
        box.classList.add('spark');
        SND.click();
      }
      syncAdminOtpHidden();
      if(box.value && idx < boxes.length-1){ boxes[idx+1].focus(); }
    });
    box.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !box.value && idx>0){ boxes[idx-1].focus(); }
      else if(e.key==='Enter'){ doAdminUnlock(); }
    });
  });
  updateAdminOtpProgress();
}

function doLogin(){
  const input = document.getElementById('login-code-input');
  if(!input) return;
  const code = input.value.trim().toUpperCase();
  if(!code){ showToast('اكتب الكود أولاً', true); return; }
  doLoginWithCode(code);
}
function doLoginWithCode(code){
  const p = PARTICIPANTS.find(x=>x.id===code.trim().toUpperCase());
  if(!p){ showToast('كود الدخول غير صحيح', true); return; }
  const extra = myExtra(p.id);
  document.documentElement.dataset.theme = extra.mode==='light' ? 'light' : 'dark';
  state = Object.assign(FRESH_STATE(), { view:'welcome', pid:p.id });
  render();
  bgMusicArmed = true;
  applyMusicState();
}
function doManualSubmit(){
  const input = document.getElementById('manual-code-input');
  if(!input) return;
  const code = input.value;
  if(!code.trim()){ showToast('اكتب الكود أولاً', true); return; }
  tryCheckin(code);
}
function doFallbackSubmit(){
  const input = document.getElementById('fallback-code-input');
  if(!input) return;
  const code = input.value;
  if(!code.trim()){ showToast('اكتب الكود أولاً', true); return; }
  closeScanModal();
  if(scanMode==='login'){ doLoginWithCode(code); }
  else{ tryCheckin(code, scanTargetSessionId); }
}
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  if(e.target.id === 'login-code-input'){ e.preventDefault(); doLogin(); }
  else if(e.target.id === 'manual-code-input'){ e.preventDefault(); doManualSubmit(); }
  else if(e.target.id === 'fallback-code-input'){ e.preventDefault(); doFallbackSubmit(); }
  else if(e.target.id === 'admin-pass-input'){ e.preventDefault(); doAdminUnlock(); }
});

/* ============================= PULL TO REFRESH ============================= */
/* ============================= LIVE POLLING ============================= */
async function refreshAllData(){
  let customAdminHash;
  [CHECKINS, customAdminHash, SESSION_INFO, PROFILE_EXTRA, CHEERS, BONUS, GIFT_POINTS,
   GAME_STATS, GAME_ROOMS, LOGISTICS, CONF_SETTINGS, TEAM_MESSAGES, DAILY_MESSAGE,
   POINT_CODES, WALL_POSTS, QUESTIONS, REPORTS, OPINIONS, TRASH, DAY_OVERRIDES, SESSION_OVERRIDES,
   CUSTOM_SESSIONS, ADMIN_ALERTS, TEAM_OVERRIDES, TEAM_BONUS, CUSTOM_PARTICIPANTS,
   CUSTOM_TEAMS, GALLERY_ALBUMS, PARTICIPANT_PHOTOS, CHAT_MESSAGES, CHEFS] = await Promise.all([
    loadCheckins(), loadAdminPasscodeHash(), loadSessionInfo(), loadProfileExtra(),
    loadCheers(), loadBonus(), loadGiftPoints(), loadGameStats(), loadGameRooms(),
    loadLogistics(), loadConfSettings(), loadTeamMessages(), loadDailyMessage(),
    loadPointCodes(), loadWallPosts(), loadQuestions(), loadReports(), loadOpinions(), loadTrash(),
    loadDayOverrides(), loadSessionOverrides(), loadCustomSessions(), loadAdminAlerts(),
    loadTeamOverrides(), loadTeamBonus(), loadCustomParticipants(), loadCustomTeams(),
    loadGalleryAlbums(), loadParticipantPhotosIndex(), loadChatMessages(), loadChefs()
  ]);
  if(customAdminHash) ADMIN_PASSCODE_HASH = customAdminHash;
  await preloadGalleryPhotos(GALLERY_ALBUMS);
  CUSTOM_TEAMS.forEach(ct=>{
    if(!TEAMS.some(t=>t.id===ct.id)) TEAMS.push({id:ct.id, name:ct.name, color:ct.color});
  });
  CUSTOM_PARTICIPANTS.forEach(cp=>{
    if(!PARTICIPANTS.some(p=>p.id===cp.id)) PARTICIPANTS.push({id:cp.id, name:cp.name, teamId:cp.teamId});
  });

  // ---- apply day/session overrides + custom sessions ----
  DAYS.forEach(d=>{
    const dov = DAY_OVERRIDES[d.id];
    d.label = (dov && dov.label) ? dov.label : d.baseLabel || (d.baseLabel = d.label);
    d.locked = !!(dov && dov.locked);
    const extra = CUSTOM_SESSIONS[d.id] || [];
    const baseIds = new Set((d.baseSessions || (d.baseSessions = d.sessions.slice())).map(s=>s.id));
    d.sessions = d.baseSessions.concat(extra.filter(s=>!baseIds.has(s.id)));
    d.sessions = d.sessions.filter(s=>{
      const sov = SESSION_OVERRIDES[s.id];
      return !(sov && sov.deleted);
    });
    d.sessions.forEach(s=>{
      const sov = SESSION_OVERRIDES[s.id];
      s.locked = !!(sov && sov.locked);
      const info = SESSION_INFO[s.id];
      if(info && info.name) s.name = info.name;
    });
  });

  // ---- apply team overrides ----
  TEAMS.forEach(t=>{
    const tov = TEAM_OVERRIDES[t.id];
    t.logo = tov ? tov.logo : null;
    t.leaderId = tov ? tov.leaderId : null;
    t.name = (tov && tov.name) ? tov.name : (t.baseName || (t.baseName = t.name));
  });

  // ---- apply participant overrides (name/team/bonus) ----
  PARTICIPANT_OVERRIDES = await loadParticipantOverrides();
  const overrides = PARTICIPANT_OVERRIDES;
  let overridesChanged = false;
  for(let i=PARTICIPANTS.length-1; i>=0; i--){
    const p = PARTICIPANTS[i];
    const ov = overrides[p.id];
    if(!ov) continue;
    if(ov.deleted){ PARTICIPANTS.splice(i,1); continue; }
    if(ov.name) p.name = ov.name;
    if(ov.teamId) p.teamId = ov.teamId;
    if(ov.photo) p.photo = ov.photo; // legacy fallback for photos saved before individual-key storage
    if(ov.newId && ov.newId !== p.id && !ov.migrated){
      const oldId = p.id, newId = ov.newId;
      migrateParticipantId(p, oldId, newId);
      overrides[newId] = Object.assign({}, ov, {newId:undefined, migrated:true});
      delete overrides[oldId];
      overridesChanged = true;
    }
  }
  if(overridesChanged) saveParticipantOverrides(overrides);

  // ---- apply individually-stored participant photos (avoids one giant combined blob) ----
  try{
    const photoMap = await loadAllParticipantPhotos();
    PARTICIPANTS.forEach(p=>{ if(photoMap[p.id]) p.photo = photoMap[p.id]; });
  }catch(e){}

  // ---- fire any due scheduled admin alerts (best-effort, any open client) ----
  try{
    const now = Date.now();
    let alertsChanged = false;
    for(const al of ADMIN_ALERTS){
      if(!al.sent && al.sendAt && al.sendAt<=now){
        PARTICIPANTS.forEach(p=>pushNotification(p.id, al.text, '📢'));
        al.sent = true;
        alertsChanged = true;
      }
    }
    if(alertsChanged){ saveAdminAlerts(ADMIN_ALERTS); saveProfileExtra(PROFILE_EXTRA); }
  }catch(e){}
}
function updateLiveWidgetsInPlace(){
  document.querySelectorAll('#live-wall-ticker').forEach(el=>{ el.innerHTML = buildLiveWallHTML(); });
  document.querySelectorAll('[data-progress-session]').forEach(el=>{
    const sid = el.dataset.progressSession;
    const checkedIn = checkinsForSession(sid);
    const pct = PARTICIPANTS.length ? Math.round((checkedIn/PARTICIPANTS.length)*100) : 0;
    el.style.width = pct+'%';
    const lab = document.querySelector(`[data-progress-lab-session="${sid}"]`);
    if(lab) lab.textContent = `${checkedIn} من ${PARTICIPANTS.length} سجّلوا حضور (${pct}%)`;
  });
  if(state.view==='admin' && state.adminTab==='pulse') updatePulseWidget();
}
function checkUpcomingSessionAlerts(){
  if(!state.pid) return;
  const extra = myExtra(state.pid);
  if(!extra.notified) extra.notified = {};
  const nm = nowMinutes();
  let changed = false;
  DAYS.forEach(d=>d.sessions.forEach(s=>{
    if(CHECKINS[state.pid+'__'+s.id]) return;
    if(extra.remindersOff && extra.remindersOff[s.id]) return;
    const info = SESSION_INFO[s.id];
    if(!info || !info.timeFrom) return;
    const start = parseArabicTime(info.timeFrom);
    if(start==null) return;
    const diff = start - nm;
    if(diff>=0 && diff<=10 && !extra.notified[s.id]){
      extra.notified[s.id] = true;
      changed = true;
      showToast('⏰ "'+s.name+'" هتبدأ بعد '+diff+' دقيقة');
      pushNotification(state.pid, `"${s.name}" هتبدأ بعد ${diff} دقيقة`, '⏰');
    }
  }));
  if(changed) saveProfileExtra(PROFILE_EXTRA);
}
function startLivePolling(){
  setInterval(async ()=>{
    if(document.hidden) return;
    checkUpcomingSessionAlerts();
    checkDailyMessage();
    checkConfTimeAlerts();
    try{
      const before = JSON.stringify(CHECKINS);
      const fresh = await loadCheckins();
      if(JSON.stringify(fresh) !== before){
        CHECKINS = fresh;
        updateLiveWidgetsInPlace();
      }
    }catch(e){}
    try{
      if(state.view==='session' || (state.view==='admin' && state.adminTab==='pointcodes')){
        const freshPointCodes = await loadPointCodes();
        if(freshPointCodes && Object.keys(freshPointCodes).length){
          POINT_CODES = freshPointCodes;
          render();
        }
      }
    }catch(e){}
    try{
      if(state.view==='wall'){
        const freshWall = await loadWallPosts();
        if(JSON.stringify(freshWall) !== JSON.stringify(WALL_POSTS)){ WALL_POSTS = freshWall; render(); }
      }
      if(state.view==='admin' && (state.adminTab==='questions' || state.adminTab==='reports')){
        QUESTIONS = await loadQuestions();
        REPORTS = await loadReports();
      }
      if(state.view==='admin' && state.adminTab==='opinions'){
        OPINIONS = await loadOpinions();
        render();
      }
      if(state.view==='chef-dishes' && state.chefId){
        window.__chefRevTick = (window.__chefRevTick||0)+1;
        if(dishSheet || window.__chefRevTick%2===0){
          const cidNow = state.chefId;
          const freshRev = await loadChefReviews(cidNow);
          if(JSON.stringify(freshRev) !== JSON.stringify(CHEF_REVIEWS[cidNow]||{})){
            CHEF_REVIEWS[cidNow] = freshRev;
            updateDishMetaInPlace();
            if(dishSheet) updateDishSheetDynamic();
          }
        }
      }
      if(state.view==='chefs' || state.view==='chef-meals' || state.view==='chef-dishes'){
        const freshChefs = await loadChefs();
        if(JSON.stringify(freshChefs) !== JSON.stringify(CHEFS)){ CHEFS = freshChefs; render(); }
      }
      if(state.view==='chat'){
        const fresh = await loadChatMessages();
        const lastFresh = fresh[fresh.length-1], lastMine = CHAT_MESSAGES[CHAT_MESSAGES.length-1];
        const changed = fresh.length !== CHAT_MESSAGES.length || (lastFresh && lastMine && lastFresh.id !== lastMine.id);
        if(changed){ CHAT_MESSAGES = fresh; render(); }
      }
    }catch(e){}
  }, 6000);
}

/* ============================= INIT ============================= */
(async function init(){
  initLuxuryParticles();
  try{
    await Promise.race([
      refreshAllData(),
      new Promise((resolve)=> setTimeout(resolve, 10000))
    ]);
  }catch(e){ console.error('refreshAllData failed, continuing with local data', e); }
  render();
  attachDaySwipeOnce();
  startLivePolling();
  checkDailyMessage();
  setInterval(tickConfCountdown, 1000);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
})();
</script>
