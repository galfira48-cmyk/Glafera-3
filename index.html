    </div>
    <div class="section-title">${tr('gallery_sub')}</div>
    ${renderGalleryStage()}
  `;
}

function positionGalleryCards(){
  const track = document.getElementById('gallery-track');
  if(!track) return;
  const cards = track.querySelectorAll('.gallery-card');
  const count = cards.length;
  if(!count) return;
  const spacingX = 92;    // horizontal distance between neighboring cards
  const angle = 46;       // rotateY per step, for the fanned coverflow look
  const scaleStep = 0.14; // scale reduction per step away from center
  const maxVisible = 3;   // cards further than this fade out completely
  cards.forEach((card, i)=>{
    let offset = i - galleryIndex;
    if(offset > count/2) offset -= count;
    if(offset < -count/2) offset += count;
    const abs = Math.abs(offset);
    if(abs > maxVisible){
      card.style.opacity = '0';
      card.style.pointerEvents = 'none';
      card.style.zIndex = '0';
      card.style.transform = `translateX(${offset*spacingX*1.4}px) translateZ(-700px)`;
      return;
    }
    const tx = offset * spacingX;
    const tz = -abs * 90;
    const rz = -offset * angle;
    const sc = 1 - abs*scaleStep;
    card.style.opacity = String(1 - abs*0.28);
    card.style.pointerEvents = 'auto';
    card.style.zIndex = String(100 - abs);
    card.style.transform = `translateX(${tx}px) translateZ(${tz}px) rotateY(${rz}deg) scale(${sc})`;
    card.classList.toggle('gc-focused', abs===0);
  });
  document.querySelectorAll('#gallery-dots .gallery-dot').forEach((d,i)=>{
    d.classList.toggle('active', i===galleryIndex);
  });
}

function galleryGoTo(i){
  const count = galleryCardCount();
  if(!count) return;
  galleryIndex = ((i % count) + count) % count;
  positionGalleryCards();
}
function galleryNext(){ galleryGoTo(galleryIndex+1); restartGalleryAuto(); }
function galleryPrev(){ galleryGoTo(galleryIndex-1); restartGalleryAuto(); }

function startGalleryAuto(){
  stopGalleryAuto();
  if(galleryCardCount() < 2) return;
  galleryAutoTimer = setInterval(()=>{ galleryGoTo(galleryIndex+1); }, 2600);
}
function stopGalleryAuto(){
  if(galleryAutoTimer){ clearInterval(galleryAutoTimer); galleryAutoTimer = null; }
}

function attachGalleryEvents(){
  const stage = document.getElementById('gallery-stage');
  if(!stage) return;
  positionGalleryCards();
  startGalleryAuto();

  stage.addEventListener('click', (e)=>{
    const card = e.target.closest('.gallery-card');
    if(!card) return;
    const idx = parseInt(card.dataset.idx, 10);
    if(idx === galleryIndex){
      // الكارت اللي في النص: افتحله صفحة الألبوم بصوره كلها
      stopGalleryAuto();
      go('gallery-album', {galleryAlbumIndex: idx});
      return;
    }
    galleryGoTo(idx);
    restartGalleryAuto();
  });

  let dragging = false, startX = 0, startIdx = 0, moved = 0;
  stage.addEventListener('pointerdown', (e)=>{
    dragging = true; startX = e.clientX; startIdx = galleryIndex; moved = 0;
    stopGalleryAuto();
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  });
  stage.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    moved = e.clientX - startX;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    const threshold = 40;
    if(moved > threshold) galleryGoTo(startIdx - 1);
    else if(moved < -threshold) galleryGoTo(startIdx + 1);
    else positionGalleryCards();
    restartGalleryAuto();
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', ()=>{ if(dragging) endDrag(); });
}
function restartGalleryAuto(){ startGalleryAuto(); }

  backdrop.addEventListener('pointerdown', (e)=>{ sDragging = true; sx = e.clientX; sMoved = 0; });
  backdrop.addEventListener('pointermove', (e)=>{ if(sDragging) sMoved = e.clientX - sx; });
  backdrop.addEventListener('pointerup', ()=>{
    if(!sDragging) return;
    sDragging = false;
    if(sMoved > 50) step(-1);
    else if(sMoved < -50) step(1);
  });
  renderLb();
}
async function doDownloadGalleryPhoto(){
  if(!LIGHTBOX_STATE) return;
  const pid = LIGHTBOX_STATE.photoIds[LIGHTBOX_STATE.i];
  const dataUrl = pid && (LIGHTBOX_STATE.cache||GALLERY_PHOTO_CACHE)[pid];

  const filename = pid==='myavatar' ? 'my-photo.jpg' : `glavera3-photo-${LIGHTBOX_STATE.i+1}.jpg`;
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast('اتحمّلت الصورة');
  }catch(e){
    console.error('doDownloadGalleryPhoto failed:', e);
    showToast('حصلت مشكلة في تحميل الصورة، جرّب تاني', true);
  }
}

/* ============================= CHEF DISH REVIEWS (آراء المشاركين) ============================= */
const DISH_STAR_LABELS = ['', 'ضعيفة 😕', 'مقبولة 🙂', 'كويسة 👍', 'حلوة 😋', 'جميلة جدًا 🤩', 'رائعة 🔥', 'أسطورية 👑'];
const DISH_REVIEW_MAX_CHARS = 200;
let CHEF_REVIEWS = {};            // chefId -> { dishId -> { participantId -> {s, t, ts} } }
let CHEF_REVIEWS_LOADING = {};
let dishSheet = null;             // { cid, did, stars, text, sort }
async function loadChefReviews(cid){
  try{ const r = await window.storage.get('glavera-chef-reviews-'+cid, true); const v = r ? JSON.parse(r.value) : {}; return (v && typeof v==='object') ? v : {}; }
  catch(e){ return {}; }
}
async function chefReviewsUpdate(cid, mutator){
  const key = 'glavera-chef-reviews-'+cid;
  const apply = (curStr)=>{
    let o = {};
    try{ o = curStr ? JSON.parse(curStr) : {}; }catch(e){ o = {}; }
    if(!o || typeof o!=='object') o = {};
    mutator(o);
    return JSON.stringify(o);
  };
  let res = null;
  if(window.storage && window.storage.update){
    res = await window.storage.update(key, apply, true);
  } else {
    const cur = await window.storage.get(key, true);
    res = await window.storage.set(key, apply(cur ? cur.value : null), true);
  }
  if(!res) return false;
  try{ CHEF_REVIEWS[cid] = JSON.parse(res.value) || {}; }catch(e){ CHEF_REVIEWS[cid] = await loadChefReviews(cid); }
  return true;
}
async function ensureChefReviews(cid, force){
  if(!cid || CHEF_REVIEWS_LOADING[cid]) return;
  if(CHEF_REVIEWS[cid] && !force) return;
  CHEF_REVIEWS_LOADING[cid] = true;
  try{ CHEF_REVIEWS[cid] = await loadChefReviews(cid); }catch(e){ CHEF_REVIEWS[cid] = CHEF_REVIEWS[cid] || {}; }
  CHEF_REVIEWS_LOADING[cid] = false;
  if((state.view==='chef-dishes' && state.chefId===cid) || (state.view==='admin' && state.adminTab==='chefs')) render();
}
function chefDishReviews(cid, did){
  const m = ((CHEF_REVIEWS[cid]||{})[did]) || {};
  return Object.keys(m).map(pid=>({pid, s:(m[pid].s|0), t:(m[pid].t||''), ts:(m[pid].ts||0)})).filter(x=>x.s>=1 && x.s<=CHEF_MAX_STARS);
}
function chefDishStats(cid, did){
  const r = chefDishReviews(cid, did);
  const dist = new Array(CHEF_MAX_STARS+1).fill(0);
  r.forEach(x=>{ dist[x.s]++; });
  const n = r.length;
  return { n, avg: n ? r.reduce((a,x)=>a+x.s,0)/n : 0, dist };
}
function dishMetaHtml(cid, did){
  const st = chefDishStats(cid, did);
  if(!st.n) return '✨ كن أول من يقيّم';
  return `👥 ${st.n} ${st.n===1?'رأي':'آراء'} • <b>${(Math.round(st.avg*10)/10)}</b> ★`;
}
function updateDishMetaInPlace(){
  document.querySelectorAll('.dish-meta[data-did]').forEach(el=>{
    const c = CHEFS.find(x=>x.id===state.chefId);
    if(c) el.innerHTML = dishMetaHtml(c.id, el.dataset.did);
  });
}
function reviewerAvatarHtml(pid){
  const p = PARTICIPANTS.find(x=>x.id===pid);
  if(!p) return `<span class="ds-av" style="background:#6b6a8f;">👤</span>`;
  const t = teamOf(p.teamId);
  const style = p.photo ? `background-image:url('${p.photo}');` : `background:${t?t.color:'#F4B740'};`;
  return `<span class="ds-av" style="${style}">${p.photo ? '' : escapeHtml(initials(p.name))}</span>`;
}
function reviewerName(pid){
  const p = PARTICIPANTS.find(x=>x.id===pid);
  return p ? p.name : 'مشارك';
}
function dsStarsRowHtml(n){
  let h = '';
  for(let i=1;i<=CHEF_MAX_STARS;i++) h += `<span class="${i<=n?'on':'off'}">★</span>`;
  return h;
}
/* ---- sheet ---- */
function openDishSheet(cid, did){
  const c = CHEFS.find(x=>x.id===cid); if(!c) return;
  const d = (c.dishes||[]).find(x=>x.id===did); if(!d) return;

  dishSheet = { cid, did, stars: mine ? (mine.s|0) : 0, text: mine ? (mine.t||'') : '', sort:'new' };
  const root = document.createElement('div');
  root.id = 'dish-sheet-root';
  root.innerHTML = `<div class="ds-backdrop" data-action="close-dish-sheet"></div><div class="ds-panel" id="ds-panel"></div>`;

function closeDishSheet(instant){
  const root = document.getElementById('dish-sheet-root');
  if(!root){ if(instant) dishSheet = null; return; }
  const finish = ()=>{ root.remove(); document.body.style.overflow = ''; };
  if(instant){ dishSheet = null; finish(); return; }
  root.classList.add('is-closing');
  dishSheet = null;
  setTimeout(finish, 280);
}
function renderDishSheet(){

  const canRate = !!(state.pid && PARTICIPANTS.find(x=>x.id===state.pid));
  const official = Math.max(0, Math.min(CHEF_MAX_STARS, parseInt(d.stars,10)||0));
  let starBtns = '';
  for(let i=1;i<=CHEF_MAX_STARS;i++) starBtns += `<button type="button" class="ds-star ${i<=dishSheet.stars?'on':''}" data-action="ds-star" data-n="${i}" aria-label="${i}">★</button>`;

      <div class="ds-stars" id="ds-stars">${starBtns}</div>
      <div class="ds-star-label" id="ds-star-label">${DISH_STAR_LABELS[dishSheet.stars]||'دوس على النجوم عشان تقيّم'}</div>
      <textarea class="ds-text" id="ds-text" maxlength="${DISH_REVIEW_MAX_CHARS}" placeholder="اكتب جملة حلوة عن الأكلة... (اختياري)">${escapeHtml(dishSheet.text)}</textarea>
      <div class="ds-counter" id="ds-counter">${dishSheet.text.length}/${DISH_REVIEW_MAX_CHARS}</div>
      <div class="ds-actions" id="ds-actions"></div>`
    : `<div class="ds-login-note">🔐 سجّل دخولك بكودك عشان تقدر تقيّم وتكتب رأيك</div>`;
  panel.innerHTML = `
    <div class="ds-grab"></div>
    <button type="button" class="ds-close" data-action="close-dish-sheet" aria-label="إغلاق">✕</button>
    <div class="ds-head">
      <span class="dish-emoji" style="--g:linear-gradient(145deg,#F6D365,#FDA085)">🍽️</span>
      <div>
        <div class="ds-title">${escapeHtml(d.name)}</div>
        <div class="ds-sub">👨‍🍳 ${escapeHtml(c.name)}</div>
      </div>
    </div>
    <div class="ds-card" id="ds-summary"></div>
    <div class="ds-card">${rateBox}</div>
    <div id="ds-reviews"></div>
  `;
  updateDishSheetDynamic();
}
function updateDishSheetDynamic(){
  if(!dishSheet) return;
  const { cid, did } = dishSheet;
  const c = CHEFS.find(x=>x.id===cid);
  const d = c && (c.dishes||[]).find(x=>x.id===did);
  if(!d) return;
  const st = chefDishStats(cid, did);
  const official = Math.max(0, Math.min(CHEF_MAX_STARS, parseInt(d.stars,10)||0));
  const sumEl = document.getElementById('ds-summary');
  if(sumEl){
    const pct = st.n ? (st.avg/CHEF_MAX_STARS*100) : 0;
    let rows = '';
    for(let i=CHEF_MAX_STARS;i>=1;i--){
      const w = st.n ? Math.round(st.dist[i]/st.n*100) : 0;
      rows += `<div class="ds-drow"><span class="lab">${i}</span><span class="bar"><i style="--w:${w}%"></i></span><span class="num">${st.dist[i]}</span></div>`;
    }
    sumEl.innerHTML = `
      <div class="ds-sum">
        <div class="ds-avg">
          <div class="ds-avg-num">${st.n ? (Math.round(st.avg*10)/10) : '—'}<small> / ${CHEF_MAX_STARS}</small></div>
          <div class="ds-fstars"><span class="bg">★★★★★★★</span><span class="fg" style="width:${pct}%">★★★★★★★</span></div>
          <div class="ds-count">${st.n ? st.n+' تقييم' : 'لسه مفيش تقييمات'}</div>
        </div>
        <div class="ds-dist">${rows}</div>
      </div>
      ${official ? `<div class="ds-official">👨‍🍳 تقييم الأدمن: ${official}/${CHEF_MAX_STARS} ⭐</div>` : ''}`;
  }
  // actions (submit / delete mine)
  const acts = document.getElementById('ds-actions');
  if(acts){
    const mine = state.pid ? ((CHEF_REVIEWS[cid]||{})[did]||{})[state.pid] : null;
    acts.innerHTML = `<button type="button" class="btn btn-primary" data-action="ds-submit">${mine ? '✏️ تحديث تقييمي' : '⭐ إرسال تقييمي'}</button>` +
      (mine ? `<button type="button" class="btn btn-ghost" style="color:var(--danger);" data-action="ds-delete-mine">حذف</button>` : '');
  }
  // reviews list
  const listEl = document.getElementById('ds-reviews');
  if(listEl){
    let revs = chefDishReviews(cid, did);
    const sort = dishSheet.sort;
    revs.sort((a,b)=> sort==='top' ? (b.s-a.s || b.ts-a.ts) : sort==='low' ? (a.s-b.s || b.ts-a.ts) : (b.ts-a.ts));
    // رأيي يظهر أولاً دايمًا
    const mineIdx = revs.findIndex(r=>r.pid===state.pid);
    if(mineIdx>0){ const [m] = revs.splice(mineIdx,1); revs.unshift(m); }
    const sortBtn = (k,l)=>`<button type="button" class="ds-sort ${sort===k?'active':''}" data-action="ds-sort" data-sort="${k}">${l}</button>`;
    const cards = revs.map((r,i)=>`
      <div class="ds-rev ${r.pid===state.pid?'mine':''}" style="--i:${Math.min(i,10)}">
        ${reviewerAvatarHtml(r.pid)}
        <div class="ds-rev-body">
          <div class="ds-rev-top">
            <span class="ds-rev-name">${escapeHtml(reviewerName(r.pid))}</span>
            ${r.pid===state.pid ? '<span class="ds-mine-badge">رأيك</span>' : ''}
            <span class="ds-rev-time">${r.ts ? timeAgoAr(r.ts) : ''}</span>
          </div>
          <div class="ds-rev-stars">${dsStarsRowHtml(r.s)}</div>
          ${r.t ? `<div class="ds-rev-text">${escapeHtml(r.t)}</div>` : ''}
        </div>
      </div>`).join('');
    listEl.innerHTML = `
      <div class="ds-rev-head">
        <div class="ds-rev-title">💬 آراء المشاركين (${revs.length})</div>
        ${revs.length>1 ? `<div class="ds-sorts">${sortBtn('new','الأحدث')}${sortBtn('top','الأعلى')}${sortBtn('low','الأقل')}</div>` : ''}
      </div>
      ${cards || `<div class="ds-empty">🍽️ لسه محدش قيّم الأكلة دي<br>كن أول واحد يكتب رأيه!</div>`}`;
  }
}

async function dsDeleteMine(){

/* ============================= CHEF RATING (تقييم الشيف) ============================= */
const CHEF_MAX_STARS = 7;
let CHEFS = [];            // [{id, name, photoV, dishes:[{id, name, stars}]}]  — الأدمن بس هو اللي بيعدّل
let CHEF_PHOTOS = {};      // id -> dataURL (بنحمّلها لما الصفحة تتفتح)

async function loadChefs(){
  try{ const r = await window.storage.get('glavera-chefs', true); const v = r ? JSON.parse(r.value) : []; return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
async function saveChefs(arr){
  try{ const r = await window.storage.set('glavera-chefs', JSON.stringify(arr), true); return !!r; }
  catch(e){ console.error('saveChefs failed', e); return false; }
}
async function loadChefPhotos(){
  try{ const r = await window.storage.get('glavera-chef-photos', true); const v = r ? JSON.parse(r.value) : {}; return (v && typeof v==='object') ? v : {}; }

}
async function saveChefPhotos(map){

function chefSig(){ return CHEFS.map(c=>c.id+':'+(c.photoV||0)).join('|'); }
async function ensureChefPhotos(){
  const sig = chefSig();
  if(!sig || CHEF_PHOTOS_SIG===sig || CHEF_PHOTOS_LOADING) return;
  CHEF_PHOTOS_LOADING = true;
  try{ CHEF_PHOTOS = await loadChefPhotos(); CHEF_PHOTOS_SIG = sig; }catch(e){}

function chefNewId(prefix){ return prefix + Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36); }
function chefDishesLabel(n){
  if(n===0) return 'لسه مفيش أكلات';
  if(n===1) return 'أكلة واحدة';
  if(n===2) return 'أكلتين';
  if(n<=10) return n+' أكلات';
  return n+' أكلة';
}
function chefAvg(c){
  const d = (c.dishes||[]);
  if(!d.length) return 0;
  return d.reduce((sum,x)=>sum+(+x.stars||0),0)/d.length;
}
const CHEF_GRADS = [
  'linear-gradient(145deg,#F6D365,#FDA085)', 'linear-gradient(145deg,#FF7A59,#F4B740)', 'linear-gradient(145deg,#3FDCC9,#845EC2)',
  'linear-gradient(145deg,#FF6B9D,#845EC2)', 'linear-gradient(145deg,#43E97B,#38F9D7)', 'linear-gradient(145deg,#4FACFE,#00F2FE)'
];
function chefPhotoHtml(c, cls){
  const ph = CHEF_PHOTOS[c.id];
  const grad = CHEF_GRADS[Math.abs(String(c.id).split('').reduce((a,ch)=>a+ch.charCodeAt(0),0)) % CHEF_GRADS.length];
  return ph ? `<span class="chef-photo ${cls||''}" style="background-image:url('${ph}')"></span>`
            : `<span class="chef-photo ${cls||''}" style="background:${grad}">👨‍🍳</span>`;
}
function chefStarsHtml(n){
  let h = '';
  for(let i=1;i<=CHEF_MAX_STARS;i++) h += `<span class="chef-star ${i<=n?'on':''}" style="--k:${i}">★</span>`;
  return h;
}
function renderChefsPage(){
  ensureChefPhotos();
  const head = `
    <div class="back-row">
      <button class="icon-btn" data-action="back">${ICO.back}</button>
      <div class="back-title">${tr('nav_chefs')}</div>
    </div>`;
  if(!CHEFS.length){
    return head + `<div class="empty-note">👨‍🍳 لسه الأدمن مضافش شيفات</div>`;
  }
  const tiles = CHEFS.map((c,i)=>{
    const grad = CHEF_GRADS[i % CHEF_GRADS.length];
    return `
    <button type="button" class="gh-tile chef-tile" style="--g:${grad}; --i:${i}" data-action="open-chef" data-id="${c.id}">
      ${chefPhotoHtml(c)}
      <span class="gh-title">${escapeHtml(c.name)}</span>
      <span class="chef-count">🍽️ ${chefDishesLabel((c.dishes||[]).length)}</span>

  }).join('');
  return head + `
    <div class="gh-lobby-head">
      <div class="gh-lobby-title">شيفات المؤتمر 👨‍🍳</div>
      <div class="gh-lobby-sub">دوس على الشيف عشان تشوف أكلاته وتقييمها</div>
    </div>
    <div class="gh-grid">${tiles}</div>`;
}
const CHEF_MEALS = [
  {id:'breakfast', label:'فطار', icon:'🍳', grad:'linear-gradient(145deg,#F6D365,#FDA085)', sub:'بداية اليوم'},
  {id:'lunch',     label:'غداء', icon:'🍛', grad:'linear-gradient(145deg,#FF7A59,#F4B740)', sub:'الوجبة الرئيسية'},
  {id:'dinner',    label:'عشاء', icon:'🌙', grad:'linear-gradient(145deg,#845EC2,#4FACFE)', sub:'ختام اليوم'},
];
const CHEF_MEAL_OTHER = {id:'other', label:'أخرى', icon:'🍽️', grad:'linear-gradient(145deg,#5FE0A4,#3FDCC9)', sub:'أكلات إضافية'};
function chefMealOf(d){ return CHEF_MEALS.some(m=>m.id===d.meal) ? d.meal : 'other'; }
function chefMealInfo(id){ return CHEF_MEALS.find(m=>m.id===id) || CHEF_MEAL_OTHER; }
function renderChefMealsPage(){
  ensureChefPhotos();
  const c = CHEFS.find(x=>x.id===state.chefId);
  const head = (title)=>`
    <div class="back-row">
      <button class="icon-btn" data-action="back">${ICO.back}</button>
      <div class="back-title">${escapeHtml(title)}</div>
    </div>`;
  if(!c) return head(tr('nav_chefs')) + `<div class="empty-note">الشيف ده مش موجود</div>`;
  const dishes = c.dishes || [];
  const hero = `
    <div class="chef-hero">
      ${chefPhotoHtml(c)}
      <div>
        <div class="chef-hero-name">${escapeHtml(c.name)}</div>
        <div class="chef-hero-meta">🍽️ ${chefDishesLabel(dishes.length)}${dishes.length ? `<br>⭐ متوسط تقييم الأدمن ${(Math.round(chefAvg(c)*10)/10)} / ${CHEF_MAX_STARS}` : ''}</div>
      </div>
    </div>`;
  const list = CHEF_MEALS.slice();
  if(dishes.some(d=>chefMealOf(d)==='other')) list.push(CHEF_MEAL_OTHER);
  const tiles = list.map((m,i)=>{
    const n = dishes.filter(d=>chefMealOf(d)===m.id).length;
    return `
    <button type="button" class="gh-tile meal-tile" style="--g:${m.grad}; --i:${i}" data-action="open-meal" data-meal="${m.id}">

      <span class="gh-title">${m.label}</span>
      <span class="chef-count">🍽️ ${chefDishesLabel(n)}</span>

  }).join('');
  return head(c.name) + hero + `
    <div class="gh-lobby-head" style="margin-top:0;">
      <div class="gh-lobby-title">اختار الوجبة 🍴</div>
      <div class="gh-lobby-sub">دوس على الوجبة عشان تشوف الأكلات وتقيّمها</div>
    </div>
    <div class="gh-grid">${tiles}</div>`;
}
function renderChefDishesPage(){
  ensureChefPhotos();
  if(state.chefId) ensureChefReviews(state.chefId);
  const c = CHEFS.find(x=>x.id===state.chefId);
  const head = (title)=>`
    <div class="back-row">
      <button class="icon-btn" data-action="back">${ICO.back}</button>
      <div class="back-title">${escapeHtml(title)}</div>
    </div>`;
  if(!c) return head(tr('nav_chefs')) + `<div class="empty-note">الشيف ده مش موجود</div>`;
  const meal = chefMealInfo(state.mealId);
  const dishes = (c.dishes || []).filter(d=>chefMealOf(d)===meal.id);
  const avg = chefAvg({dishes});
  const hero = `
    <div class="chef-hero">
      ${chefPhotoHtml(c)}
      <div>
        <div class="chef-hero-name">${escapeHtml(c.name)}</div>
        <div class="chef-hero-meta">${meal.icon} ${meal.label} • ${chefDishesLabel(dishes.length)}${dishes.length ? `<br>⭐ متوسط تقييم الأدمن ${(Math.round(avg*10)/10)} / ${CHEF_MAX_STARS}` : ''}</div>
      </div>
    </div>`;
  if(!dishes.length) return head(c.name+' — '+meal.label) + hero + `<div class="empty-note">${meal.icon} لسه الأدمن مضافش أكلات في ${meal.label}</div>`;
  const DISH_GRADS = ['linear-gradient(145deg,#FF6B6B,#FF9A8B)','linear-gradient(145deg,#FF7A59,#F4B740)','linear-gradient(145deg,#F6D365,#FDA085)',
    'linear-gradient(145deg,#F4B740,#FFDE94)','linear-gradient(145deg,#5FE0A4,#3FDCC9)','linear-gradient(145deg,#3FDCC9,#4FACFE)','linear-gradient(145deg,#FFD25E,#B58BFF)'];
  const tiles = dishes.map((d,i)=>{
    const n = Math.max(0, Math.min(CHEF_MAX_STARS, parseInt(d.stars,10)||0));
    const top = n===CHEF_MAX_STARS;
    return `
    <button type="button" class="gh-tile dish-tile ${top?'is-top':''}" style="--g:${DISH_GRADS[Math.max(0,n-1)]}; --i:${i}" data-action="open-dish" data-cid="${c.id}" data-did="${d.id}">
      <span class="dish-score">${n}/${CHEF_MAX_STARS}</span>
      ${top ? '<span class="dish-crown">👑</span>' : ''}
      <span class="dish-emoji">🍽️</span>
      <span class="dish-name">${escapeHtml(d.name)}</span>
      <span class="dish-stars">${chefStarsHtml(n)}</span>
      <span class="dish-meta" data-did="${d.id}">${dishMetaHtml(c.id, d.id)}</span>
    </button>`;
  }).join('');
  return head(c.name+' — '+meal.label) + hero + `<div class="gh-grid">${tiles}</div>`;
}

/* ---------- ADMIN: chefs ---------- */
function chefStarPickerHtml(value, id, action, extraAttrs){
  let h = `<div class="sp-picker" id="${id||''}" dir="ltr">`;
  for(let i=1;i<=CHEF_MAX_STARS;i++) h += `<button type="button" class="sp-star ${i<=value?'on':''}" data-action="${action}" data-n="${i}" ${extraAttrs||''}>★</button>`;
  return h + '</div>';
}
function chefMealPickerHtml(value, id, action, extraAttrs){
  let h = `<div class="meal-picker" id="${id||''}">`;
  CHEF_MEALS.forEach(m=>{ h += `<button type="button" class="meal-chip ${value===m.id?'on':''}" data-action="${action}" data-meal="${m.id}" ${extraAttrs||''}>${m.icon} ${m.label}</button>`; });
  return h + '</div>';
}
function setMealPickerDom(pickerEl, mealId){
  if(!pickerEl) return;
  pickerEl.querySelectorAll('.meal-chip').forEach(b=>b.classList.toggle('on', b.dataset.meal===mealId));
}
function setPickerDom(pickerEl, n){
  if(!pickerEl) return;
  pickerEl.querySelectorAll('.sp-star').forEach(b=>b.classList.toggle('on', parseInt(b.dataset.n,10)<=n));
}

      ${chefStarPickerHtml(parseInt(d.stars,10)||0, 'dish-picker-'+d.id, 'admin-dish-stars', `data-cid="${c.id}" data-did="${d.id}"`)}
      ${(()=>{ const rv = chefDishReviews(c.id, d.id).sort((a,b)=>b.ts-a.ts); const st = chefDishStats(c.id, d.id);

          (rv.map(r=>`<div class="dish-rev-admin-row"><div class="t"><b>${escapeHtml(reviewerName(r.pid))}</b> — ${'★'.repeat(r.s)}${r.t?`<br>${escapeHtml(r.t)}`:''}</div><button type="button" data-action="admin-delete-review" data-cid="${c.id}" data-did="${d.id}" data-pid="${escapeHtml(r.pid)}" aria-label="حذف">✕</button></div>`).join('') || '<div class="hint">لسه مفيش آراء</div>') + `</details>`; })()}
      <div class="dish-admin-actions">
        <button type="button" class="btn btn-primary" data-action="admin-save-dish-name" data-cid="${c.id}" data-did="${d.id}">💾 حفظ الاسم</button>

    <div class="op-admin-back-link" data-action="admin-chef-back">${ICO.back} رجوع لقائمة الشيفات</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" style="width:56px;height:56px;${ph?`background-image:url('${ph}');background-size:cover;background-position:center;`:'background:linear-gradient(145deg,#F6D365,#FDA085);'}">${ph?'':'👨‍🍳'}</div>
        <div style="font-family:'Cairo',sans-serif;font-weight:800;">${escapeHtml(c.name)}</div>
      </div>
      <label style="margin-top:12px;">اسم الشيف</label>
      <input class="field" id="edit-chef-name-${c.id}" value="${escapeHtml(c.name)}" />
      <label style="margin-top:10px;">تغيير الصورة</label>
      <input type="file" accept="image/*" id="edit-chef-photo-${c.id}" style="font-size:11px;" />
      <button type="button" class="btn btn-primary" style="margin-top:12px;width:100%;" data-action="admin-save-chef" data-id="${c.id}">حفظ بيانات الشيف</button>
      <button type="button" class="btn btn-ghost" style="margin-top:8px;width:100%;color:var(--danger);" data-action="admin-delete-chef" data-id="${c.id}">✕ حذف الشيف وكل أكلاته</button>

      ${chefMealPickerHtml(state.chefNewMeal || 'breakfast', 'new-dish-meal', 'chef-new-meal')}
      <label style="margin-top:10px;">التقييم (من ${CHEF_MAX_STARS} نجوم)</label>
      ${chefStarPickerHtml(newStars, 'new-dish-picker', 'chef-new-stars')}

async function chefPersist(msgOk){
  const ok = await saveChefs(CHEFS);
  if(ok){ if(msgOk) showToast(msgOk); }
  else showToast('⚠️ الحفظ ماتأكدش — اتأكد من الإنترنت وجرّب تاني', true);
  return ok;
}
async function chefSetPhoto(id, dataUrl){
  const map = await loadChefPhotos();       // نقرا الأحدث الأول عشان منمسحش صور شيفات تانيين
  map[id] = dataUrl;
  const ok = await saveChefPhotos(map);
  if(ok) CHEF_PHOTOS = map;
  return ok;
}
async function doAdminAddChef(){
  const nameEl = document.getElementById('new-chef-name');
  const fileEl = document.getElementById('new-chef-photo');
  const name = nameEl ? nameEl.value.trim() : '';
  if(!name){ showToast('اكتب اسم الشيف الأول', true); return; }
  const c = { id: chefNewId('chef'), name, photoV:0, dishes:[] };
  const photo = (fileEl && fileEl.files && fileEl.files[0]) ? await readImageFileToDataUrl(fileEl, 360) : null;
  if(photo){
    const ok = await chefSetPhoto(c.id, photo);
    if(!ok){ showToast('⚠️ الصورة ماتحفظتش — جرّب تاني', true); return; }
    c.photoV = Date.now();
  }
  CHEFS.push(c);
  if(photo) CHEF_PHOTOS_SIG = chefSig();
  await chefPersist('تمت إضافة الشيف ✅');
  state.editingChefId = c.id;
  render();
}
async function doAdminSaveChef(id){
  const c = CHEFS.find(x=>x.id===id); if(!c) return;
  const nameEl = document.getElementById('edit-chef-name-'+id);
  const fileEl = document.getElementById('edit-chef-photo-'+id);
  const name = nameEl ? nameEl.value.trim() : '';
  if(!name){ showToast('اسم الشيف مينفعش يبقى فاضي', true); return; }
  c.name = name;
  if(fileEl && fileEl.files && fileEl.files[0]){
    const photo = await readImageFileToDataUrl(fileEl, 360);
    if(photo){
      const ok = await chefSetPhoto(id, photo);
      if(!ok){ showToast('⚠️ الصورة ماتحفظتش — جرّب تاني', true); return; }
      c.photoV = Date.now();
      CHEF_PHOTOS_SIG = chefSig();
    }
  }
  await chefPersist('تم حفظ بيانات الشيف');
  render();
}
function confirmAdminDeleteChef(id){
  const c = CHEFS.find(x=>x.id===id); if(!c) return;
  showConfirmDialog(`حذف الشيف "${escapeHtml(c.name)}"؟`, async ()=>{
    CHEFS = CHEFS.filter(x=>x.id!==id);
    state.editingChefId = null;
    const map = await loadChefPhotos();
    if(map[id]){ delete map[id]; if(await saveChefPhotos(map)) CHEF_PHOTOS = map; }
    CHEF_PHOTOS_SIG = chefSig();
    try{ await window.storage.delete('glavera-chef-reviews-'+id, true); }catch(e){}
    delete CHEF_REVIEWS[id];
    await chefPersist('تم حذف الشيف');
    render();
  }, {sub:'هيتحذف كمان كل الأكلات المسجلة له'});
}
async function doAdminAddDish(cid){
  const c = CHEFS.find(x=>x.id===cid); if(!c) return;
  const nameEl = document.getElementById('new-dish-name');
  const name = nameEl ? nameEl.value.trim() : '';
  if(!name){ showToast('اكتب اسم الأكلة الأول', true); return; }
  c.dishes = c.dishes || [];
  c.dishes.push({ id: chefNewId('d'), name, stars: state.chefNewStars || 5, meal: state.chefNewMeal || 'breakfast' });
  await chefPersist('تمت إضافة الأكلة 🍽️');
  render();
}
async function doAdminDishMeal(cid, did, meal, el){
  const c = CHEFS.find(x=>x.id===cid); if(!c) return;
  const d = (c.dishes||[]).find(x=>x.id===did); if(!d) return;
  d.meal = meal;
  setMealPickerDom(el ? el.closest('.meal-picker') : null, meal);
  const warn = el ? el.closest('.dish-admin-card').querySelector('.meal-warn') : null;
  if(warn) warn.remove();
  await chefPersist('تم نقل الأكلة إلى '+chefMealInfo(meal).label);
}
async function doAdminDishStars(cid, did, n, el){
  const c = CHEFS.find(x=>x.id===cid); if(!c) return;
  const d = (c.dishes||[]).find(x=>x.id===did); if(!d) return;
  d.stars = n;
  setPickerDom(el ? el.closest('.sp-picker') : null, n);
  await chefPersist();
}
async function doAdminSaveDishName(cid, did){
  const c = CHEFS.find(x=>x.id===cid); if(!c) return;
  const d = (c.dishes||[]).find(x=>x.id===did); if(!d) return;
  const el = document.getElementById('dish-name-'+did);
  const name = el ? el.value.trim() : '';
  if(!name){ showToast('اسم الأكلة مينفعش يبقى فاضي', true); return; }
  d.name = name;
  await chefPersist('تم حفظ اسم الأكلة');
}
function confirmAdminDeleteDish(cid, did){
  const c = CHEFS.find(x=>x.id===cid); if(!c) return;
  const d = (c.dishes||[]).find(x=>x.id===did); if(!d) return;
  showConfirmDialog(`حذف الأكلة "${escapeHtml(d.name)}"؟`, async ()=>{
    c.dishes = c.dishes.filter(x=>x.id!==did);
    await chefReviewsUpdate(cid, (o)=>{ delete o[did]; });
    await chefPersist('تم حذف الأكلة');
    render();
  });
}

/* ============================= GAMES: TIC-TAC-TOE (X-O) ============================= */
function newXoBoard(){ return Array(9).fill(null); }
function xoWinPatterns(){ return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; }
function xoCheckWinner(board){
  const pats = xoWinPatterns();
  for(let i=0;i<pats.length;i++){
    const [a,b,c] = pats[i];
    if(board[a] && board[a]===board[b] && board[a]===board[c]) return {winner:board[a], line:pats[i]};
  }
  if(board.every(c=>c)) return {winner:'draw', line:null};
  return null;
}
function xoMinimax(board, isMax, depth){
  const res = xoCheckWinner(board);
  if(res){
    if(res.winner==='draw') return 0;
    if(res.winner==='O') return 10-depth;
    return depth-10;
  }
  if(isMax){
    let best=-Infinity;
    for(let i=0;i<9;i++){ if(!board[i]){ board[i]='O'; best=Math.max(best, xoMinimax(board,false,depth+1)); board[i]=null; } }
    return best;
  } else {
    let best=Infinity;
    for(let i=0;i<9;i++){ if(!board[i]){ board[i]='X'; best=Math.min(best, xoMinimax(board,true,depth+1)); board[i]=null; } }
    return best;
  }
}
function xoBestMove(board){
  let bestScore=-Infinity, bestIdx=-1;
  for(let i=0;i<9;i++){
    if(!board[i]){
      board[i]='O';
      const score = xoMinimax(board,false,0);
      board[i]=null;
      if(score>bestScore){ bestScore=score; bestIdx=i; }
    }
  }
  return bestIdx;
}
function initXoGame(){
  const prevMode = state.xo ? state.xo.mode : 'ai';
  const prevScore = state.xo ? {x:state.xo.scoreX, o:state.xo.scoreO, d:state.xo.scoreD} : {x:0,o:0,d:0};
  state.xo = { board:newXoBoard(), turn:'X', mode:prevMode, winner:null, line:null,
    scoreX:prevScore.x, scoreO:prevScore.o, scoreD:prevScore.d, busy:false };
}
function xoEndRound(res){
  const g = state.xo;
  g.winner = res.winner; g.line = res.line;
  if(res.winner==='draw'){ g.scoreD++; SND.click(); }
  else{
    if(res.winner==='X') g.scoreX++; else g.scoreO++;
    vibrate([20,20,30]);
    SND.coinChime();
    if(res.winner==='X' || g.mode==='2p'){ launchConfetti(); }
  }
}
function doXoMove(idx){
  const g = state.xo;
  if(!g || g.busy || g.winner || g.board[idx]) return;
  g.board[idx] = g.turn;
  SND.click();
  let res = xoCheckWinner(g.board);
  if(res){ xoEndRound(res); render(); return; }
  g.turn = g.turn==='X' ? 'O' : 'X';
  render();
  if(g.mode==='ai' && g.turn==='O'){
    g.busy = true;
    render();
    setTimeout(()=>{
      const g2 = state.xo;
      if(!g2) return;
      const idxAi = xoBestMove(g2.board);
      if(idxAi>-1){
        g2.board[idxAi] = 'O';
        const res2 = xoCheckWinner(g2.board);
        if(res2){ g2.busy=false; xoEndRound(res2); render(); return; }
        g2.turn = 'X';
      }
      g2.busy = false;
      render();
    }, 550);
  }
}
function renderXoGame(){
  if(!state.xo) initXoGame();
  const g = state.xo;

    const isWin = g.line && g.line.indexOf(i)>-1;

    const disabled = (v || g.winner || (g.mode==='ai' && g.turn==='O')) ? 'disabled' : '';

/* ============================= GAMES: MEMORY MATCH ============================= */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function initMemoryGame(){
  const icons = ['🎓','🏆','🎁','🎯','📿','🎡','🪪','⭐'];
  let cards = [];
  icons.forEach((ic,i)=>{ cards.push({icon:ic}); cards.push({icon:ic}); });
  cards = shuffleArray(cards).map(c=>({icon:c.icon, flipped:false, matched:false}));
  state.memory = { cards, first:null, second:null, moves:0, matches:0, locked:false, startTs:Date.now(), finished:false, elapsed:0 };
}
async function saveMemoryBestIfNeeded(moves, seconds){
  if(!state.pid) return;
  const st = myGameStats(state.pid);
  if(!st.memoryBestMoves || moves < st.memoryBestMoves){
    st.memoryBestMoves = moves;
    st.memoryBestTime = seconds;
    await saveGameStats(GAME_STATS);
  }
}
function doMemoryFlip(idx){
  const g = state.memory;
  if(!g || g.locked || g.finished) return;
  const card = g.cards[idx];
  if(!card || card.flipped || card.matched) return;
  card.flipped = true;
  SND.click();
  if(g.first===null){ g.first = idx; render(); return; }
  if(g.first===idx) return;
  g.second = idx;
  g.moves++;
  render();
  const a = g.cards[g.first], b = g.cards[g.second];
  if(a.icon===b.icon){
    a.matched = true; b.matched = true;
    g.matches++;
    SND.cheer();
    g.first = null; g.second = null;
    if(g.matches===8){
      g.finished = true;
      g.elapsed = Math.round((Date.now()-g.startTs)/1000);
      stopMemoryTicker();
      launchConfetti();
      SND.coinChime();
      saveMemoryBestIfNeeded(g.moves, g.elapsed);
    }
    render();
  } else {
    g.locked = true;
    setTimeout(()=>{
      const g2 = state.memory;
      if(!g2) return;
      const a2 = g2.cards[g.first], b2 = g2.cards[g.second];
      if(a2) a2.flipped = false;
      if(b2) b2.flipped = false;
      g2.first = null; g2.second = null; g2.locked = false;
      render();
    }, 800);
  }
}
let memoryTickInterval = null;
function startMemoryTicker(){
  stopMemoryTicker();
  memoryTickInterval = setInterval(()=>{
    const g = state.memory;
    if(!g || g.finished){ stopMemoryTicker(); return; }
    const el = document.getElementById('memory-timer');
    if(el) el.textContent = Math.floor((Date.now()-g.startTs)/1000)+' ث';
  }, 1000);
}
function stopMemoryTicker(){ if(memoryTickInterval){ clearInterval(memoryTickInterval); memoryTickInterval=null; } }
function renderMemoryGame(){
  if(!state.memory) initMemoryGame();
  const g = state.memory;
  const elapsedNow = g.finished ? g.elapsed : Math.floor((Date.now()-g.startTs)/1000);
  const cellsHtml = g.cards.map((c,i)=>{

      <span class="mc-inner"><span class="mc-back">✨</span><span class="mc-front">${c.icon}</span></span>

  return `

    ${g.finished ? `<div class="xo-status">🎉 خلصت في ${g.moves} حركة و ${g.elapsed} ثانية!</div>` : ''}

const RPS_ICONS = {rock:'✊', paper:'🖐️', scissors:'✌️'};
const RPS_LABELS = {rock:'حجر', paper:'ورقة', scissors:'مقص'};
function rpsBeats(a,b){ return (a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper'); }
function doRpsPick(choice){
  if(!state.rps) state.rps = { score:{win:0,lose:0,draw:0}, lastUser:null, lastCpu:null, resultText:null, spinning:false };
  const g = state.rps;
  if(g.spinning) return;
  g.spinning = true; g.lastUser = choice; g.resultText = null;
  SND.click();
  render();
  setTimeout(()=>{
    const options = ['rock','paper','scissors'];
    const cpu = options[Math.floor(Math.random()*3)];
    g.lastCpu = cpu;
    let outcome;
    if(cpu===choice){ outcome='draw'; g.score.draw++; }
    else if(rpsBeats(choice,cpu)){ outcome='win'; g.score.win++; launchConfetti(); SND.coinChime(); }
    else { outcome='lose'; g.score.lose++; }
    g.resultText = outcome==='win' ? '🎉 فزت في الجولة!' : outcome==='lose' ? '😅 خسرت الجولة، جرب تاني' : '🤝 تعادل';
    g.spinning = false;
    render();
  }, 700);
}

function initNumberGame(){
  state.numguess = { target: 1+Math.floor(Math.random()*100), tries:0, guesses:[], finished:false, guessVal:'' };
}
async function saveNumberBestIfNeeded(tries){
  if(!state.pid) return;
  const st = myGameStats(state.pid);
  if(!st.numberBest || tries < st.numberBest){
    st.numberBest = tries;
    await saveGameStats(GAME_STATS);
  }
}
function doNumberGuess(){
  const g = state.numguess;
  if(!g || g.finished) return;
  const val = parseInt(g.guessVal,10);
  if(isNaN(val) || val<1 || val>100) return;
  g.tries++;
  let hint;
  if(val===g.target){ hint='win'; g.finished=true; }
  else if(val<g.target) hint='up';
  else hint='down';
  g.guesses.unshift({val, hint});
  g.guessVal = '';
  SND.click();
  if(hint==='win'){ launchConfetti(); SND.coinChime(); saveNumberBestIfNeeded(g.tries); }
  render();
}
function numberKeyTap(k){
  const g = state.numguess;
  if(!g || g.finished) return;
  if(k==='back') g.guessVal = g.guessVal.slice(0,-1);
  else if(k==='go') doNumberGuess();
  else if(g.guessVal.length<3) g.guessVal += k;
  render();
}
function renderNumberGame(){
  if(!state.numguess) initNumberGame();
  const g = state.numguess;
  const stats = state.pid ? myGameStats(state.pid) : {};
  const bestLine = stats.numberBest ? `أفضل نتيجة لك: ${stats.numberBest} محاولة` : 'خمن الرقم من أقل محاولات علشان تسجل رقم قياسي 🏅';
  const historyHtml = g.guesses.slice(0,6).map(x=>{
    const icon = x.hint==='win' ? '🎯 صح!' : x.hint==='up' ? '⬆️ أكبر' : '⬇️ أصغر';
    return `<div class="xo-score-pill"><span>${x.val}</span><b>${icon}</b></div>`;
  }).join('');
  return `

function genMathProblem(){
  const ops = ['+','-','×'];
  const op = ops[Math.floor(Math.random()*3)];
  let a,b,answer;
  if(op==='+'){ a=Math.floor(Math.random()*50)+1; b=Math.floor(Math.random()*50)+1; answer=a+b; }
  else if(op==='-'){ a=Math.floor(Math.random()*50)+10; b=Math.floor(Math.random()*a); answer=a-b; }
  else { a=Math.floor(Math.random()*12)+1; b=Math.floor(Math.random()*12)+1; answer=a*b; }
  const options = new Set([answer]);
  let guard=0;
  while(options.size<3 && guard<20){
    guard++;
    const delta = Math.floor(Math.random()*10)-5;
    const fake = answer + (delta===0?1:delta);
    if(fake>=0) options.add(fake);
  }
  const optsArr = shuffleArray(Array.from(options));
  return { a, b, op, answer, options: optsArr };
}

/* ============================= GAMES: CONNECT FOUR ============================= */
function newC4Board(){ return Array.from({length:7}, ()=>[]); } // each column: array of 'R'/'Y', index 0 = bottom
function c4CellAt(board, col, row){
  if(col<0||col>6||row<0||row>5) return null;
  return board[col][row] || null;
}
function c4ValidCols(board){ const r=[]; for(let c=0;c<7;c++) if(board[c].length<6) r.push(c); return r; }
function c4CheckWinner(board){
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for(let col=0;col<7;col++){
    for(let row=0;row<6;row++){
      const p = c4CellAt(board,col,row);
      if(!p) continue;
      for(let d=0;d<dirs.length;d++){
        const dc=dirs[d][0], dr=dirs[d][1];
        const cells=[[col,row]];
        let ok=true;
        for(let k=1;k<4;k++){
          const c2=col+dc*k, r2=row+dr*k;
          if(c4CellAt(board,c2,r2)!==p){ ok=false; break; }
          cells.push([c2,r2]);
        }
        if(ok) return {winner:p, cells};
      }
    }
  }
  if(board.every(c=>c.length===6)) return {winner:'draw', cells:null};
  return null;
}
function c4EvalWindow(win, piece){
  const opp = piece==='Y'?'R':'Y';
  const countP = win.filter(c=>c===piece).length;
  const countE = win.filter(c=>c===null).length;
  const countO = win.filter(c=>c===opp).length;
  let score=0;
  if(countP===4) score+=100;
  else if(countP===3 && countE===1) score+=5;
  else if(countP===2 && countE===2) score+=2;
  if(countO===3 && countE===1) score-=4;
  return score;
}
function c4ScorePosition(board, piece){
  let score=0;
  score += board[3].filter(c=>c===piece).length*3;
  for(let row=0;row<6;row++){
    const rowArr=[]; for(let col=0;col<7;col++) rowArr.push(c4CellAt(board,col,row));
    for(let c=0;c<4;c++) score += c4EvalWindow(rowArr.slice(c,c+4), piece);
  }
  for(let col=0;col<7;col++){
    const colArr=[]; for(let row=0;row<6;row++) colArr.push(c4CellAt(board,col,row));
    for(let r=0;r<3;r++) score += c4EvalWindow(colArr.slice(r,r+4), piece);
  }
  for(let row=0;row<3;row++){
    for(let col=0;col<4;col++){ const w=[0,1,2,3].map(i=>c4CellAt(board,col+i,row+i)); score += c4EvalWindow(w, piece); }
  }
  for(let row=3;row<6;row++){
    for(let col=0;col<4;col++){ const w=[0,1,2,3].map(i=>c4CellAt(board,col+i,row-i)); score += c4EvalWindow(w, piece); }
  }
  return score;
}
function c4Minimax(board, depth, alpha, beta, maximizing){
  const res = c4CheckWinner(board);
  const valid = c4ValidCols(board);
  if(res || depth===0 || valid.length===0){
    if(res){
      if(res.winner==='Y') return {score:1000000+depth};
      if(res.winner==='R') return {score:-1000000-depth};
      return {score:0};
    }
    return {score:c4ScorePosition(board,'Y')};
  }
  const order=[3,2,4,1,5,0,6].filter(c=>valid.indexOf(c)>-1);
  if(maximizing){
    let value=-Infinity, bestCol=order[0];
    for(let i=0;i<order.length;i++){
      const col=order[i];
      board[col].push('Y');
      const r = c4Minimax(board, depth-1, alpha, beta, false);
      board[col].pop();
      if(r.score>value){ value=r.score; bestCol=col; }
      alpha=Math.max(alpha,value);
      if(alpha>=beta) break;
    }
    return {score:value, col:bestCol};
  } else {
    let value=Infinity, bestCol=order[0];
    for(let i=0;i<order.length;i++){
      const col=order[i];
      board[col].push('R');
      const r = c4Minimax(board, depth-1, alpha, beta, true);
      board[col].pop();
      if(r.score<value){ value=r.score; bestCol=col; }
      beta=Math.min(beta,value);
      if(alpha>=beta) break;
    }
    return {score:value, col:bestCol};
  }
}
function c4BestMove(board){
  const r = c4Minimax(board, 4, -Infinity, Infinity, true);
  return typeof r.col==='number' ? r.col : c4ValidCols(board)[0];
}
function initConnect4Game(){
  const prevMode = state.connect4 ? state.connect4.mode : 'ai';
  const prevScore = state.connect4 ? {r:state.connect4.scoreR, y:state.connect4.scoreY, d:state.connect4.scoreD} : {r:0,y:0,d:0};
  const prevColors = state.connect4 ? {r:state.connect4.colorR, y:state.connect4.colorY} : {r:'red', y:'yellow'};
  state.connect4 = { board:newC4Board(), turn:'R', mode:prevMode, winner:null, winCells:null,

}

        g2.turn = 'R';
      }
      g2.busy = false;
      render();
    }, 550);
  }
}

/* ============================= GAMES: DOMINO ============================= */
const DOMINO_PIPS = {0:[],1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function dominoHalfHtml(n){
  let dots='';
  for(let i=1;i<=9;i++){ dots += (DOMINO_PIPS[n]||[]).indexOf(i)>-1 ? '<i class="dpip"></i>' : '<i class="dpip empty"></i>'; }
  return `<span class="domino-half">${dots}</span>`;
}
function dominoFullSet(){
  const s=[]; for(let a=0;a<=6;a++) for(let b=a;b<=6;b++) s.push({a,b});
  return s;
}
function dominoHandCanPlay(hand, ends){
  if(!ends) return hand.length>0;
  return hand.some(t=> t.a===ends.left || t.b===ends.left || t.a===ends.right || t.b===ends.right);
}
function dominoPlayableSides(tile, ends){
  if(!ends) return ['any'];
  const sides=[];
  if(tile.a===ends.left || tile.b===ends.left) sides.push('left');
  if(tile.a===ends.right || tile.b===ends.right) sides.push('right');
  return sides;
}
function dominoDraw(player, g){
  g = g || state.domino;
  if(!g || g.boneyard.length===0) return null;
  const t = g.boneyard.pop();
  g.hands[player].push(t);
  return t;
}
function dominoPlaceTile(side, idx, player, g){
  g = g || state.domino;
  const hand = g.hands[player];
  const tile = hand[idx];
  if(!tile) return;
  if(!g.ends){
    g.chain.push({left:tile.a, right:tile.b});
    g.ends = {left:tile.a, right:tile.b};
  } else if(side==='left'){
    const attach = g.ends.left;
    const newVal = (tile.a===attach) ? tile.b : tile.a;
    g.chain.unshift({left:newVal, right:attach});
    g.ends.left = newVal;
  } else {
    const attach = g.ends.right;
    const newVal = (tile.a===attach) ? tile.b : tile.a;
    g.chain.push({left:attach, right:newVal});
    g.ends.right = newVal;
  }
  hand.splice(idx,1);
}
function initDominoGame(){
  const prevMode = state.domino ? state.domino.mode : 'ai';
  const prevScore = state.domino ? {r:state.domino.scoreR, y:state.domino.scoreY, d:state.domino.scoreD} : {r:0,y:0,d:0};
  const deck = shuffleArray(dominoFullSet());
  const handR = deck.splice(0,7);
  const handY = deck.splice(0,7);
  const boneyard = deck;
  let starter = 'R', bestDouble = -1;
  handR.forEach(t=>{ if(t.a===t.b && t.a>bestDouble){ bestDouble=t.a; starter='R'; } });
  handY.forEach(t=>{ if(t.a===t.b && t.a>bestDouble){ bestDouble=t.a; starter='Y'; } });
  state.domino = {
    mode: prevMode,
    hands: {R:handR, Y:handY},
    boneyard, chain:[], ends:null,
    turn: starter, winner:null, blocked:false,
    scoreR:prevScore.r, scoreY:prevScore.y, scoreD:prevScore.d,
    busy:false, pendingIdx:null, passStreak:0
  };
}
function dominoEndRound(res){
  const g = state.domino;
  g.winner = res.winner; g.blocked = !!res.blocked;
  if(res.winner==='draw'){ g.scoreD++; SND.click(); }
  else{
    if(res.winner==='R') g.scoreR++; else g.scoreY++;
    vibrate([20,20,30]);
    SND.coinChime();
    if(res.winner==='R' || g.mode==='2p'){ launchConfetti(); }
  }
}
function dominoAfterMove(){
  const g = state.domino;
  if(!g) return;
  if(g.hands.R.length===0){ dominoEndRound({winner:'R'}); render(); return; }
  if(g.hands.Y.length===0){ dominoEndRound({winner:'Y'}); render(); return; }
  g.turn = g.turn==='R' ? 'Y' : 'R';
  dominoProcessTurn(false);
}
function dominoProcessTurn(silent){
  const g = state.domino;
  if(!g) return;
  let guard = 0;
  while(guard++<4){
    const player = g.turn;
    const hand = g.hands[player];
    while(!dominoHandCanPlay(hand, g.ends) && g.boneyard.length>0){ dominoDraw(player); }
    if(dominoHandCanPlay(hand, g.ends)){
      g.passStreak = 0;
      if(g.mode==='ai' && player==='Y'){
        g.busy = true;
        if(!silent) render();
        setTimeout(()=>{ dominoAiMove(); }, 650);
      } else {
        g.busy = false;
        if(!silent) render();
      }
      return;
    }
    g.passStreak = (g.passStreak||0)+1;
    if(g.passStreak>=2){
      const sumR = g.hands.R.reduce((s,t)=>s+t.a+t.b,0);
      const sumY = g.hands.Y.reduce((s,t)=>s+t.a+t.b,0);
      const winner = sumR<sumY ? 'R' : (sumY<sumR ? 'Y' : 'draw');
      dominoEndRound({winner, blocked:true});
      if(!silent) render();
      return;
    }
    g.turn = player==='R' ? 'Y' : 'R';
  }
  if(!silent) render();
}
function dominoAiMove(){
  const g = state.domino;
  if(!g) return;
  const hand = g.hands.Y;
  let candidates = [];
  hand.forEach((t,idx)=>{
    const sides = dominoPlayableSides(t, g.ends);
    if(sides.length===0) return;
    if(sides[0]==='any') candidates.push({idx, side:'left', tile:t});
    else sides.forEach(side=> candidates.push({idx, side, tile:t}));
  });
  if(candidates.length===0){ g.busy=false; dominoAfterMove(); return; }
  candidates.sort((c1,c2)=>{
    const d1 = c1.tile.a===c1.tile.b ? 1:0, d2 = c2.tile.a===c2.tile.b ? 1:0;
    if(d2!==d1) return d2-d1;
    return (c2.tile.a+c2.tile.b) - (c1.tile.a+c1.tile.b);
  });
  const choice = candidates[0];
  dominoPlaceTile(choice.side, choice.idx, 'Y');
  SND.click();
  g.busy = false;
  dominoAfterMove();
}
function doDominoTileTap(idx){
  const g = state.domino;
  if(!g || g.busy || g.winner) return;
  if(g.mode==='ai' && g.turn==='Y') return;
  if(g.pendingIdx!=null) return;
  const player = g.turn;
  const hand = g.hands[player];
  const tile = hand[idx];
  if(!tile) return;
  const sides = dominoPlayableSides(tile, g.ends);
  if(sides.length===0) return;
  if(sides.length===1){
    dominoPlaceTile(sides[0]==='any'?'left':sides[0], idx, player);
    SND.click();
    dominoAfterMove();
    return;
  }
  g.pendingIdx = idx;
  render();
}
function doDominoChooseSide(side){
  const g = state.domino;
  if(!g || g.pendingIdx==null) return;
  dominoPlaceTile(side, g.pendingIdx, g.turn);
  g.pendingIdx = null;
  SND.click();
  dominoAfterMove();
}
function renderDominoGame(){
  if(!state.domino) initDominoGame();
  const g = state.domino;
  const activePlayer = g.turn;
  const inactivePlayer = activePlayer==='R' ? 'Y' : 'R';

  const activeLabel = activePlayer==='R' ? '🔴 دورك، اختار قطعة 👇' : (g.mode==='ai' ? '🤖 دور الجهاز' : '🟡 دور اللاعب 2');
  const inactiveLabel = inactivePlayer==='R' ? '🔴 انت' : (g.mode==='ai' ? '🤖 الجهاز' : '🟡 اللاعب 2');
  const inactiveCount = g.hands[inactivePlayer].length;
  const backTiles = Array.from({length:inactiveCount}).map(()=>`<span class="domino-back"></span>`).join('');
  const chainHtml = g.chain.length
    ? g.chain.map(t=>`<span class="domino-tile-h">${dominoHalfHtml(t.left)}${dominoHalfHtml(t.right)}</span>`).join('')
    : `<div class="domino-empty-hint">حط أول قطعة 👇</div>`;
  const activeHand = g.hands[activePlayer];
  const handHtml = activeHand.map((t,i)=>{
    const sides = isHumanInteractive ? dominoPlayableSides(t, g.ends) : [];
    const playable = sides.length>0;
    const dis = (isHumanInteractive && playable) ? '' : 'disabled';
    return `<button type="button" class="domino-tile ${playable?'playable':''}" data-action="domino-tile" data-idx="${i}" ${dis}>${dominoHalfHtml(t.a)}${dominoHalfHtml(t.b)}</button>`;
  }).join('');
  let statusText;
  if(g.winner==='draw') statusText = g.blocked ? '🤝 اتقفلت اللعبة وتعادلتوا في النقط!' : '🤝 تعادل!';
  else if(g.winner==='R') statusText = g.blocked ? '🎉 اتقفلت اللعبة وفزت بأقل نقط!' : '🎉 فزت! خلصت قطعك الأول';
  else if(g.winner==='Y') statusText = g.mode==='ai'
      ? (g.blocked ? '🤖 اتقفلت اللعبة وفاز الجهاز بأقل نقط' : '🤖 فاز الجهاز، حظ أوفر!')
      : (g.blocked ? '🟡 اتقفلت اللعبة وفاز اللاعب 2 بأقل نقط' : '🟡 فاز اللاعب 2! خلص قطعه الأول');
  else if(g.busy) statusText = '🤖 الجهاز بيفكر...';
  else if(g.pendingIdx!=null) statusText = 'القطعة دي بتتحط في الطرفين، اختار فين 👇';
  else statusText = activeLabel;
  const pendingButtons = (g.pendingIdx!=null) ? `

let GAME_ROOMS = {};
async function loadGameRooms(){
  try{ const r = await window.storage.get('glavera-game-rooms', true); return r?JSON.parse(r.value):{}; }catch(e){ return {}; }
}
async function saveGameRooms(obj){
  try{ await window.storage.set('glavera-game-rooms', JSON.stringify(obj), true); }catch(e){}
}
function genRoomCode(){
  let code;
  do{ code = String(Math.floor(1000+Math.random()*9000)); }while(GAME_ROOMS[code]);
  return code;
}
async function createGameRoom(gameType){
  const p = PARTICIPANTS.find(x=>x.id===state.pid);
  GAME_ROOMS = await loadGameRooms();
  const code = genRoomCode();
  const room = {
    code, game:gameType, status:'waiting',
    hostId: state.pid, hostName: p ? p.name : 'مضيف',
    guestId:null, guestName:null,
    updatedAt: Date.now()
  };
  if(gameType==='xo'){
    Object.assign(room, {board:newXoBoard(), turn:'X', round:0, winner:null, line:null, scoreX:0, scoreO:0, scoreD:0});
  } else if(gameType==='domino'){
    const deck = shuffleArray(dominoFullSet());
    const hostHand = deck.splice(0,7);
    const guestHand = deck.splice(0,7);
    const boneyard = deck;
    Object.assign(room, {hands:{host:hostHand, guest:guestHand}, boneyard, chain:[], ends:null,
      turn:'host', round:0, winner:null, blocked:false, pendingIdx:null, passStreak:0,
      scoreHost:0, scoreGuest:0, scoreDraw:0});
  } else if(gameType==='connect4'){
    Object.assign(room, {board:newC4Board(), turn:'host', round:0, hostColor:null, guestColor:null,
      winner:null, winCells:null, scoreHost:0, scoreGuest:0, scoreDraw:0});
  } else if(gameType==='memory'){
    const icons = ['🎓','🏆','🎁','🎯','📿','🎡','🪪','⭐'];
    Object.assign(room, {cards:shuffleArray(icons.concat(icons)), flipped:[], matched:{}, turn:'host', round:0,
      winner:null, scoreHost:0, scoreGuest:0});
  } else if(gameType==='numguess'){
    Object.assign(room, {target:1+Math.floor(Math.random()*100), guesses:[], turn:'host', round:0,
      winner:null, scoreHost:0, scoreGuest:0});
  } else if(gameType==='math'){
    Object.assign(room, {problem:genMathProblem(), qIndex:0, total:10, locked:{host:false,guest:false},
      finished:false, winner:null, scoreHost:0, scoreGuest:0});
  } else {
    Object.assign(room, {hostPick:null, guestPick:null, resultText:null, scoreHost:0, scoreGuest:0, scoreDraw:0});
  }
  GAME_ROOMS[code] = room;
  await saveGameRooms(GAME_ROOMS);
  state.roomCode = code;
  startRoomPolling();
  go('room-'+gameType);
}
async function joinGameRoom(code){
  code = (code||'').trim();

  GAME_ROOMS = await loadGameRooms();

  state.roomCode = code;

function roomDominoEndRound(room, winner, blocked){
  room.winner = winner;
  room.blocked = !!blocked;
  if(winner==='draw') room.scoreDraw++;
  else if(winner==='host') room.scoreHost++; else room.scoreGuest++;
}
function roomDominoAdvance(room){
  if(room.hands.host.length===0){ roomDominoEndRound(room, 'host'); return; }
  if(room.hands.guest.length===0){ roomDominoEndRound(room, 'guest'); return; }
  room.turn = room.turn==='host' ? 'guest' : 'host';
  let guard = 0;
  while(guard++<4){
    const player = room.turn;
    const hand = room.hands[player];
    while(!dominoHandCanPlay(hand, room.ends) && room.boneyard.length>0){ dominoDraw(player, room); }
    if(dominoHandCanPlay(hand, room.ends)){ room.passStreak = 0; return; }
    room.passStreak = (room.passStreak||0)+1;
    if(room.passStreak>=2){
      const sumHost = room.hands.host.reduce((s,t)=>s+t.a+t.b,0);
      const sumGuest = room.hands.guest.reduce((s,t)=>s+t.a+t.b,0);
      const winner = sumHost<sumGuest ? 'host' : (sumGuest<sumHost ? 'guest' : 'draw');
      roomDominoEndRound(room, winner, true);
      return;
    }
    room.turn = player==='host' ? 'guest' : 'host';
  }
}
async function doRoomDominoMove(idx){
  GAME_ROOMS = await loadGameRooms();
  const room = GAME_ROOMS[state.roomCode];
  if(!room || room.status!=='playing' || room.winner) return;
  const myRole = room.hostId===state.pid ? 'host' : 'guest';
  if(room.turn!==myRole || room.pendingIdx!=null) return;
  const hand = room.hands[myRole];
  const tile = hand[idx];
  if(!tile) return;
  const sides = dominoPlayableSides(tile, room.ends);
  if(sides.length===0) return;
  SND.click();
  if(sides.length===1){
    dominoPlaceTile(sides[0]==='any'?'left':sides[0], idx, myRole, room);
    roomDominoAdvance(room);
  } else {
    room.pendingIdx = idx;
  }
  room.updatedAt = Date.now();
  await saveGameRooms(GAME_ROOMS);
  render();
  if(room.winner){
    vibrate([20,20,30]); SND.coinChime();
    if(room.winner===myRole) launchConfetti();
  }
}

/* ---------- rooms: shared helpers for the new games ---------- */
function roomGate(title, room){
  if(!room){
    return `<div class="back-row"><button class="icon-btn" data-action="back">${ICO.back}</button><div class="back-title">${title}</div></div><div class="hint" style="text-align:center;margin-top:20px;">الغرفة مش موجودة أو خلصت</div>`;
  }
  if(room.status==='waiting'){
    return `<div class="back-row"><button class="icon-btn" data-action="leave-room">${ICO.back}</button><div class="back-title">${title} - غرفة</div></div>${renderRoomWaiting(room)}`;
  }
  return null;
}
function roomHead(title, room){
  return `<div class="back-row"><button class="icon-btn" data-action="leave-room">${ICO.back}</button><div class="back-title">${title} - غرفة ${room.code}</div></div>`;
}
function roomMe(room){
  const isHost = room.hostId===state.pid;
  return { isHost, role:isHost?'host':'guest', oppRole:isHost?'guest':'host', myId:state.pid, oppId:isHost?room.guestId:room.hostId,
    myScore:isHost?room.scoreHost:room.scoreGuest, oppScore:isHost?room.scoreGuest:room.scoreHost };
}
function roomWinnerByScore(room){
  return room.scoreHost>room.scoreGuest ? 'host' : (room.scoreGuest>room.scoreHost ? 'guest' : 'draw');
}
function roomTouch(room){ room.updatedAt = Date.now(); }

/* ---------- rooms: CONNECT FOUR (each player picks a disc color) ---------- */
function roomC4ColorsReady(room){
  return !!room.hostColor && !!room.guestColor && room.hostColor!==room.guestColor;
}
async function doRoomC4Color(colorId){
  GAME_ROOMS = await loadGameRooms();
  const room = GAME_ROOMS[state.roomCode];
  if(!room || room.status!=='playing') return;

  if(oppColor===colorId){ showToast('صاحبك اختار اللون ده، اختار لون تاني', true); render(); return; }
  if(isHost) room.hostColor = colorId; else room.guestColor = colorId;
  roomTouch(room);
  await saveGameRooms(GAME_ROOMS);

}
async function doRoomC4Move(col){
  GAME_ROOMS = await loadGameRooms();
  const room = GAME_ROOMS[state.roomCode];
  if(!room || room.status!=='playing' || room.winner || !roomC4ColorsReady(room)) return;
  const role = room.hostId===state.pid ? 'host' : 'guest';
  if(room.turn!==role) return;
  if(!room.board[col] || room.board[col].length>=6) return;
  const slot = role==='host' ? 'R' : 'Y';
  room.board[col].push(slot);
  SND.click();
  const res = c4CheckWinner(room.board);
  if(res){
    room.winner = res.winner; room.winCells = res.cells;
    if(res.winner==='draw') room.scoreDraw++;
    else if(res.winner==='R') room.scoreHost++; else room.scoreGuest++;
  } else {
    room.turn = role==='host' ? 'guest' : 'host';
  }
  roomTouch(room);
  await saveGameRooms(GAME_ROOMS);
  render();
  if(res && res.winner!=='draw'){
    vibrate([20,20,30]); SND.coinChime();
    if(res.winner===slot) launchConfetti();
  }
}

/* ---------- rooms: MEMORY (turn based, matching a pair keeps your turn) ---------- */
async function doRoomMemoryFlip(idx){
  GAME_ROOMS = await loadGameRooms();
  const room = GAME_ROOMS[state.roomCode];
  if(!room || room.status!=='playing' || room.winner) return;
  const role = room.hostId===state.pid ? 'host' : 'guest';
  if(room.turn!==role) return;
  room.flipped = room.flipped || []; room.matched = room.matched || {};
  if(room.flipped.length>=2) room.flipped = [];      // نخبّي الكارتين الغلط اللي كانوا ظاهرين
  if(room.matched[idx]!==undefined || room.flipped.indexOf(idx)>-1) return;
  room.flipped.push(idx);
  SND.click();
  let iWon = false;
  if(room.flipped.length===2){
    const a = room.flipped[0], b = room.flipped[1];
    if(room.cards[a]===room.cards[b]){
      room.matched[a] = role; room.matched[b] = role; room.flipped = [];
      if(role==='host') room.scoreHost++; else room.scoreGuest++;
      SND.cheer();
      if(Object.keys(room.matched).length>=room.cards.length){
        room.winner = roomWinnerByScore(room);
        iWon = room.winner===role;
      }
    } else {
      room.turn = role==='host' ? 'guest' : 'host';
    }
  }
  roomTouch(room);
  const stamp = room.updatedAt;
  const mismatch = room.flipped.length===2;
  await saveGameRooms(GAME_ROOMS);
  render();
  if(room.winner){ vibrate([20,20,30]); SND.coinChime(); if(iWon) launchConfetti(); }
  if(mismatch){
    setTimeout(async ()=>{
      try{
        const fresh = await loadGameRooms();
        const r = fresh[state.roomCode];
        if(r && r.updatedAt===stamp && r.flipped && r.flipped.length===2){
          r.flipped = []; roomTouch(r);
          GAME_ROOMS = fresh;
          await saveGameRooms(fresh);
          render();
        }
      }catch(e){}
    }, 1300);
  }
}

/* ---------- rooms: NUMBER GUESS (take turns, shared hints) ---------- */
async function doRoomNumGuess(){
  const val = parseInt(state.roomGuessVal,10);
  if(isNaN(val) || val<1 || val>100) return;
  GAME_ROOMS = await loadGameRooms();
  const room = GAME_ROOMS[state.roomCode];
  if(!room || room.status!=='playing' || room.winner) return;
  const role = room.hostId===state.pid ? 'host' : 'guest';
  if(room.turn!==role) return;
  let hint;
  if(val===room.target){ hint='win'; room.winner = role; if(role==='host') room.scoreHost++; else room.scoreGuest++; }
  else { hint = val<room.target ? 'up' : 'down'; room.turn = role==='host' ? 'guest' : 'host'; }
  room.guesses.unshift({val, hint, by:role});
  state.roomGuessVal = '';
  SND.click();
  roomTouch(room);
  await saveGameRooms(GAME_ROOMS);
  render();
  if(hint==='win'){ launchConfetti(); SND.coinChime(); }
}
function roomNumKeyTap(k){

  if(!room || room.winner || room.turn!==(room.hostId===state.pid?'host':'guest')) return;
  if(k==='back') state.roomGuessVal = (state.roomGuessVal||'').slice(0,-1);
  else if(k==='go'){ doRoomNumGuess(); return; }
  else if((state.roomGuessVal||'').length<3) state.roomGuessVal = (state.roomGuessVal||'') + k;
  render();
}

/* ---------- rooms: QUICK MATH (race — fastest correct answer scores) ---------- */
function roomMathAdvance(room){
  room.qIndex++;
  if(room.qIndex>=room.total){ room.finished = true; room.winner = roomWinnerByScore(room); }
  else { room.problem = genMathProblem(); room.locked = {host:false, guest:false}; }
}
async function doRoomMathPick(val){
  GAME_ROOMS = await loadGameRooms();
  const room = GAME_ROOMS[state.roomCode];
  if(!room || room.status!=='playing' || room.finished) return;
  const role = room.hostId===state.pid ? 'host' : 'guest';
  if(room.locked[role]) return;
  if(parseInt(val,10)===room.problem.answer){
    if(role==='host') room.scoreHost++; else room.scoreGuest++;
    SND.cheer();
    roomMathAdvance(room);
  } else {
    room.locked[role] = true;
    vibrate(30);
    if(room.locked.host && room.locked.guest) roomMathAdvance(room);
  }
  roomTouch(room);
  await saveGameRooms(GAME_ROOMS);
  render();
  if(room.finished){ SND.coinChime(); if(room.winner===role) launchConfetti(); }
}

  GAME_ROOMS = await loadGameRooms();

  if(!room) return;
  Object.assign(room, {problem:genMathProblem(), qIndex:0, locked:{host:false,guest:false}, finished:false, winner:null, scoreHost:0, scoreGuest:0});

  await saveGameRooms(GAME_ROOMS);

}

let _chatRecorder = null, _chatRecordChunks = [], _chatRecordStart = 0, _chatRecordTimer = null;
async function toggleChatVoiceRecording(){
  if(state.chatRecording){ stopChatVoiceRecording(); return; }
  if(typeof navigator === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('المتصفح ده مش بيدعم تسجيل الصوت', true);
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    _chatRecordChunks = [];
    _chatRecorder = new MediaRecorder(stream);
    _chatRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) _chatRecordChunks.push(e.data); };
    _chatRecorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const durationSec = Math.max(1, Math.round((Date.now()-_chatRecordStart)/1000));
      const blob = new Blob(_chatRecordChunks, { type:'audio/webm' });
      const reader = new FileReader();
      reader.onload = async ()=>{ await sendChatMediaMessage('voice', reader.result, durationSec); };
      reader.readAsDataURL(blob);
    };
    _chatRecorder.start();
    _chatRecordStart = Date.now();
    state.chatRecording = true;
    render();
    _chatRecordTimer = setTimeout(()=>{ if(_chatRecorder && _chatRecorder.state==='recording') stopChatVoiceRecording(); }, 60000); // حد أقصى دقيقة للرسالة الصوتية
  }catch(e){
    console.error('getUserMedia failed:', e);
    showToast('محتاجين إذن الميكروفون عشان تسجل رسالة صوتية', true);
  }
}
function stopChatVoiceRecording(){
  if(_chatRecordTimer){ clearTimeout(_chatRecordTimer); _chatRecordTimer = null; }
  if(_chatRecorder && _chatRecorder.state==='recording') _chatRecorder.stop();
  state.chatRecording = false;
  render();
}

let _chatMediaRetryTimer = null;
function scheduleChatMediaUploadRetry(){
  if(_chatMediaRetryTimer) return;
  if(!PENDING_CHAT_MEDIA_UPLOADS.length) return;
  _chatMediaRetryTimer = setTimeout(async ()=>{
    _chatMediaRetryTimer = null;
    await processPendingChatMediaUploads();
    if(PENDING_CHAT_MEDIA_UPLOADS.length) scheduleChatMediaUploadRetry();
  }, 20000);
}
async function processPendingChatMediaUploads(){
  if(!PENDING_CHAT_MEDIA_UPLOADS.length) return;
  if(navigator.onLine === false) return;
  const queue = PENDING_CHAT_MEDIA_UPLOADS.slice();
  let doneAny = false;
  for(const item of queue){
    const saved = await saveChatMedia(item.mediaId, item.dataUrl, 1);
    if(saved){
      PENDING_CHAT_MEDIA_UPLOADS = PENDING_CHAT_MEDIA_UPLOADS.filter(x=>x.mediaId!==item.mediaId);
      doneAny = true;
    }
  }
  if(doneAny){
    await saveChatMessagesWithRetry(CHAT_MESSAGES);
    showToast('✅ اترفعت رسايل الشات اللي كانت مستنية');
  }
}
function attachChatInputs(){
  const photoInput = document.getElementById('chat-photo-input');
  if(photoInput && !photoInput.dataset.bound){
    photoInput.dataset.bound = '1';
    photoInput.addEventListener('change', ()=>{
      const file = photoInput.files && photoInput.files[0];
      photoInput.value = '';
      if(file) doSendChatPhoto(file);
    });
  }
  const videoInput = document.getElementById('chat-video-input');
  if(videoInput && !videoInput.dataset.bound){
    videoInput.dataset.bound = '1';
    videoInput.addEventListener('change', ()=>{
      const file = videoInput.files && videoInput.files[0];
      videoInput.value = '';
      if(file) doSendChatVideo(file);
    });
  }
  const textInput = document.getElementById('chat-text-input');
  if(textInput && !textInput.dataset.bound){
    textInput.dataset.bound = '1';
    textInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doSendChatText(); } });
  }
  scrollChatToBottom();
}
if(typeof window !== 'undefined'){
  window.addEventListener('online', ()=>{ processPendingChatMediaUploads(); });
}

/* ============================= RENDER: DAY ============================= */
function renderDay(){
  const p = PARTICIPANTS.find(x=>x.id===state.pid);
  const day = DAYS.find(d=>d.id===state.dayId);
  const total = dayTotal(p.id, day);
  const dayMaxPts = day.sessions.reduce((s,ses)=>s+(ses.points||0),0);
  const dayPct = dayMaxPts ? Math.min(100, Math.round((total/dayMaxPts)*100)) : 0;
  const liveSession = findLiveSessionForDay(day);
  const liveNow = liveSession ? `
    <div class="card live-now-card">
      <span class="live-now-tag"><span class="live-dot"></span> ${tr('day_live_now')}</span>
      <div class="live-now-title">${escapeHtml(liveSession.name)}</div>
    </div>` : '';
  const isEmpty = day.sessions.every(s=>sessionPoints(p.id,s.id)===0);
  const extra = myExtra(p.id);
  const remindersOff = extra.remindersOff || {};
  const rows = day.sessions.map((s,i)=>{
    const pts = sessionPoints(p.id, s.id);
    const done = pts>0;
    const closed = !done && (s.locked || day.locked);
    const info = SESSION_INFO[s.id] || {};
    const timeStr = (info.timeFrom||info.timeTo) ? `${info.timeFrom||''}${info.timeFrom&&info.timeTo?' - ':''}${info.timeTo||''}` : '';
    const reminderOn = !remindersOff[s.id];
    const pointsOff = info.pointsEnabled===false;
    const subText = pointsOff ? 'بدون نقاط' : (done ? tr('day_pts_earned')+' '+pts : (closed ? tr('day_locked_temp') : tr('day_scan_hint')));
    return `<div class="session-glass ${closed?'is-locked':''} ${done?'is-done':''}" data-action="open-session" data-session="${s.id}">
      <span class="sg-shine"></span>
      <div class="sg-top-row">
        <div class="sg-num-title">
          <div class="sg-num">${info.logo?`<img src="${info.logo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;" />`:(i+1)}</div>
          <div class="sg-title">${escapeHtml(s.name)}</div>
        </div>
        ${(!done && !closed && !pointsOff)?`<button type="button" class="reminder-bell ${reminderOn?'on':''}" data-action="toggle-reminder" data-session="${s.id}" title="${tr('day_reminder_title')}">${reminderOn?'🔔':'🔕'}</button>`:''}
      </div>
      <span class="type-badge">${ICO[s.type]||''} ${SESSION_TYPE_LABELS[s.type]||''}</span>
      <div class="sg-sub">${subText}${timeStr?' · '+escapeHtml(timeStr):''}</div>
      <div class="lr-badge ${pointsOff?'':(done?'done':(closed?'locked':'pending'))}">${pointsOff?'🪙 بدون نقاط':(done? '+'+pts : (closed? lockIconSvg()+' '+tr('day_locked_lab') : tr('day_not_attended')))}</div>
    </div>`;
  }).join('');

  return `
    <div class="back-row" id="day-back-row">
      <button class="icon-btn" data-action="back">${ICO.back}</button>
    </div>
    ${liveNow}
    <div class="day-total-ring-card" id="day-total-card">
      <div class="day-total-ring-wrap">
        <svg class="day-total-ring-svg" viewBox="0 0 140 140">
          <circle class="day-total-ring-track" cx="70" cy="70" r="${DAY_TOTAL_RADIUS}"></circle>
          <circle class="day-total-ring-fill" id="day-total-ring-fill" cx="70" cy="70" r="${DAY_TOTAL_RADIUS}"
            data-pct="${dayPct}" style="stroke-dasharray:${DAY_TOTAL_CIRC};stroke-dashoffset:${DAY_TOTAL_CIRC};"></circle>
        </svg>
        <div class="day-total-ring-center">
          <div class="day-total-icon">⭐</div>
          <div class="day-total-num" id="day-total-num" data-total="${total}">0</div>

    </div>
  ` : `
    ${sessionCodeBoxes('checkin-code')}
  `;
  const myRating = myRatingFor(p.id, session.id);
  const ratingBlock = done ? `
    <div class="rate-block">
      <div class="hint" style="margin:14px 0 6px;">قيّم هذه الفقرة</div>

/* ============================= RENDER: ADMIN ============================= */
/* Passcode is never stored in plaintext in the source — only its SHA-256 hash is kept here.
   Generate a new hash (e.g. in the browser console) with:
     crypto.subtle.digest('SHA-256', new TextEncoder().encode('YOUR_NEW_CODE')).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
*/
const ADMIN_PASSCODE_LEN = 4;
let ADMIN_PASSCODE_HASH = "8cca04ee02b8915f60a6b72c1faf19923aa12aafb5af89bc4bfd403dc60a836b";
const ADMIN_LOCKOUT_MAX_ATTEMPTS = 5;
const ADMIN_LOCKOUT_MS = 60000;
let adminFailedAttempts = 0;
let adminLockedUntil = 0;

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

}

function parseTimeStr(str){
  const m = /^(\d{1,2}):(\d{2})\s*(ص|م)?/.exec((str||'').trim());
  if(!m) return { h:'10', m:'00', ampm:'ص' };
  return { h: m[1].padStart(2,'0'), m: m[2], ampm: m[3]||'ص' };
}

function renderAdminSessionDetail(sessionId){
  const found = findSessionById(sessionId);
  if(!found) return `<div class="empty-note">الفقرة غير موجودة</div>`;
  const { day, session } = found;
  const info = SESSION_INFO[sessionId] || {};
  const checkedIn = checkinsForSession(sessionId);
  const pct = PARTICIPANTS.length ? Math.round((checkedIn/PARTICIPANTS.length)*100) : 0;

  const sessionCodes = Object.keys(POINT_CODES).filter(c=>POINT_CODES[c].sessionId===sessionId);
  const denominations = {};
  sessionCodes.forEach(c=>{
    const pc = POINT_CODES[c];
    denominations[pc.value] = denominations[pc.value] || {total:0, used:0};
    denominations[pc.value].total++;
    if(pc.used) denominations[pc.value].used++;
  });
  const denomKeys = Object.keys(denominations).map(Number).sort((a,b)=>a-b);
  const totalCodes = sessionCodes.length;
  const totalUsed = sessionCodes.filter(c=>POINT_CODES[c].used).length;
  const usagePct = totalCodes ? Math.round((totalUsed/totalCodes)*100) : 0;
  const denomRows = denomKeys.map(v=>{
    const d = denominations[v];
    const vPct = d.total ? Math.round((d.used/d.total)*100) : 0;
    return `<div class="admin-meta-chip" style="justify-content:space-between;width:100%;padding:9px 12px;margin-top:6px;">
      <span>🪙 ${v} نقطة — ${d.total} كود (${d.total-d.used} متبقي، استخدام ${vPct}%)</span>
      <button type="button" class="btn btn-outline" style="padding:5px 10px;font-size:10.5px;" data-action="print-session-point-codes" data-value="${v}" data-session="${sessionId}">🖨️ طباعة</button>
    </div>`;
  }).join('') || `<div class="hint" style="margin:6px 0 0;">لسه مفيش أكواد QR اتولدت لهذه الفقرة</div>`;

  return `
    <button type="button" class="admin-back-link" data-action="cancel-edit-session">${ICO.back} ${escapeHtml(day.label)}</button>
    <div class="admin-day-card">
      <span class="admin-session-ico" style="background:${TYPE_COLORS[session.type]||'var(--teal)'};">${ICO[session.type]||'📌'}</span>
      <div style="flex:1;min-width:0;">
        <div class="admin-session-name">${escapeHtml(info.name||session.name)}</div>
        <div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">${SESSION_TYPE_LABELS[session.type]||''} — ${checkedIn}/${PARTICIPANTS.length} حضروا (${pct}%)</div>
      </div>
      <button type="button" class="lock-chip ${session.locked?'locked':''}" data-action="admin-toggle-session-lock" data-session="${sessionId}">${lockIconSvg()} <span>${session.locked?'مقفولة':'مفتوحة'}</span></button>
    </div>
    <div class="card">${renderAdminEditForm(session, info)}</div>

    <div class="card" style="margin-top:12px;">
      <div class="admin-session-name" style="margin-bottom:4px;">🎟️ أكواد QR الخاصة بهذه الفقرة</div>
      ${info.pointsEnabled===false ? `
      <div class="hint" style="color:var(--danger,#d6473a);">النقاط متوقفة في هذه الفقرة (من إعدادات الفقرة فوق) — فعّل النقاط الأول عشان تقدر تولّد أكواد</div>
      ` : `
      <div class="hint" style="margin:0 0 10px;">كل كود اتولد بيبقى 4 خانات عشوائية (حروف وأرقام ورموز) ومش بالترتيب، عشان محدش يقدر يخمّن كود صح. الأكواد دي بتشتغل جوه الفقرة دي بس — محدش هيقدر يستخدمها في فقرة تانية</div>
      <div class="admin-edit-row">
        <div style="flex:1;"><label>قيمة الكود (نقاط)</label><input type="text" inputmode="numeric" pattern="[0-9]*" class="field" style="color:#1a1a1a;background:#fff;" id="gen-scode-value-${sessionId}" placeholder="مثال: 5" /></div>
        <div style="flex:1;"><label>الكمية</label><input type="text" inputmode="numeric" pattern="[0-9]*" class="field" style="color:#1a1a1a;background:#fff;" id="gen-scode-qty-${sessionId}" placeholder="مثال: 30" /></div>
      </div>
      <button type="button" class="btn btn-primary" style="margin-top:10px;width:100%;" data-action="generate-session-point-codes" data-session="${sessionId}">توليد الأكواد لهذه الفقرة</button>
      `}
      ${totalCodes>0 ? `<div class="hint" style="margin:8px 0 0;">📈 نسبة استخدام أكواد هذه الفقرة: <b>${usagePct}%</b> (${totalUsed} من ${totalCodes})</div>` : ''}
      ${denomRows}
      ${sessionCodes.length ? `<button type="button" class="btn btn-ghost" style="margin-top:10px;width:100%;padding:7px;font-size:11.5px;color:var(--danger);" data-action="confirm-delete-session-point-codes" data-session="${sessionId}">🗑️ إزالة كل أكواد QR المتولدة لهذه الفقرة (${sessionCodes.length})</button>` : ''}
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">

        <label>النص</label>
        <textarea class="field" id="custom-qr-text-${sessionId}" placeholder="اكتب النص أو الجملة اللي تحب تحولها لكود QR">${escapeHtml(info.customQrText||'')}</textarea>

        <div id="custom-qr-holder-${sessionId}" style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;"></div>
      </div>
    </div>

    <button type="button" class="btn btn-ghost" style="margin-top:10px;width:100%;color:var(--danger);" data-action="admin-delete-session" data-session="${sessionId}">🗑️ حذف الفقرة نهائيًا</button>
  `;
}

function renderAdminRankingsTab(){
  const solo = rankedParticipants();

  const maxTeam = Math.max(1,...teams.map(t=>t.total));

    <div class="card">${teamRows}</div>

    <div class="card" style="display:flex;align-items:flex-end;gap:2px;height:96px;padding:14px 10px 6px;">${heatBars}</div>

function updatePulseWidget(){
  const el = document.getElementById('live-pulse-count');
  if(!el) return;
  const sess = state.pulseSessionId ? findSessionById(state.pulseSessionId) : null;
  const active = sess ? sess.session : autoDetectLiveSession();
  const count = active ? checkinsForSession(active.id) : 0;
  if(parseInt(el.dataset.count,10) !== count){
    el.dataset.count = count;
    animateCount(el, count, 500);
  }

function renderAdminAuditTab(){

function renderAdminAnalyticsTab(){
  const totalPossible = PARTICIPANTS.length * flatSessions().length;

  const avgPoints = PARTICIPANTS.length ? Math.round(PARTICIPANTS.reduce((s,p)=>s+participantTotal(p.id),0)/PARTICIPANTS.length) : 0;
  const activeCount = PARTICIPANTS.filter(p=>participantTotal(p.id)>0).length;

  const typeTally = {};
  DAYS.forEach(d=>d.sessions.forEach(s=>{ typeTally[s.type] = (typeTally[s.type]||0) + checkinsForSession(s.id); }));
  const typeTotal = Object.values(typeTally).reduce((a,b)=>a+b,0) || 1;
  let acc=0; const stops=[];
  Object.entries(typeTally).forEach(([type,c])=>{ const pct=c/typeTotal*100; stops.push(`${TYPE_COLORS[type]||'#888'} ${acc}% ${acc+pct}%`); acc+=pct; });
  const legend = Object.entries(typeTally).sort((a,b)=>b[1]-a[1]).map(([type,c])=>
    `<div class="donut-legend-row"><span class="donut-dot" style="background:${TYPE_COLORS[type]||'#888'}"></span>${SESSION_TYPE_LABELS[type]||type} — ${c} تسجيل</div>`).join('');
  const topType = Object.entries(typeTally).sort((a,b)=>b[1]-a[1])[0];

  const streaks = PARTICIPANTS.map(p=>({p, streak: computeStreak(p.id).max})).sort((a,b)=>b.streak-a.streak).filter(x=>x.streak>0).slice(0,5);
  const streakRows = streaks.length ? streaks.map(({p,streak})=>`<div class="streak-lead-row">🔥 <div style="flex:1;">${escapeHtml(p.name)}</div><span style="color:var(--gold);font-weight:800;">${streak} متتالية</span></div>`).join('')
    : `<div class="empty-note">لا توجد بيانات كافية بعد</div>`;

  const totalBadges = PARTICIPANTS.reduce((s,p)=>s+computeBadges(p.id).length+computeSecretBadges(p.id).length,0);
  const avgRating = avgRatingOverall();

  return `
    <div class="kpi-grid">
