      <div class="card kpi-card"><div class="kpi-num">${avgPoints}</div><div class="kpi-lab">متوسط نقاط المشارك</div></div>
      <div class="card kpi-card"><div class="kpi-num">${activeCount}/${PARTICIPANTS.length}</div><div class="kpi-lab">مشاركون نشطون</div></div>
      <div class="card kpi-card"><div class="kpi-num">${totalBadges}</div><div class="kpi-lab">إجمالي الأوسمة الممنوحة</div></div>
      <div class="card kpi-card"><div class="kpi-num">${avgRating?avgRating.toFixed(1)+' ★':'—'}</div><div class="kpi-lab">متوسط رضا الحضور عن الفقرات</div></div>
    </div>
    <div class="section-title">إقبال حسب نوع الفقرة</div>
    <div class="card donut-wrap">
      <div style="width:88px;height:88px;border-radius:50%;background:conic-gradient(${stops.join(',')||'#333 0 100%'});flex:0 0 auto;position:relative;">
        <div style="position:absolute;inset:12px;border-radius:50%;background:var(--surface-2);"></div>
      </div>
      <div class="donut-legend">${legend || '<div class="hint">لا توجد بيانات بعد</div>'}</div>
    </div>
    ${topType ? `<div class="hint" style="margin:-4px 2px 4px;">أكثر نوع فقرات إقبالاً: <strong style="color:var(--gold);">${SESSION_TYPE_LABELS[topType[0]]||topType[0]}</strong></div>` : ''}

function renderAdminPointCodesTab(){
  const denominations = {};
  Object.values(POINT_CODES).forEach(pc=>{
    denominations[pc.value] = denominations[pc.value] || {total:0, used:0};
    denominations[pc.value].total++;
    if(pc.used) denominations[pc.value].used++;
  });
  const denomKeys = Object.keys(denominations).map(Number).sort((a,b)=>a-b);
  const denomRows = denomKeys.map(v=>{
    const d = denominations[v];
    return `<div class="admin-session">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <div style="font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;">🪙 أكواد بقيمة ${v} نقطة</div>
          <div class="hint" style="margin:2px 0 0;">${d.total} كود إجمالي · ${d.used} مستخدم · ${d.total-d.used} متبقي</div>
        </div>
        <button type="button" class="btn btn-outline" style="padding:8px 14px;font-size:12px;flex:0 0 auto;" data-action="print-point-codes" data-value="${v}">🖨️ طباعة</button>
      </div>
    </div>`;
  }).join('') || `<div class="empty-note">لسه مفيش أكواد نقاط متولدة</div>`;

  return `
    <div class="card" style="margin-bottom:16px;">
      <div style="font-family:'Cairo',sans-serif;font-weight:800;font-size:13.5px;margin-bottom:8px;">🎟️ توليد أكواد نقاط جديدة</div>
      <div class="hint" style="margin:0 0 10px;">كل كود يُستخدم مرة واحدة بس من أي مشارك، جوه أي فقرة يفتحها ويمسحه فيها</div>
      <div class="admin-edit-form" style="padding:0;">
        <div class="admin-edit-row">
          <div style="flex:1;"><label>قيمة الكود (نقاط)</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="gen-code-value" placeholder="مثال: 5" /></div>
          <div style="flex:1;"><label>الكمية</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="gen-code-qty" placeholder="مثال: 100" /></div>
        </div>
      </div>
      <button type="button" class="btn btn-primary" style="margin-top:10px;" data-action="generate-point-codes">توليد الأكواد</button>
    </div>
    <div class="admin-day-title">دفعات الأكواد الحالية</div>
    ${denomRows}
  `;
}

function renderAdminHub(){
  const pendingQ = QUESTIONS.filter(q=>!q.answered).length;
  const pendingR = REPORTS.filter(r=>!r.resolved).length;
  const tiles = ADMIN_HUB_ITEMS.map(it=>{
    const badge = it.tab==='questions'&&pendingQ ? pendingQ : (it.tab==='reports'&&pendingR ? pendingR : (it.tab==='trash'&&TRASH.length ? TRASH.length : 0));
    return `<button type="button" class="admin-hub-tile" data-action="admin-hub-tile" data-tab="${it.tab}">
      ${badge?`<span class="admin-hub-badge">${badge}</span>`:''}
      <span class="admin-hub-ico" style="background:${it.color}">${it.icon}</span>
      <span class="admin-hub-lab">${it.label}</span>
    </button>`;
  }).join('');
  return `
    <div class="back-row">
      <button class="icon-btn" data-action="back">${ICO.back}</button>
      <div class="back-title">لوحة المنظمين</div>
    </div>
    <div class="admin-hub-grid">${tiles}</div>
  `;
}
function renderAdmin(){
  if(!state.adminUnlocked) return renderAdminLock();
  if(state.adminHub) return renderAdminHub();
  const tab = state.adminTab;
  let body = '';
  if(tab==='sessions') body = renderAdminSessionsTab();
  else if(tab==='settings') body = renderAdminSettingsTab();
  else if(tab==='gallery') body = renderAdminGalleryTab();
  else if(tab==='chefs') body = renderAdminChefsTab();
  else if(tab==='pointcodes') body = renderAdminPointCodesTab();
  else if(tab==='rankings') body = renderAdminRankingsTab();
  else if(tab==='audit') body = renderAdminAuditTab();
  else if(tab==='pulse') body = renderAdminPulseTab();
  else if(tab==='analytics') body = renderAdminAnalyticsTab();
  else if(tab==='logistics') body = renderAdminLogisticsTab();
  else if(tab==='participants') body = renderAdminParticipantsTab();
  else if(tab==='teams') body = renderAdminTeamsTab();
  else if(tab==='alerts') body = renderAdminAlertsTab();
  else if(tab==='questions') body = renderAdminQuestionsTab();
  else if(tab==='opinions') body = renderAdminOpinionsTab();
  else if(tab==='reports') body = renderAdminReportsTab();
  else if(tab==='trash') body = renderAdminTrashTab();
  const hubItem = ADMIN_HUB_ITEMS.find(it=>it.tab===tab);
  let pageTitle = hubItem ? hubItem.label : 'لوحة المنظمين';
  if(tab==='sessions'){
    if(state.editingSessionId){
      const found = findSessionById(state.editingSessionId);
      if(found){ const info = SESSION_INFO[state.editingSessionId] || {}; pageTitle = info.name || found.session.name; }
    } else if(state.adminDayId){
      const day = DAYS.find(d=>d.id===state.adminDayId);
      if(day) pageTitle = day.label;
    }
  } else if(tab==='participants'){
    if(state.addingParticipant) pageTitle = 'إضافة مشارك جديد';
    else if(state.editingParticipantId){
      const p = PARTICIPANTS.find(x=>x.id===state.editingParticipantId);
      if(p) pageTitle = p.name;
    }
  } else if(tab==='chefs'){
    if(state.editingChefId){ const ch = CHEFS.find(x=>x.id===state.editingChefId); if(ch) pageTitle = ch.name; }
  } else if(tab==='opinions'){
    if(state.viewingOpinionId){
      const o = OPINIONS.find(x=>x.id===state.viewingOpinionId);
      if(o) pageTitle = o.name;
    }
  }
  return `
    <div class="back-row">
      <button class="icon-btn" data-action="admin-hub-back">${ICO.back}</button>
      <div class="back-title">${escapeHtml(pageTitle)}</div>
    </div>
    ${body}
  `;
}
function renderAdminQuestionsTab(){
  const qs = QUESTIONS.slice().sort((a,b)=>b.ts-a.ts);
  if(!qs.length) return `<div class="empty-note">✋ لسه معملش حد يسأل سؤال</div>`;
  return qs.map(q=>`<div class="card" style="margin-bottom:10px;">
    <div style="font-size:11px;color:var(--text-muted);">${escapeHtml(q.sessionName||'')} — ${escapeHtml(q.name)} — ${timeAgoAr(q.ts)}</div>
    <div style="font-size:13.5px;margin-top:6px;line-height:1.6;">${escapeHtml(q.text)}</div>
    <button type="button" class="btn ${q.answered?'btn-ghost':'btn-primary'}" style="margin-top:10px;padding:9px;font-size:12px;" data-action="admin-mark-question-answered" data-id="${q.id}">${q.answered?'✔️ تم الرد':'وضع علامة "تم الرد"'}</button>
  </div>`).join('');
}
function renderAdminReportsTab(){
  const rs = REPORTS.slice().sort((a,b)=>b.ts-a.ts);
  if(!rs.length) return `<div class="empty-note">🛠️ مفيش بلاغات مشاكل حاليًا</div>`;
  const search = rs.length>4 ? `<input type="text" class="field admin-search-input" data-filter-target=".report-row" placeholder="🔍 دور بالاسم أو محتوى البلاغ..." style="margin-bottom:10px;" />` : '';
  const rows = rs.map(r=>`<div class="card report-row" style="margin-bottom:10px;" data-search="${escapeHtml((r.name+' '+r.text).toLowerCase())}">
    <div style="font-size:11px;color:var(--text-muted);">${escapeHtml(r.name)} — ${timeAgoAr(r.ts)}</div>
    <div style="font-size:13.5px;margin-top:6px;line-height:1.6;">${escapeHtml(r.text)}</div>
    <button type="button" class="btn btn-ghost" style="margin-top:10px;padding:9px;font-size:12px;" data-action="admin-delete-report" data-id="${r.id}">✕ حذف البلاغ</button>
  </div>`).join('');
  return search + rows;
}
function renderAdminOpinionsTab(){
  if(state.viewingOpinionId){
    const o = OPINIONS.find(x=>x.id===state.viewingOpinionId);
    if(!o){ state.viewingOpinionId = null; }
    else {
      const field = (accent, lab, val)=> val ? `<div class="op-admin-detail-field" style="--op-accent:${accent};">
        <div class="op-admin-detail-lab">${lab}</div>
        <div class="op-admin-detail-val">${escapeHtml(val)}</div>
      </div>` : '';
      return `
        <div class="op-admin-back-link" data-action="admin-opinions-back">${ICO.back} رجوع لقائمة الآراء</div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:14px;">بعت رأيه ${timeAgoAr(o.ts)}</div>
        ${field('#3FDCC9','✅ الإيجابيات', o.positives)}
        ${field('#FF7A59','⚠️ السلبيات', o.negatives)}
        ${field('#F4B740','💡 اقتراحات', o.suggestions)}
        ${field('#9B8CFF','⭐ أكتر فقرة عجبته', o.favoriteSession)}
        <button type="button" class="btn btn-ghost" style="margin-top:6px;width:100%;color:var(--danger);" data-action="admin-delete-opinion" data-id="${o.id}">✕ حذف هذا الرأي</button>
      `;
    }
  }
  const os = OPINIONS.slice().sort((a,b)=>b.ts-a.ts);
  if(!os.length) return `<div class="empty-note">📝 لسه محدش بعت رأيه</div>`;
  // ---- ملخص سريع: أكتر الفقرات المفضلة ذكرًا، وعدد الآراء اللي فيها كل بند ----
  const favTally = {};
  let posCount=0, negCount=0, sugCount=0;
  os.forEach(o=>{
    if(o.positives && o.positives.trim()) posCount++;
    if(o.negatives && o.negatives.trim()) negCount++;
    if(o.suggestions && o.suggestions.trim()) sugCount++;
    const fv = (o.favoriteSession||'').trim();
    if(fv) favTally[fv] = (favTally[fv]||0)+1;
  });
  const topFav = Object.entries(favTally).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const summary = `
    <div class="card" style="margin-bottom:14px;">
      <div class="admin-session-name" style="margin-bottom:10px;">📊 ملخص سريع</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span class="admin-meta-chip">📝 ${os.length} رأي وصل</span>
        <span class="admin-meta-chip">✅ ${posCount} كتبوا إيجابيات</span>
        <span class="admin-meta-chip">⚠️ ${negCount} كتبوا سلبيات</span>
        <span class="admin-meta-chip">💡 ${sugCount} كتبوا اقتراحات</span>
      </div>
      ${topFav.length ? `<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">⭐ الأكتر ذكرًا كفقرة مفضلة: ${topFav.map(([name,n])=>`${escapeHtml(name)} (${n})`).join('، ')}</div>` : ''}
    </div>`;
  const search = os.length>4 ? `<input type="text" class="field admin-search-input" data-filter-target=".op-admin-row" placeholder="🔍 دور بالاسم..." style="margin-bottom:10px;" />` : '';
  const rows = os.map(o=>`
    <button type="button" class="op-admin-row" data-action="view-opinion" data-id="${o.id}" data-search="${escapeHtml((o.name||'').toLowerCase())}">
      <span class="op-admin-row-avatar">${escapeHtml((o.name||'?').trim().charAt(0))}</span>
      <span class="op-admin-row-body">
        <span class="op-admin-row-name">${escapeHtml(o.name||'مجهول')}</span>
        <span class="op-admin-row-time">${timeAgoAr(o.ts)}</span>
      </span>
      <span class="op-admin-row-chev">${ICO.chev}</span>
    </button>`).join('');
  return summary + search + rows;
}

/* ============================= ADMIN: TEAMS TAB ============================= */

    `;
  }

/* ============================= ADMIN: ALERTS / NOTIFICATIONS TAB ============================= */
function renderAdminAlertsTab(){
  const pending = ADMIN_ALERTS.filter(a=>!a.sent).sort((a,b)=>a.sendAt-b.sendAt);
  const sent = ADMIN_ALERTS.filter(a=>a.sent).sort((a,b)=>b.sendAt-a.sendAt).slice(0,15);
  const hourOptions = Array.from({length:12},(_,i)=>i+1).map(h=>`<option value="${h}">${h}</option>`).join('');
  const minuteOptions = ['00','05','10','15','20','25','30','35','40','45','50','55'].map(m=>`<option value="${m}">${m}</option>`).join('');
  const pendingHtml = pending.length ? pending.map(a=>`<div class="card" style="margin-bottom:8px;">
      <div style="font-size:13px;line-height:1.6;">${escapeHtml(a.text)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">⏰ مجدولة الساعة ${a.hLabel}</div>
      <button type="button" class="btn btn-ghost" style="margin-top:8px;padding:8px;font-size:11.5px;" data-action="cancel-admin-alert" data-id="${a.id}">إلغاء الجدولة</button>

/* ============================= PREMIUM PAGE TRANSITIONS ============================= */
function playPageTransition(app, dir){
  const saver = state.pid ? myExtra(state.pid).dataSaver : false;
  app.getAnimations && app.getAnimations().forEach(a=>a.cancel());
  if(saver){
    app.style.opacity='0'; app.style.transform='none';
    requestAnimationFrame(()=>{ app.style.transition='opacity .2s ease'; app.style.opacity='1'; });
    return;
  }
  let fromT;
  if(dir==='fade') fromT = 'none';
  else if(dir==='fwd') fromT = 'translateX(-14px) scale(.985)';
  else if(dir==='back') fromT = 'translateX(14px) scale(.985)';
  else fromT = 'translateY(10px) scale(.99)';
  app.style.transition = 'none';
  app.style.willChange = 'transform, opacity';
  app.style.transformOrigin = dir==='fwd' ? 'right center' : (dir==='back' ? 'left center' : 'center top');
  app.style.opacity = '0';
  app.style.transform = fromT;
  requestAnimationFrame(()=>{
    app.style.transition = dir==='fade' ? 'opacity .5s ease' : 'opacity .32s cubic-bezier(.22,.9,.28,1), transform .38s cubic-bezier(.22,1.12,.3,1)';
    app.style.opacity = '1';
    app.style.transform = 'translateX(0) translateY(0) scale(1)';
  });
}
function staggerRevealChildren(app){
  const saver = state.pid ? myExtra(state.pid).dataSaver : false;
  if(saver) return;
  const nodes = app.querySelectorAll('.card, .list-row, .session-glass, .id-card-glass, .wall-post, .wall-compose, .badge-item, .kpi-card, .lb-row, .day-node, .member-card, .agenda-row, .rank-card, .nav-tile, .quest-card, .kit-item, .dock-icon');
  const max = 24;
  nodes.forEach((el,i)=>{
    if(i>=max) return;
    el.classList.add('reveal-stagger');
    el.style.animationDelay = (i*26)+'ms';
    el.addEventListener('animationend', ()=>{ el.style.animationDelay=''; el.classList.remove('reveal-stagger'); }, {once:true});
  });
}
function positionTabPill(instant){
  const wrap = document.getElementById('lb-tabs');
  const pill = document.getElementById('lb-tab-pill');
  if(!wrap || !pill) return;
  const activeBtn = wrap.querySelector('.tab.active');
  if(!activeBtn) return;
  const wrapRect = wrap.getBoundingClientRect();
  const btnRect = activeBtn.getBoundingClientRect();
  const x = btnRect.left - wrapRect.left;
  if(instant){ pill.style.transition = 'none'; }
  pill.style.width = btnRect.width+'px';
  pill.style.transform = `translateX(${x}px)`;
  if(instant){ requestAnimationFrame(()=>{ pill.style.transition=''; }); }
}

/* ---------- global tap ripple for a tactile, premium feel ---------- */
document.addEventListener('pointerdown', (e)=>{
  const saver = state.pid ? (myExtra(state.pid)||{}).dataSaver : false;
  if(saver) return;
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const cs = getComputedStyle(target);
  if(cs.position==='static') target.style.position = 'relative';
  if(cs.overflow!=='hidden') target.dataset._rippleOverflow = cs.overflow;
  target.style.overflow = 'hidden';
  const rect = target.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'tap-ripple';
  ripple.style.width = ripple.style.height = size+'px';
  ripple.style.left = (e.clientX-rect.left-size/2)+'px';
  ripple.style.top = (e.clientY-rect.top-size/2)+'px';
  target.appendChild(ripple);
  ripple.addEventListener('animationend', ()=>{
    ripple.remove();
    if(target.dataset._rippleOverflow!==undefined){ target.style.overflow = target.dataset._rippleOverflow; delete target.dataset._rippleOverflow; }
  }, {once:true});
}, {passive:true});

/* ============================= SWIPE BETWEEN DAYS ============================= */
function attachDaySwipeOnce(){
  const app = document.getElementById('app');
  if(!app) return;
  let startX=0, startY=0, tracking=false;
  app.addEventListener('touchstart', (e)=>{
    if(state.view!=='day') return;
    const t=e.touches[0]; startX=t.clientX; startY=t.clientY; tracking=true;
  }, {passive:true});
  app.addEventListener('touchend', (e)=>{
    if(!tracking || state.view!=='day') return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX-startX, dy = t.clientY-startY;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    const idx = DAYS.findIndex(d=>d.id===state.dayId);
    const nextIdx = dx<0 ? idx+1 : idx-1; // RTL layout: swipe left = next day
    if(nextIdx>=0 && nextIdx<DAYS.length){
      SND.nav();
      state.dayId = DAYS[nextIdx].id;
      render();
    }
  }, {passive:true});
}

/* ============================= ANIMATION HELPERS ============================= */
function animateCount(el, to, duration){
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = Math.round(to*eased);
    if(p<1) requestAnimationFrame(step); else el.textContent = to;
  }
  requestAnimationFrame(step);
}

function goldDustBurst(x, y, count){
  const saver = state.pid ? myExtra(state.pid).dataSaver : false;

    const el = document.createElement('div');
    const size = 4+Math.random()*6;
    const angle = Math.random()*Math.PI*2;
    const dist = 40+Math.random()*90;
    const ex = Math.cos(angle)*dist, ey = Math.sin(angle)*dist - 30;

function launchConfetti(){
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:75;';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#F4B740','#FFDE94','#EFE3C4','#C9A227'];
  const cx = canvas.width/2, cy = canvas.height*0.4;
  const pieces = Array.from({length:20}, ()=>{
    const angle = (Math.random()*Math.PI) + Math.PI; // upward-ish spread
    const speed = 2.4+Math.random()*3;
    return {
      x: cx + (Math.random()-0.5)*30,
      y: cy,
      r: 1.8+Math.random()*2.2,
      long: Math.random()>0.5,
      c: colors[Math.floor(Math.random()*colors.length)],
      vy: Math.sin(angle)*speed*-1,
      vx: Math.cos(angle)*speed,
      gravity: 0.09,
      rot: Math.random()*360,
      vr: -3+Math.random()*6,
      drag: 0.985,
      opacity: .85
    };
  });
  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(pc=>{
      pc.vx *= pc.drag; pc.vy += pc.gravity;
      pc.x += pc.vx; pc.y += pc.vy; pc.rot += pc.vr;
      if(frame>55) pc.opacity = Math.max(0, pc.opacity-0.045);
      ctx.save();
      ctx.globalAlpha = pc.opacity;
      ctx.translate(pc.x, pc.y);
      ctx.rotate(pc.rot*Math.PI/180);
      ctx.fillStyle = pc.c;
      if(pc.long){ ctx.fillRect(-pc.r/2, -pc.r*1.3, pc.r, pc.r*2.6); }
      else { ctx.beginPath(); ctx.arc(0,0,pc.r,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if(frame<110 && document.body.contains(canvas)){ requestAnimationFrame(tick); }
    else { canvas.remove(); }
  }
  tick();
}

function playLampTransition(x, y){
  const maxR = Math.hypot(
    Math.max(x, window.innerWidth-x),
    Math.max(y, window.innerHeight-y)
  ) + 40;

  const overlay = document.createElement('div');
  overlay.className = 'wipe-overlay';
  overlay.style.clipPath = `circle(0px at ${x}px ${y}px)`;
  document.body.appendChild(overlay);

  const canAnimate = typeof overlay.animate === 'function';
  const finishExpand = ()=>{
    state.view = 'login';
    state.splashLeaving = false;
    render();
    if(canAnimate){
      const collapse = overlay.animate(
        [{ opacity:1 }, { opacity:0 }],
        { duration:480, easing:'ease', fill:'forwards' }
      );
      collapse.onfinish = ()=> overlay.remove();
    } else {
      overlay.style.transition = 'opacity .48s ease';
      requestAnimationFrame(()=>{ overlay.style.opacity = '0'; });
      setTimeout(()=>overlay.remove(), 520);
    }
  };

  if(canAnimate){
    const expand = overlay.animate(
      [{ clipPath:`circle(0px at ${x}px ${y}px)` }, { clipPath:`circle(${maxR}px at ${x}px ${y}px)` }],
      { duration:680, easing:'cubic-bezier(.65,0,.35,1)', fill:'forwards' }
    );
    expand.onfinish = finishExpand;
  } else {
    overlay.style.transition = `clip-path .68s cubic-bezier(.65,0,.35,1)`;
    requestAnimationFrame(()=>{ overlay.style.clipPath = `circle(${maxR}px at ${x}px ${y}px)`; });
    setTimeout(finishExpand, 700);
  }
}

/* ============================= LAMP DRAG-TO-PULL ============================= */
function attachLampDrag(){
  const cordEl = document.getElementById('lamp-cord');
  const line = document.getElementById('lamp-cord-line');
  const bead = document.getElementById('lamp-bead');
  if(!cordEl || !line || !bead) return;

  const THRESHOLD = 40;
  const MAX_PULL = 62;
  const BASE_LEN = 36;
  const LINE_MAX = BASE_LEN + MAX_PULL;
  let dragging = false, startY = 0, dist = 0;

  function setPull(d){
    line.style.transform = `scaleY(${(BASE_LEN+d)/LINE_MAX})`;
    bead.style.transform = `translateY(${d}px)`;
  }

  function onDown(e){
    if(state.splashLeaving) return;
    dragging = true; dist = 0;
    startY = e.clientY;
    cordEl.classList.add('dragging');
    try{ cordEl.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onMove(e){
    if(!dragging) return;
    dist = Math.max(0, Math.min(MAX_PULL, e.clientY - startY));
    setPull(dist);
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    cordEl.classList.remove('dragging');
    if(dist >= THRESHOLD){
      setPull(MAX_PULL);
      const rect = bead.getBoundingClientRect();
      SND.lamp();
      state.splashLeaving = true;
      playLampTransition(rect.left+rect.width/2, rect.top+rect.height/2);
    } else {
      setPull(0);
    }
    dist = 0;
  }

  cordEl.addEventListener('pointerdown', onDown);
  cordEl.addEventListener('pointermove', onMove);
  cordEl.addEventListener('pointerup', onUp);
  cordEl.addEventListener('pointercancel', onUp);
}

function getAudioCtx(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  if(!window.__glavCtx) window.__glavCtx = new Ctx();
  return window.__glavCtx;
}

/* Master limiter: prevents clipping/crackling when several sounds overlap */
function getMasterOut(ctx){
  if(ctx.__glavLimiter) return ctx.__glavLimiter;
  try{
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 24;
    comp.ratio.value = 10;
    comp.attack.value = 0.003;
    comp.release.value = 0.22;
    comp.connect(ctx.destination);
    ctx.__glavLimiter = comp;
    return comp;
  }catch(e){ return ctx.destination; }
}

let clickBufferPromise = null;
function loadClickBuffer(){
  if(clickBufferPromise) return clickBufferPromise;
  clickBufferPromise = new Promise((resolve)=>{
    try{
      const ctx = getAudioCtx();
      if(!ctx){ resolve(null); return; }
      const bin = atob(CLICK_SND_B64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
      ctx.decodeAudioData(bytes.buffer, (buf)=>resolve(buf), ()=>resolve(null));
    }catch(e){ resolve(null); }
  });
  return clickBufferPromise;
}
loadClickBuffer();

function playClickSample(){
  const ctx = getAudioCtx();
  if(!ctx){ return; }
  if(ctx.state==='suspended'){ ctx.resume(); }
  loadClickBuffer().then(buf=>{
    if(!buf){ tick(.7); return; }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.value = 0.35;
    src.connect(gain); gain.connect(getMasterOut(ctx));
    src.start();
  });
}

function getReverbNode(ctx){
  if(ctx.__glavReverb) return ctx.__glavReverb;
  try{
    const dur = 1.7, decay = 2.6;
    const rate = ctx.sampleRate;
    const len = Math.floor(rate*dur);
    const impulse = ctx.createBuffer(2, len, rate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<len;i++){ data[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay); }
    }
    const conv = ctx.createConvolver();
    conv.buffer = impulse;
    ctx.__glavReverb = conv;
    return conv;
  }catch(e){ return null; }
}
function luxTone(freq, duration, type, vol, opts){
  try{
    opts = opts || {};
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = window.__glavCtx || (window.__glavCtx = new Ctx());
    if(ctx.state==='suspended'){ ctx.resume(); }
    const now = ctx.currentTime;
    const peak = vol||0.1;
    const master = ctx.createGain();
    master.gain.value = 1;
    master.connect(getMasterOut(ctx));
    const reverb = getReverbNode(ctx);
    const wet = ctx.createGain();
    wet.gain.value = opts.wet!=null ? opts.wet : 0.22;
    if(reverb){ wet.connect(reverb); reverb.connect(master); }
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = opts.cutoff || 5200;
    filt.connect(master);
    filt.connect(wet);
    const detunes = opts.chorus ? [0, 6, -6] : [0];
    detunes.forEach(d=>{
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      osc.detune.value = d;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(peak/detunes.length, now+0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, now+duration);
      osc.connect(g); g.connect(filt);
      osc.start(now); osc.stop(now+duration+0.05);
    });
  }catch(e){}
}

let ambientNodes = null;
function startAmbient(mood){
  if(ambientNodes) return;
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    const gain = ctx.createGain();
    gain.gain.value = 0.0001;
    gain.connect(getMasterOut(ctx));
    const freqs = mood==='energetic' ? [220, 277.18, 329.63] : [174.61, 220, 261.63];
    const oscs = freqs.map(f=>{
      const o = ctx.createOscillator();
      o.type='sine'; o.frequency.value=f;
      o.connect(gain); o.start();
      return o;
    });
    gain.gain.linearRampToValueAtTime(mood==='energetic'?0.022:0.014, ctx.currentTime+1.2);
    ambientNodes = { ctx, gain, oscs, mood };
  }catch(e){}
}
function setAmbientMood(mood){
  if(!ambientNodes) return;
  if(ambientNodes.mood===mood) return;
  ambientNodes.mood = mood;
  const target = mood==='energetic'?0.022:0.014;
  try{ ambientNodes.gain.gain.linearRampToValueAtTime(target, ambientNodes.ctx.currentTime+1); }catch(e){}
}
function stopAmbient(){
  if(!ambientNodes) return;
  try{
    ambientNodes.gain.gain.linearRampToValueAtTime(0.0001, ambientNodes.ctx.currentTime+.6);
    setTimeout(()=>{ ambientNodes.oscs.forEach(o=>{ try{o.stop();}catch(e){} }); }, 700);
  }catch(e){}
  ambientNodes = null;
}
function updateAmbientForView(){
  const extra = state.pid ? myExtra(state.pid) : {};
  if(!state.pid || !extra.ambient || extra.dataSaver){ stopAmbient(); return; }
  if(!['profile','day','session','leaderboard','compare','timeline','badges','quests','team','journey','dna','share','settings','pass','stay','kit','transport','certificate'].includes(state.view)){ stopAmbient(); return; }
  startAmbient(state.view==='leaderboard' ? 'energetic' : 'calm');
  setAmbientMood(state.view==='leaderboard' ? 'energetic' : 'calm');
}

/* ============================= CHECK-IN LOGIC ============================= */
async function tryCheckin(codeRaw, targetSessionId){
  const code = String(codeRaw||'').trim().toUpperCase().replace(/[^A-Z0-9*#@%+=-]/g,'');
  if(!code){ showToast('الكود غير صحيح', true); return false; }
  const sid = targetSessionId || state.sessionId;
  if(!sid){ showToast('افتح الفقرة أولاً قبل مسح الكود', true); return false; }
  const found = findSessionById(sid);
  const day = found ? found.day : null;
  const session = found ? found.session : null;
  if(!session){ showToast('الفقرة غير موجودة', true); return false; }
  if(session.locked){ showToast('التسجيل مقفول مؤقتًا في هذه الفقرة', true); return false; }
  if(day && day.locked){ showToast('هذا اليوم مقفول مؤقتًا من المنظمين', true); return false; }
  if((SESSION_INFO[session.id]||{}).pointsEnabled===false){ showToast('لا يوجد نقاط في هذه الفقرة', true); return false; }
  if(CHECKINS[state.pid+'__'+session.id]){ showToast('خدت نقاط هذه الفقرة قبل كده — مينفعش تاخد تاني', true); return false; }

  /* أكواد النقاط ممكن المنظم يكون ولّدها بعد ما فتحت الصفحة، فالنسخة المحفوظة في
     الذاكرة (POINT_CODES) ممكن تكون قديمة. نجيب أحدث نسخة من Firebase قبل ما نتأكد
     من صحة الكود، عشان منرفضش كود صحيح لمجرد إنه اتولد بعد فتح الصفحة. */
  try{
    const freshPointCodes = await loadPointCodes();
    if(freshPointCodes && Object.keys(freshPointCodes).length){ POINT_CODES = freshPointCodes; }
  }catch(e){}

  let pc = POINT_CODES[session.id+':'+code];
  if(!pc) pc = POINT_CODES[code];
  if(!pc){ showToast('كود النقاط غير صحيح', true); return false; }
  if(pc.used){ showToast('هذا الكود مستخدم بالفعل', true); return false; }
  if(pc.sessionId && pc.sessionId !== session.id){ showToast('هذا الكود خاص بفقرة تانية — مينفعش تستخدمه هنا', true); return false; }

  if(typeof navigator!=='undefined' && navigator.onLine===false){
    showToast('لا يوجد اتصال بالإنترنت — حاول مرة أخرى', true);
    return false;
  }

  const rankBefore = rankedParticipants().findIndex(x=>x.id===state.pid)+1;
  const key = state.pid+'__'+session.id;
  const prevEntry = CHECKINS[key];
  const isFirstCheckinForSession = !prevEntry;
  const addedPoints = pc.value;
  const newTotalForSession = (prevEntry?prevEntry.points:0) + addedPoints;

  pc.used = true; pc.usedBy = state.pid; pc.usedAt = Date.now(); pc.usedSessionId = session.id;
  const pcSaved = await savePointCodes(POINT_CODES);
  if(pcSaved===false){
    pc.used = false; pc.usedBy = null; pc.usedAt = null; pc.usedSessionId = null;
    showToast('تعذر حفظ الكود — تحقق من الاتصال وحاول مرة أخرى', true);
    return false;
  }

  CHECKINS[key] = { points: newTotalForSession, ts: prevEntry?prevEntry.ts:Date.now() };
  const saved = await saveCheckins(CHECKINS);
  if(saved===false){
    CHECKINS[key] = prevEntry;
    showToast('تعذر حفظ النقاط — تحقق من الاتصال وحاول مرة أخرى', true);
    return false;
  }

  const rankAfter = rankedParticipants().findIndex(x=>x.id===state.pid)+1;
  const dayObj = day;
  const dayFull = dayObj.sessions.every(s=>CHECKINS[state.pid+'__'+s.id]);
  const secrets = computeSecretBadges(state.pid);
  const gotSecret = secrets.some(sb=>sb.label.includes(session.name));

  state.justScoredSessionId = session.id;
  state.pulseMedal = true;
  if(!myExtra(state.pid).dataSaver) playSuccessCelebration(addedPoints);

  if(rankAfter===1 && rankBefore!==1) vibrate([40,30,40,30,90]);
  else if(rankAfter < rankBefore) vibrate([30,30,60]);
  else if(dayFull) vibrate([25,20,25,20,60]);
  else vibrate(18);

  showToast('مبروك عليك النقاط! +'+addedPoints+' نقطة');
  pushNotification(state.pid, `مسحت كود بقيمة ${addedPoints} نقطة في "${session.name}"`, '✅');
  if(rankAfter < rankBefore){
    showToast('طلعت مركز #'+rankAfter+'! 🎉', false, 2400);
    pushNotification(state.pid, `تقدمت للمركز #${rankAfter} في الترتيب الفردي`, '📈');
  }
  if(dayFull){
    showToast('🏅 حضور كامل لـ'+dayObj.label+'!', false, 4600);
    pushNotification(state.pid, `حضور كامل لـ${dayObj.label} — أحسنت! 🏅`, '🏅');
  }
  if(gotSecret){
    showToast('🕵️ اكتشفت وسام سري: دقيقة الذهب!', false, 6800);
    pushNotification(state.pid, 'اكتشفت وسام سري: دقيقة الذهب 🕵️', '🕵️');
  }
  const extra = myExtra(state.pid);
  if(rankAfter===1 && !extra.rank1Achieved){
    extra.rank1Achieved = true;
    saveProfileExtra(PROFILE_EXTRA);
    setTimeout(()=>{ SND.rank1Chime(); goldDustBurst(window.innerWidth/2, window.innerHeight*0.35, 30); showToast('👑 وصلت للمركز الأول لأول مرة!', false, 3000); }, 400);
    pushNotification(state.pid, 'وصلت للمركز الأول لأول مرة! 👑', '👑');
  }
  render();
  if(isFirstCheckinForSession) autoAdvanceToNextSession(session.id);
  return true;
}
function autoAdvanceToNextSession(currentSessionId){
  const flat = flatSessions();
  const idx = flat.findIndex(x=>x.session.id===currentSessionId);
  if(idx<0 || idx>=flat.length-1) return;
  const next = flat[idx+1];
  setTimeout(()=>{
    if(state.view!=='session' || state.sessionId!==currentSessionId) return;
    state.dayId = next.day.id;
    state.sessionId = next.session.id;
    render();
  }, 1900);
}

function showConfirmDialog(message, onConfirm, opts){
  opts = opts || {};
  const old = document.getElementById('confirm-overlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay confirm-overlay';
  overlay.id = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-card">
      <div class="confirm-icon">${opts.icon || '🗑️'}</div>
      <div class="confirm-msg">${message}</div>
      ${opts.sub ? `<div class="confirm-sub">${opts.sub}</div>` : ''}
      <div class="confirm-actions">
        <button type="button" class="btn btn-ghost" id="confirm-cancel-btn">إلغاء</button>
        <button type="button" class="btn btn-primary" id="confirm-ok-btn" style="background:linear-gradient(95deg,var(--danger),#e0644f); color:#fff;">${opts.confirmLabel || 'حذف'}</button>
      </div>

  document.getElementById('confirm-ok-btn').addEventListener('click', ()=>{ close(); onConfirm(); });

/* ============================= TRASH (سلة المهملات) ============================= */
async function addToTrash(type, label, data){
  TRASH.unshift({ id:'tr'+Date.now()+Math.floor(Math.random()*999), type, label: label||'', data: data||{}, deletedAt: Date.now() });
  if(TRASH.length>200) TRASH = TRASH.slice(0,200);
  await saveTrash(TRASH);
}
const TRASH_TYPE_LABELS = { participant:'مشارك', session:'فقرة', wall_post:'رأي على الحائط', report:'بلاغ', opinion:'رأي (استبيان)' };
async function doRestoreTrashItem(trashId){
  const idx = TRASH.findIndex(t=>t.id===trashId);
  if(idx<0) return;
  const item = TRASH[idx];
  if(item.type==='participant'){
    const ov = PARTICIPANT_OVERRIDES[item.data.id];
    if(ov) ov.deleted = false;
    await saveParticipantOverrides(PARTICIPANT_OVERRIDES);
    await refreshAllData();
  } else if(item.type==='session'){
    const ov = SESSION_OVERRIDES[item.data.id];
    if(ov) ov.deleted = false;
    await saveSessionOverrides(SESSION_OVERRIDES);
    await refreshAllData();
  } else if(item.type==='wall_post'){
    if(!WALL_POSTS.some(w=>w.id===item.data.id)) WALL_POSTS.push(item.data);
    await saveWallPosts(WALL_POSTS);
  } else if(item.type==='report'){
    if(!REPORTS.some(r=>r.id===item.data.id)) REPORTS.push(item.data);
    await saveReports(REPORTS);
  } else if(item.type==='opinion'){
    if(!OPINIONS.some(o=>o.id===item.data.id)) OPINIONS.push(item.data);
    await saveOpinions(OPINIONS);
  }
  TRASH.splice(idx,1);
  await saveTrash(TRASH);
  showToast('تم استرجاع العنصر');
  render();
}
function confirmRestoreTrashItem(trashId){
  const item = TRASH.find(t=>t.id===trashId);
  if(!item) return;
  showConfirmDialog(`استرجاع "${escapeHtml(item.label||'')}"؟`, ()=>doRestoreTrashItem(trashId), {icon:'↩️', confirmLabel:'استرجاع'});
}
async function doPermaDeleteTrashItem(trashId){
  const idx = TRASH.findIndex(t=>t.id===trashId);
  if(idx<0) return;
  const item = TRASH[idx];
  if(item.type==='participant'){ await deletePhotoIndividually(item.data.id); }
  TRASH.splice(idx,1);
  await saveTrash(TRASH);
  showToast('تم الحذف النهائي');
  render();
}
function confirmPermaDeleteTrashItem(trashId){
  const item = TRASH.find(t=>t.id===trashId);
  if(!item) return;
  showConfirmDialog(`حذف "${escapeHtml(item.label||'')}" نهائيًا؟`, ()=>doPermaDeleteTrashItem(trashId), {sub:'مينفعش ترجعه بعد كده.'});
}
function confirmEmptyTrash(){
  if(!TRASH.length){ showToast('سلة المهملات فاضية أصلًا', true); return; }
  showConfirmDialog('تفريغ سلة المهملات بالكامل؟', async ()=>{
    for(const item of TRASH){ if(item.type==='participant'){ await deletePhotoIndividually(item.data.id); } }
    TRASH = [];
    await saveTrash(TRASH);
    showToast('اتفرغت سلة المهملات');
    render();
  }, {sub:'مينفعش ترجع أي عنصر بعد كده.'});
}

/* ============================= SCAN MODAL ============================= */
let scanStream = null, scanRAF = null, scanMode = 'checkin', scanTargetSessionId = null;
async function openScanModal(mode, sessionId){
  scanMode = mode || 'checkin';
  scanTargetSessionId = sessionId || null;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'scan-overlay';
  overlay.innerHTML = `
    <div class="scan-viewport">
      <video id="scan-video" playsinline muted></video>
      <div class="scan-frame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><span class="scan-line"></span></div>
    </div>
    <div class="scan-status-bar" id="scan-status"><span class="scan-status-ico" id="scan-status-ico">${ICO.cam}</span><span class="scan-status-txt" id="scan-status-txt">${scanMode==='login' ? 'وجّه الكاميرا نحو بطاقتك الرقمية (QR)' : 'وجّه الكاميرا نحو كود QR الخاص بالنقاط'}</span></div>
    <div id="scan-fallback"></div>
    <button class="btn btn-ghost modal-close" data-action="close-scan">إلغاء</button>
  `;
  document.body.appendChild(overlay);

  const video = document.getElementById('scan-video');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  function showManualFallback(msg){
    if(!document.getElementById('scan-overlay')) return;
    const vp = document.querySelector('.scan-viewport');
    if(vp) vp.style.display='none';
    const bar = document.getElementById('scan-status');
    if(bar) bar.classList.add('error');
    const ico = document.getElementById('scan-status-ico');
    if(ico) ico.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
    const txt = document.getElementById('scan-status-txt');
    if(txt) txt.textContent = msg;
    const fb = document.getElementById('scan-fallback');
    if(fb) fb.innerHTML = `
      <div class="manual-row" style="max-width:320px;margin:0 auto 6px;">
        <input class="field" id="fallback-code-input" placeholder="اكتب الكود هنا" autocomplete="off" />
        <button type="button" class="btn btn-outline" style="width:auto;padding:0 18px;" data-action="submit-fallback-code">تأكيد</button>
      </div>`;
  }

  // لو مكتبة قراءة الـQR اتأخرت أو اتحجبت (مشكلة شبكة)، بلّغ المستخدم واديله بديل يدوي
  // بدل ما يفضل واقف بيمسح من غير أي نتيجة
  const jsQrWaitStart = Date.now();
  const jsQrWatchdog = setInterval(()=>{
    if(window.jsQR){ clearInterval(jsQrWatchdog); return; }
    if(Date.now() - jsQrWaitStart > 7000){
      clearInterval(jsQrWatchdog);
      if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
      if(scanRAF) cancelAnimationFrame(scanRAF);
      showManualFallback('تعذّر تحميل مكوّن قراءة الكود (مشكلة اتصال). اكتب الكود يدويًا:');
    }
  }, 500);

  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scanStream;
    await video.play();
    const tick = ()=>{
      if(!document.getElementById('scan-overlay')) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const result = window.jsQR ? jsQR(imgData.data, imgData.width, imgData.height) : null;
        if(result && result.data){
          clearInterval(jsQrWatchdog);
          closeScanModal();
          if(scanMode==='login'){ doLoginWithCode(result.data); }
          else{ tryCheckin(result.data, scanTargetSessionId); }
          return;
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  }catch(e){
    clearInterval(jsQrWatchdog);
    showManualFallback('تعذر الوصول للكاميرا (يجب فتح الرابط عبر الإنترنت وليس كملف محفّظ على الجهاز). يمكنك كتابة الكود يدويًا كحل مؤقت:');
  }
}
function closeScanModal(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  const overlay = document.getElementById('scan-overlay');
  if(overlay) overlay.remove();
}

document.addEventListener('input', (e)=>{
  if(e.target && e.target.id==='ds-text'){
    if(dishSheet) dishSheet.text = e.target.value;
    const ct = document.getElementById('ds-counter');
    if(ct) ct.textContent = e.target.value.length+'/'+DISH_REVIEW_MAX_CHARS;
    return;
  }
  if(e.target && e.target.id==='room-join-code'){
    const v = ghNormalizeDigits(e.target.value);
    if(e.target.value!==v) e.target.value = v;
    state.roomJoinInput = v;
    return;
  }
  if(e.target.classList && e.target.classList.contains('admin-search-input')){
    const q = e.target.value.trim().toLowerCase();
    const sel = e.target.dataset.filterTarget;
    if(sel){
      document.querySelectorAll(sel).forEach(item=>{
        const hay = (item.dataset.search||'').toLowerCase();
        item.style.display = (!q || hay.includes(q)) ? '' : 'none';
      });
    }
    return;
  }
  if(e.target.id==='music-volume-slider'){
    doSetMusicVolume(e.target.value);
    const labelRow = e.target.previousElementSibling;
    if(labelRow){
      const span = labelRow.querySelector('span:last-child');
      if(span) span.textContent = Math.round(parseFloat(e.target.value)*100)+'%';
    }
  }
  if(e.target.getAttribute && e.target.getAttribute('inputmode')==='numeric'){
    const normalized = normalizeDigits(e.target.value).replace(/[^0-9]/g,'');
    if(normalized !== e.target.value) e.target.value = normalized;
  }
});

(function attachMedalLongPress(){
  let pressTimer = null;
  document.addEventListener('pointerdown', (e)=>{

    pressTimer = setTimeout(()=>openAchievementCard(), 480);

(function attachAdminGesture(){
  // Tap the logo 5 times within 2 seconds to open the admin lock screen.
  const TAP_COUNT_NEEDED = 5;
  const TAP_WINDOW_MS = 2000;
  let tapTimes = [];
  document.addEventListener('pointerdown', (e)=>{
    const logo = e.target.closest('#login-logo-gesture');
    if(!logo) return;
    const now = Date.now();
    tapTimes = tapTimes.filter(t=> now - t < TAP_WINDOW_MS);
    tapTimes.push(now);
    vibrate(10);
    logo.classList.remove('admin-gesture-charging');
    void logo.offsetWidth;
    logo.classList.add('admin-gesture-charging');
    setTimeout(()=>logo.classList.remove('admin-gesture-charging'), 180);
    if(tapTimes.length >= TAP_COUNT_NEEDED){
      tapTimes = [];
      vibrate([15,25,15]);
      go('admin');
    }
  });
})();

function navDockTap(el, page){
  document.querySelectorAll('.dock-icon.show-tip').forEach(d=>d.classList.remove('show-tip'));
  document.querySelectorAll('.dock-tooltip.show').forEach(t=>t.classList.remove('show'));
  el.classList.add('show-tip');
  const tip = el.querySelector('.dock-tooltip');
  if(tip) tip.classList.add('show');
  vibrate(12);
  SND.nav();
  if(page==='gift'){ setTimeout(()=>openGiftBox(), 250); return; }
  setTimeout(()=>{ go(page); }, 300);
}
function openGiftBox(){
  if(!state.pid) return;
  const extra = myExtra(state.pid);
  const todayKey = new Date().toDateString();
  const already = extra.lastGiftDate === todayKey;
  const overlay = document.createElement('div');
  overlay.className = 'ach-overlay';
  overlay.id = 'gift-overlay';
  overlay.innerHTML = `
    <div style="text-align:center;">
      <div class="gift-box-wrap ${already?'opened':''}" id="gift-box-wrap">
        <div class="gift-box-emoji" id="gift-box-emoji">${already?'✨':'🎁'}</div>
      </div>
      <div class="ach-close-hint" id="gift-hint" style="margin-top:18px;">${already? 'رجعت بكرة تاخد هدية جديدة 🌙' : 'اضغط على الصندوق لفتحه'}</div>
    </div>`;
  document.body.appendChild(overlay);
  if(already){
    overlay.addEventListener('click', ()=>overlay.remove());
    return;
  }
  const boxEl = document.getElementById('gift-box-wrap');
  boxEl.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(boxEl.classList.contains('opened')) return;
    boxEl.classList.add('opened');
    const prize = 5 + Math.floor(Math.random()*16);
    document.getElementById('gift-box-emoji').textContent = '🎉';
    extra.lastGiftDate = todayKey;
    /* نقاط صندوق الهدايا بتروح لمخزن منفصل (GIFT_POINTS) مش لـ BONUS، عشان متتضافش لمجموع نقاط المشارك ولا ترتيبه ولا رصيد متجر المكافآت */
    GIFT_POINTS[state.pid] = (GIFT_POINTS[state.pid]||0) + prize;
    await saveProfileExtra(PROFILE_EXTRA);
    await saveGiftPoints(GIFT_POINTS);
    vibrate([20,20,40]);
    SND.coinChime();
    const rect = boxEl.getBoundingClientRect();
    goldDustBurst(rect.left+rect.width/2, rect.top+rect.height/2, 22);
    pushNotification(state.pid, `فتحت صندوق الهدايا وربحت +${prize} نقطة هدية!`, '🎁');
    const hint = document.getElementById('gift-hint');
    if(hint) hint.textContent = `مبروك! ربحت ${prize} نقطة هدية — اضغط في أي مكان للإغلاق`;
    setTimeout(()=>{
      overlay.addEventListener('click', ()=>{ overlay.remove(); render(); });
    }, 250);
  });
}

(function attachRipple(){
  document.addEventListener('pointerdown', (e)=>{
    const target = e.target.closest('.btn, .icon-btn, .chip, .tab, .admin-tab, .day-node, .member-card, .quest-claim-btn');

    const rect = target.getBoundingClientRect();

    ripple.className = 'ripple-fx';
    const size = Math.max(rect.width, rect.height) * 1.8;
    ripple.style.width = ripple.style.height = size+'px';
    ripple.style.left = (e.clientX - rect.left - size/2)+'px';
    ripple.style.top = (e.clientY - rect.top - size/2)+'px';
    target.appendChild(ripple);
    setTimeout(()=>ripple.remove(), 650);
  });
})();

/* ============================= AMBIENT LUXURY PARTICLES ============================= */
function initLuxuryParticles(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.createElement('canvas');
  canvas.id = 'luxury-particles';
  canvas.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;';
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const N = 30;
  const parts = Array.from({length:N}, ()=>({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    r: .6 + Math.random()*1.5,
    vy: .05 + Math.random()*.12,
    tw: Math.random()*Math.PI*2
  }));
  function tick(){
    const saver = state.pid ? !!myExtra(state.pid).dataSaver : false;
    if(saver){
      canvas.style.display = 'none';
    } else {
      canvas.style.display = 'block';
      ctx.clearRect(0,0,canvas.width,canvas.height);
      parts.forEach(pt=>{
        pt.y -= pt.vy; pt.tw += .015;
        if(pt.y < -5){ pt.y = canvas.height+5; pt.x = Math.random()*canvas.width; }
        const alpha = Math.max(.05, Math.min(.55, .28 + Math.sin(pt.tw)*.22));
        ctx.beginPath();
        ctx.fillStyle = `rgba(244,183,64,${alpha})`;
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2);
        ctx.fill();
      });
    }
    requestAnimationFrame(tick);
  }
  tick();
}

let bgAudioEl = null;
let bgMusicArmed = false;
function getBgAudio(){
  if(bgAudioEl) return bgAudioEl;
  bgAudioEl = document.createElement('audio');
  bgAudioEl.src = BG_MUSIC_SRC;
  bgAudioEl.loop = true;
  bgAudioEl.preload = 'auto';
  bgAudioEl.style.display = 'none';
  document.body.appendChild(bgAudioEl);
  return bgAudioEl;
}
function musicPrefs(){
  if(!state.pid) return { on:true, volume:0.5 };
  const extra = myExtra(state.pid);
  if(extra.musicOn===undefined) extra.musicOn = true;
  if(extra.musicVolume===undefined) extra.musicVolume = 0.5;
  return { on: extra.musicOn, volume: extra.musicVolume };
}
function applyMusicState(){
  const audio = getBgAudio();
  const prefs = musicPrefs();
  audio.volume = Math.max(0, Math.min(1, prefs.volume));
  if(prefs.on){
    if(bgMusicArmed && audio.paused){ audio.play().catch(()=>{}); }
  } else {
    audio.pause();
  }
}
function armBgMusicOnFirstTap(){
  if(bgMusicArmed) return;
  const start = ()=>{
    if(bgMusicArmed) return;
    bgMusicArmed = true;
    applyMusicState();
    document.removeEventListener('click', start);
    document.removeEventListener('touchend', start);
  };
  document.addEventListener('click', start, { once:true });
  document.addEventListener('touchend', start, { once:true });
}

const PENDING_CROPPED_PHOTOS = {};
function openPhotoCropModal(inputEl, file){
  if(typeof Cropper==='undefined'){ return false; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const backdrop = document.createElement('div');
    backdrop.className = 'crop-modal-backdrop';
    backdrop.innerHTML = `
      <div class="crop-modal-box">
        <div class="crop-modal-title">اقصّ الصورة زي ما يريحك</div>
        <div class="crop-modal-imgwrap"><img id="crop-target-img" src="${reader.result}" alt="معاينة الصورة قبل القص" /></div>
        <div class="crop-modal-hint">اسحب للتحريك — استخدم إصبعين أو العجلة للتكبير</div>
        <div class="crop-modal-actions">
          <button type="button" class="btn btn-ghost" data-crop-cancel>إلغاء</button>
          <button type="button" class="btn btn-primary" data-crop-confirm>تم القص ✅</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    const imgEl = backdrop.querySelector('#crop-target-img');
    const cropper = new Cropper(imgEl, {
      aspectRatio: 1,
      viewMode: 1,
      dragMode: 'move',
      autoCropArea: 1,
      background: false,
      responsive: true,
      guides: false,
      center: true,
      highlight: false,
    });
    function cleanup(){
      cropper.destroy();
      backdrop.remove();
    }
    backdrop.querySelector('[data-crop-cancel]').addEventListener('click', ()=>{
      inputEl.value = '';
      cleanup();
    });
    backdrop.querySelector('[data-crop-confirm]').addEventListener('click', ()=>{
      const canvas = cropper.getCroppedCanvas({
        width: 260, height: 260,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });
      if(canvas){
        PENDING_CROPPED_PHOTOS[inputEl.id] = canvas.toDataURL('image/jpeg', 0.85);
        const preview = inputEl.parentElement && inputEl.parentElement.querySelector('.avatar');
        if(preview){
          preview.style.backgroundImage = `url('${PENDING_CROPPED_PHOTOS[inputEl.id]}')`;
          preview.style.backgroundSize = 'cover';
          preview.style.backgroundPosition = 'center';
          preview.textContent = '';
        }
        showToast('اتقصّت الصورة بجودة عالية');
      }
      cleanup();
    });
  };
  reader.readAsDataURL(file);
  return true;
}
function attachPhotoCropInputs(){
  document.querySelectorAll('input[type="file"][id^="edit-pphoto-"]').forEach(inputEl=>{
    if(inputEl.dataset.cropBound) return;
    inputEl.dataset.cropBound = '1';
    inputEl.addEventListener('change', ()=>{
      const file = inputEl.files && inputEl.files[0];
      if(!file) return;
      delete PENDING_CROPPED_PHOTOS[inputEl.id];
      openPhotoCropModal(inputEl, file);
    });
  });
}
function readImageFileToDataUrl(inputEl, maxSize){
  return new Promise((resolve)=>{
    const file = inputEl && inputEl.files && inputEl.files[0];
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = maxSize || 200;
        let w = img.width, h = img.height;
        if(w>h){ h = Math.round(h*size/w); w = size; } else { w = Math.round(w*size/h); h = size; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.94));
      };
      img.onerror = ()=>resolve(null);
      img.src = reader.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}
function readImageFileObjectToDataUrl(file, maxSize){
  return new Promise((resolve)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = maxSize || 900;
        let w = img.width, h = img.height;
        const longest = Math.max(w, h);
        if(longest > size){ // only downscale, never upscale smaller originals
          if(w>h){ h = Math.round(h*size/w); w = size; } else { w = Math.round(w*size/h); h = size; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = ()=>resolve(null);
      img.src = reader.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

async function doAdminUploadGalleryPhotos(idx, files, inputEl){
  const album = GALLERY_ALBUMS[idx];
  if(!album) return;
  let okCount = 0;
  let queuedCount = 0;
  /* بنرفع كل صورة لوحدها وبفاصل بسيط بينهم، وبنحفظ قائمة الألبومات مرة واحدة بعد ما نخلص كل الصور
     (مش بعد كل صورة) عشان منضغطش على التخزين بطلبات كتير ورا بعض — ده كان بيسبب فشل رفع أكتر من صورة
     مرة واحدة، وأحياناً بيعطل رفع الصور في ألبوم تاني كمان لحد ما الضغط يخف. */
  for(let i=0;i<files.length;i++){
    showToast(`جاري رفع الصورة ${i+1} من ${files.length}...`);
    const dataUrl = await readImageFileObjectToDataUrl(files[i], 1400);
    if(!dataUrl){ console.error('تعذّر قراءة/تصغير الصورة رقم', i+1); continue; }
    const pid = 'gp'+Date.now()+Math.random().toString(36).slice(2,7);
    const saved = (navigator.onLine === false) ? false : await saveGalleryPhoto(pid, dataUrl);
    if(saved){
      GALLERY_PHOTO_CACHE[pid] = dataUrl;
      album.photoIds.push(pid);
      okCount++;
    } else {
      // بدل ما نسيبها تفشل نهائي، بنحطها في قائمة انتظار وهترفع تلقائي لما الاتصال يرجع
      GALLERY_PHOTO_CACHE[pid] = dataUrl;
      PENDING_GALLERY_UPLOADS.push({ pid, dataUrl, albumIdx: idx, ts: Date.now() });
      queuedCount++;
      console.error('فشل حفظ الصورة رقم', i+1, '— اتحطت في قائمة الانتظار هترفع تلقائي');
    }
    if(i < files.length-1) await sleep(450); // فاصل بسيط بين كل صورة والتانية
  }
  if(okCount>0) await saveGalleryAlbumsWithRetry(GALLERY_ALBUMS);
  if(inputEl) inputEl.value = '';
  if(okCount === files.length){
    showToast(`تمت إضافة ${okCount} صورة ✅`);
  } else if(queuedCount>0 && okCount>0){
    showToast(`اتضافت ${okCount} صورة، و${queuedCount} في قائمة الانتظار هترفع تلقائي أول ما الاتصال يتحسّن ⏳`, true);
  } else if(queuedCount>0){
    showToast(`📵 النت ضعيف/مقطوع دلوقتي — ${queuedCount} صورة اتحطت في قائمة الانتظار وهترفع تلقائي لوحدها أول ما الاتصال يرجع، سيب الصفحة مفتوحة`, true);
  } else {
    showToast('⚠️ حصلت مشكلة في رفع الصور — جرّب تاني', true);
  }
  render();
  scheduleGalleryUploadRetry();
}
function pendingUploadsCountForAlbum(idx){
  return PENDING_GALLERY_UPLOADS.filter(x=>x.albumIdx===idx).length;
}
let _galleryRetryTimer = null;
function scheduleGalleryUploadRetry(){
  if(_galleryRetryTimer) return; // فيه محاولة شغالة أو متجدولة بالفعل
  if(!PENDING_GALLERY_UPLOADS.length) return;
  _galleryRetryTimer = setTimeout(async ()=>{
    _galleryRetryTimer = null;
    await processPendingGalleryUploads();
    if(PENDING_GALLERY_UPLOADS.length) scheduleGalleryUploadRetry(); // لسه فيه صور مستنية، جدول محاولة تانية
  }, 20000); // يحاول تاني كل 20 ثانية
}
async function processPendingGalleryUploads(){
  if(!PENDING_GALLERY_UPLOADS.length) return;
  if(navigator.onLine === false) return; // متضيعش وقت لو الجهاز نفسه شايف إنه Offline
  const queue = PENDING_GALLERY_UPLOADS.slice();
  let doneAny = false;
  for(const item of queue){
    const saved = await saveGalleryPhoto(item.pid, item.dataUrl, 1);
    if(saved){
      const album = GALLERY_ALBUMS[item.albumIdx];
      if(album && !album.photoIds.includes(item.pid)) album.photoIds.push(item.pid);
      PENDING_GALLERY_UPLOADS = PENDING_GALLERY_UPLOADS.filter(x=>x.pid!==item.pid);
      doneAny = true;
    }
    // لو فشلت لسه، بتفضل في القائمة عشان المحاولة الجاية
  }
  if(doneAny){
    await saveGalleryAlbumsWithRetry(GALLERY_ALBUMS);
    showToast(`✅ اترفعت الصور اللي كانت مستنية (${queue.length - PENDING_GALLERY_UPLOADS.length}) بعد رجوع الاتصال`);
    render();
  }
}
if(typeof window !== 'undefined'){
  window.addEventListener('online', ()=>{ processPendingGalleryUploads(); processPendingParticipantPhotoUploads(); });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ processPendingGalleryUploads(); processPendingParticipantPhotoUploads(); } });
}

      okCount++;
    } else {
      PENDING_PARTICIPANT_PHOTO_UPLOADS.push({ photoId, dataUrl, pid, ts: Date.now() });
      queuedCount++;
    }
    if(i < files.length-1) await sleep(450);
  }
  if(okCount>0) await saveParticipantPhotosIndexWithRetry(PARTICIPANT_PHOTOS);
  if(inputEl) inputEl.value = '';
  if(okCount === files.length){
    showToast(`تمت إضافة ${okCount} صورة ✅`);
  } else if(queuedCount>0 && okCount>0){
    showToast(`اتضافت ${okCount} صورة، و${queuedCount} في قائمة الانتظار هترفع تلقائي ⏳`, true);
  } else if(queuedCount>0){
    showToast(`📵 النت ضعيف/مقطوع دلوقتي — ${queuedCount} صورة اتحطت في قائمة الانتظار وهترفع تلقائي، سيب الصفحة مفتوحة`, true);
  } else {
    showToast('⚠️ حصلت مشكلة في رفع الصور — جرّب تاني', true);
  }
  render();
  scheduleParticipantPhotoUploadRetry();
}
let _pPhotoRetryTimer = null;
function scheduleParticipantPhotoUploadRetry(){
  if(_pPhotoRetryTimer) return;
  if(!PENDING_PARTICIPANT_PHOTO_UPLOADS.length) return;
  _pPhotoRetryTimer = setTimeout(async ()=>{
    _pPhotoRetryTimer = null;
    await processPendingParticipantPhotoUploads();
    if(PENDING_PARTICIPANT_PHOTO_UPLOADS.length) scheduleParticipantPhotoUploadRetry();
  }, 20000);
}
async function processPendingParticipantPhotoUploads(){
  if(!PENDING_PARTICIPANT_PHOTO_UPLOADS.length) return;
  if(navigator.onLine === false) return;
  const queue = PENDING_PARTICIPANT_PHOTO_UPLOADS.slice();
  let doneAny = false;
  for(const item of queue){
    const saved = await saveParticipantPhoto(item.photoId, item.dataUrl, 1);
    if(saved){
      if(!PARTICIPANT_PHOTOS[item.pid]) PARTICIPANT_PHOTOS[item.pid] = [];
      if(!PARTICIPANT_PHOTOS[item.pid].includes(item.photoId)) PARTICIPANT_PHOTOS[item.pid].push(item.photoId);
      PENDING_PARTICIPANT_PHOTO_UPLOADS = PENDING_PARTICIPANT_PHOTO_UPLOADS.filter(x=>x.photoId!==item.photoId);
      doneAny = true;
    }
  }
  if(doneAny){
    await saveParticipantPhotosIndexWithRetry(PARTICIPANT_PHOTOS);
    showToast(`✅ اترفعت صور المشاركين اللي كانت مستنية بعد رجوع الاتصال`);
    render();
  }
}

async function doSaveParticipant(pid){
  const p = PARTICIPANTS.find(x=>x.id===pid);
  if(!p) return;
  const overrides = PARTICIPANT_OVERRIDES;
  const ov = overrides[pid] || (overrides[pid] = {});
  const nameEl = document.getElementById('edit-pname-'+pid);
  const idEl = document.getElementById('edit-pid-'+pid);
  const teamEl = document.getElementById('edit-pteam-'+pid);
  const photoEl = document.getElementById('edit-pphoto-'+pid);
  const pendingCroppedKey = photoEl ? photoEl.id : null;
  if(nameEl && nameEl.value.trim()){ ov.name = nameEl.value.trim(); p.name = ov.name; }
  if(teamEl){ ov.teamId = teamEl.value; p.teamId = ov.teamId; }
  delete ov.photo;
  let currentPid = pid;
  if(idEl && idEl.value.trim()){
    const newId = normalizeDigits(idEl.value.trim()).replace(/[^0-9]/g,'');
    if(!newId){ showToast('الكود لازم يكون أرقام بس', true); return; }
    if(newId !== pid){
      if(PARTICIPANTS.some(x=>x.id===newId)){ showToast('الكود ده مستخدم بالفعل', true); return; }
      // migrate immediately in-memory so the UI reflects it without waiting on a storage round-trip
      migrateParticipantId(p, pid, newId);
      delete overrides[pid];
      overrides[newId] = Object.assign({}, ov, { newId:undefined, migrated:true });
      currentPid = newId;
      if(p.photo && !PENDING_CROPPED_PHOTOS[pendingCroppedKey]){
        await savePhotoIndividually(newId, p.photo);
        await deletePhotoIndividually(pid);
      }
    }
  }
  const croppedPhoto = pendingCroppedKey ? PENDING_CROPPED_PHOTOS[pendingCroppedKey] : null;
  const photo = croppedPhoto || await readImageFileToDataUrl(photoEl, 260);
  let photoSaveOk = true;
  if(photo){
    p.photo = photo;
    photoSaveOk = await savePhotoIndividually(currentPid, photo);
  }
  if(pendingCroppedKey) delete PENDING_CROPPED_PHOTOS[pendingCroppedKey];
  const saved = await saveParticipantOverrides(overrides);
  if(!saved || !photoSaveOk){
    showToast('⚠️ حصلت مشكلة في حفظ الصورة — جرّب صورة أصغر', true);
  } else {
    showToast('تم حفظ بيانات المشارك');
  }
  state.editingParticipantId = null;
  render();
}

  if(!name){ showToast('اكتب اسم الفقرة الأول', true); return; }
  const pts = ptsEl ? (parseInt(normalizeDigits(ptsEl.value),10)||5) : 5;
  const list = CUSTOM_SESSIONS[dayId] || (CUSTOM_SESSIONS[dayId] = []);
  const newId = dayId+'-cs'+Date.now();
  const newSession = { id:newId, name, points:pts, type:'talk', code:Math.random().toString(36).slice(2,6).toUpperCase() };
  list.push(newSession);
  const day = DAYS.find(d=>d.id===dayId);
  if(day){ day.sessions.push(newSession); if(day.baseSessions) day.baseSessions.push(newSession); }
  showToast('تمت إضافة الفقرة');
  if(nameEl) nameEl.value = '';
  if(ptsEl) ptsEl.value = '';
  render();
  await saveCustomSessions(CUSTOM_SESSIONS);
}

let tpTargetField = null;
let tpState = { h:10, m:0, ampm:'ص' };
function openTimePicker(fieldId){
  tpTargetField = fieldId;
  const hidden = document.getElementById(fieldId);
  const parsed = parseTimeStr(hidden ? hidden.value : '');
  tpState = { h: parseInt(parsed.h,10), m: parseInt(parsed.m,10), ampm: parsed.ampm };
  const hourItems = Array.from({length:12},(_,i)=>i+1).map(h=>`<div class="tp-wheel-item" data-val="${h}">${String(h).padStart(2,'0')}</div>`).join('');
  const minuteVals = Array.from({length:12},(_,i)=>i*5);
  const minuteItems = minuteVals.map(m=>`<div class="tp-wheel-item" data-val="${m}">${String(m).padStart(2,'0')}</div>`).join('');
  const overlay = document.createElement('div');
  overlay.className = 'tp-overlay';
  overlay.id = 'tp-overlay';
  overlay.innerHTML = `
    <div class="tp-sheet">
      <div class="tp-header">اختر وقت الفقرة</div>
      <div class="tp-display-row">
        <span class="tp-clock-ico">🕐</span>
        <span id="tp-live-h">${String(tpState.h).padStart(2,'0')}</span>:<span id="tp-live-m">${String(tpState.m).padStart(2,'0')}</span>
        <span class="tp-live-ampm" id="tp-live-ampm">${tpState.ampm}</span>
      </div>
      <div class="tp-wheels">
        <div class="tp-wheel-highlight"></div>
        <div class="tp-wheel" id="tp-wheel-hour"><div class="tp-wheel-pad"></div>${hourItems}<div class="tp-wheel-pad"></div></div>
        <div class="tp-wheel-colon">:</div>
        <div class="tp-wheel" id="tp-wheel-min"><div class="tp-wheel-pad"></div>${minuteItems}<div class="tp-wheel-pad"></div></div>
        <div class="tp-ampm-col">
          <button type="button" class="tp-ampm-btn ${tpState.ampm==='ص'?'active':''}" data-action="tp-ampm" data-val="ص">ص AM</button>
          <button type="button" class="tp-ampm-btn ${tpState.ampm==='م'?'active':''}" data-action="tp-ampm" data-val="م">م PM</button>
        </div>
      </div>
      <div class="tp-actions">
        <button type="button" class="tp-cancel-btn" data-action="cancel-time-picker">إلغاء</button>
        <button type="button" class="tp-done-btn" data-action="confirm-time-picker">تم</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{
    overlay.classList.add('show');
    const hourWheel = document.getElementById('tp-wheel-hour');
    const minWheel = document.getElementById('tp-wheel-min');
    const hourIdx = tpState.h-1;
    const minIdx = minuteVals.indexOf(tpState.m)>=0 ? minuteVals.indexOf(tpState.m) : Math.round(tpState.m/5);
    hourWheel.scrollTop = hourIdx*38;
    minWheel.scrollTop = minIdx*38;
    attachWheelScroll(hourWheel, (idx)=>{ tpState.h = idx+1; syncTpDisplay(); });
    attachWheelScroll(minWheel, (idx)=>{ tpState.m = minuteVals[idx]; syncTpDisplay(); });
  });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeTimePicker(); });
}
function attachWheelScroll(wheelEl, onSettle){
  let timer = null;
  wheelEl.addEventListener('scroll', ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
      const idx = Math.round(wheelEl.scrollTop/38);
      wheelEl.scrollTo({top: idx*38, behavior:'smooth'});
      onSettle(idx);
      SND.click();
    }, 120);
  });
}
function syncTpDisplay(){
  const hEl = document.getElementById('tp-live-h');
  const mEl = document.getElementById('tp-live-m');
  const aEl = document.getElementById('tp-live-ampm');
  if(hEl) hEl.textContent = String(tpState.h).padStart(2,'0');
  if(mEl) mEl.textContent = String(tpState.m).padStart(2,'0');
  if(aEl) aEl.textContent = tpState.ampm;
}
function setTpAmpm(val){
  tpState.ampm = val;
  document.querySelectorAll('.tp-ampm-btn').forEach(b=>b.classList.toggle('active', b.dataset.val===val));
  syncTpDisplay();
  vibrate(8);
}
function closeTimePicker(){
  const overlay = document.getElementById('tp-overlay');
  if(!overlay) return;
  overlay.classList.remove('show');
  setTimeout(()=>{ if(overlay.parentNode) overlay.remove(); }, 250);
  tpTargetField = null;
}
function confirmTimePicker(){
  if(!tpTargetField) return;
  const value = `${String(tpState.h).padStart(2,'0')}:${String(tpState.m).padStart(2,'0')} ${tpState.ampm}`;
  const hidden = document.getElementById(tpTargetField);
  if(hidden) hidden.value = value;
  const display = document.getElementById(tpTargetField+'-display');
  if(display) display.textContent = `${String(tpState.h).padStart(2,'0')}:${String(tpState.m).padStart(2,'0')}`;
  const trigger = display ? display.closest('.tp-trigger') : null;
  if(trigger){ const ampmEl = trigger.querySelector('.tp-trigger-ampm'); if(ampmEl) ampmEl.textContent = tpState.ampm; }
  closeTimePicker();
}

function doShareCard(){
  if(!state.pid) return;
  const p = PARTICIPANTS.find(x=>x.id===state.pid);

  const rank = rankedParticipants().findIndex(x=>x.id===p.id)+1;

  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 820;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,'#171449'); grad.addColorStop(1,'#0E0D2B');
  ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.textAlign='center';
  ctx.fillStyle='#F4B740'; ctx.font='900 40px Cairo, sans-serif';
  ctx.fillText('جلافيرا 3', canvas.width/2, 90);
  ctx.fillStyle='#9D9BC4'; ctx.font='500 16px Tajawal, sans-serif';
  ctx.fillText('بطاقة رحلة المشارك', canvas.width/2, 122);

  ctx.beginPath();
  ctx.arc(canvas.width/2, 260, 90, 0, Math.PI*2);
  ctx.fillStyle = team.color; ctx.fill();
  ctx.fillStyle='#1a1633'; ctx.font='800 46px Cairo, sans-serif';
  ctx.fillText(initials(p.name), canvas.width/2, 275);

  ctx.fillStyle='#F6F5FF'; ctx.font='800 30px Cairo, sans-serif';

  ctx.fillStyle='#9D9BC4'; ctx.font='500 16px Tajawal, sans-serif';
  ctx.fillText('مجموع النقاط', canvas.width/2, 592);

  ctx.fillStyle='#3FDCC9'; ctx.font='800 26px Cairo, sans-serif';

  ctx.fillStyle='#5D5A99'; ctx.font='500 13px Tajawal, sans-serif';

  canvas.toBlob(async (blob)=>{

function notifyNative(title, body){
  try{
    if(typeof Notification==='undefined') return;
    if(Notification.permission==='granted'){
      new Notification(title, { body, icon: undefined });
    } else if(Notification.permission!=='denied'){
      Notification.requestPermission().then(perm=>{
        if(perm==='granted') new Notification(title, { body });
      });
    }
  }catch(e){}
}

async function doGeneratePointCodes(){
  const valEl = document.getElementById('gen-code-value');
  const qtyEl = document.getElementById('gen-code-qty');
  if(!valEl || !qtyEl) return;
  const value = parseInt(normalizeDigits(valEl.value),10);
  const qty = Math.min(500, parseInt(normalizeDigits(qtyEl.value),10)||0);
  if(!value || value<=0){ showToast('اكتب قيمة نقاط صحيحة', true); return; }
  if(!qty || qty<=0){ showToast('اكتب كمية صحيحة', true); return; }
  const existing = Object.keys(POINT_CODES).filter(c=>POINT_CODES[c].value===value && !POINT_CODES[c].sessionId).length;
  for(let i=1;i<=qty;i++){
    const num = existing+i;
    const code = `G${value}-${String(num).padStart(3,'0')}`;
    POINT_CODES[code] = { value, used:false, usedBy:null, usedAt:null, usedSessionId:null, sessionId:null };
  }
  const ok = await savePointCodes(POINT_CODES);
  if(!ok){ showToast('تعذر حفظ الأكواد على السيرفر — السبب: ' + (_fbLastError||'غير معروف'), true); render(); return; }
  showToast(`اتولدت ${qty} كود بقيمة ${value} نقطة`);
  render();
}
/* ---------- secure 4-char session codes: letters + digits + symbols, random order, never sequential ---------- */
const SCODE_LETTERS = 'ABCDEFGHJKMNPQRSTUVWXYZ'; // no I/L/O to avoid confusion with 1/0
const SCODE_DIGITS = '23456789'; // no 0/1 to avoid confusion with O/I
const SCODE_SYMBOLS = '*#@%+='; // HTML/URL-safe, easy to read and type
function genSecureSessionCode(existingSet){
  const fullPool = SCODE_LETTERS + SCODE_DIGITS + SCODE_SYMBOLS;
  const pick = (pool)=>pool[Math.floor(Math.random()*pool.length)];
  let code, attempts = 0;
  do{
    // guarantee at least one letter + one digit + one symbol, then one more random char
    const chars = [pick(SCODE_LETTERS), pick(SCODE_DIGITS), pick(SCODE_SYMBOLS), pick(fullPool)];
    for(let i=chars.length-1;i>0;i--){ // shuffle so the type order is unpredictable
      const j = Math.floor(Math.random()*(i+1));
      [chars[i],chars[j]] = [chars[j],chars[i]];
    }
    code = chars.join('');
    attempts++;
  } while(existingSet.has(code) && attempts<500);
  return code;
}
async function doGenerateDayPointCodes(dayId){
  const day = DAYS.find(d=>d.id===dayId);
  if(!day) return;
  const minEl = document.getElementById('gen-day-scode-min-'+dayId);
  const maxEl = document.getElementById('gen-day-scode-max-'+dayId);
  const qtyEl = document.getElementById('gen-day-scode-qty-'+dayId);
  if(!minEl || !maxEl || !qtyEl) return;
  const minVal = parseInt(normalizeDigits(minEl.value),10);
  const maxVal = parseInt(normalizeDigits(maxEl.value),10);
  const qtyPerValue = Math.min(300, parseInt(normalizeDigits(qtyEl.value),10)||0);
  if(isNaN(minVal) || minVal<0){ showToast('اكتب أقل قيمة نقاط صحيحة (تقدر تكون صفر)', true); return; }
  if(isNaN(maxVal) || maxVal<minVal){ showToast('أعلى قيمة لازم تكون أكبر من أو تساوي أقل قيمة', true); return; }
  if(!qtyPerValue || qtyPerValue<=0){ showToast('اكتب عدد أكواد صحيح لكل قيمة في كل فقرة', true); return; }
  const eligibleSessions = day.sessions.filter(s=>(SESSION_INFO[s.id]||{}).pointsEnabled!==false);
  if(!eligibleSessions.length){ showToast('كل فقرات اليوم ده متوقف فيها النقاط', true); return; }

  const valuesRange = [];
  for(let v=minVal; v<=maxVal; v++) valuesRange.push(v);

  eligibleSessions.forEach(s=>{
    const existingKeys = Object.keys(POINT_CODES).filter(c=>POINT_CODES[c].sessionId===s.id);
    const existingSet = new Set(existingKeys.map(k=>POINT_CODES[k].code));
    valuesRange.forEach(value=>{
      for(let i=0;i<qtyPerValue;i++){
        const code = genSecureSessionCode(existingSet);
        existingSet.add(code);
        const storageKey = s.id+':'+code;
        POINT_CODES[storageKey] = { code, value, used:false, usedBy:null, usedAt:null, usedSessionId:null, sessionId:s.id };
      }
    });
  });

  const totalPerSession = qtyPerValue * valuesRange.length;
  const ok = await savePointCodes(POINT_CODES);
  if(!ok){ showToast('تعذر حفظ الأكواد على السيرفر — السبب: ' + (_fbLastError||'غير معروف'), true); render(); return; }
  showToast(`اتولد ${qtyPerValue} كود لكل قيمة من ${minVal} لـ ${maxVal} (إجمالي ${totalPerSession} كود) لكل فقرة من فقرات "${day.label}" (${eligibleSessions.length} فقرة)`, false, 3600);
  if(minEl) minEl.value = '';
  if(maxEl) maxEl.value = '';
  if(qtyEl) qtyEl.value = '';
  render();
}

async function doGenerateSessionPointCodes(sessionId){
  const info = SESSION_INFO[sessionId] || {};
  if(info.pointsEnabled===false){ showToast('النقاط متوقفة في هذه الفقرة — فعّلها الأول من إعدادات الفقرة', true); return; }
  const valEl = document.getElementById('gen-scode-value-'+sessionId);
  const qtyEl = document.getElementById('gen-scode-qty-'+sessionId);
  if(!valEl || !qtyEl) return;
  const value = parseInt(normalizeDigits(valEl.value),10);
  const qty = Math.min(300, parseInt(normalizeDigits(qtyEl.value),10)||0);
  if(!value || value<=0){ showToast('اكتب قيمة نقاط صحيحة', true); return; }
  if(!qty || qty<=0){ showToast('اكتب كمية صحيحة', true); return; }
  const existingKeys = Object.keys(POINT_CODES).filter(c=>POINT_CODES[c].sessionId===sessionId);
  const existingSet = new Set(existingKeys.map(k=>POINT_CODES[k].code));
  for(let i=0;i<qty;i++){
    const code = genSecureSessionCode(existingSet);
    existingSet.add(code);
    const storageKey = sessionId+':'+code;
    POINT_CODES[storageKey] = { code, value, used:false, usedBy:null, usedAt:null, usedSessionId:null, sessionId };
  }
  const ok = await savePointCodes(POINT_CODES);
  if(!ok){ showToast('تعذر حفظ الأكواد على السيرفر — السبب: ' + (_fbLastError||'غير معروف'), true); render(); return; }
  showToast(`اتولدت ${qty} كود خاص بهذه الفقرة بقيمة ${value} نقطة`);
  if(valEl) valEl.value = '';
  if(qtyEl) qtyEl.value = '';
  render();
}
function drawCustomSessionQr(sessionId, text){
  const holder = document.getElementById('custom-qr-holder-'+sessionId);

  holder.innerHTML = '';
  const box = document.createElement('div');
  box.style.background = '#fff';
  box.style.padding = '10px';
  box.style.borderRadius = '12px';
  holder.appendChild(box);
  createQR(box, {text, width:170, height:170, colorDark:'#12112E', colorLight:'#ffffff'});
  const cap = document.createElement('div');
  cap.className = 'hint';
  cap.style.textAlign = 'center';
  cap.style.wordBreak = 'break-word';
  cap.textContent = text;
  holder.appendChild(cap);
  const printBtn = document.createElement('button');
  printBtn.type = 'button';

  printBtn.textContent = '🖨️ طباعة هذا الكود';
  printBtn.addEventListener('click', ()=>printCustomSessionQr(text));
  holder.appendChild(printBtn);
}

async function doAdminUnlock(){
  const input = document.getElementById('admin-pass-input');
  if(!input) return;
  if(Date.now() < adminLockedUntil){ render(); return; }
  const entered = input.value.trim();
  if(entered.length < ADMIN_PASSCODE_LEN) return;
  const hash = await sha256Hex(entered);
  if(hash === ADMIN_PASSCODE_HASH){
    adminFailedAttempts = 0;
    state.adminUnlocked = true;
    render();
  } else {
    adminFailedAttempts++;
    if(adminFailedAttempts >= ADMIN_LOCKOUT_MAX_ATTEMPTS){
      adminLockedUntil = Date.now() + ADMIN_LOCKOUT_MS;
      adminFailedAttempts = 0;
      showToast('اتقفل الدخول مؤقتًا بسبب محاولات كتير غلط', true);
      vibrate([30,40,30,40,30]);
      render();
      setTimeout(()=>{ if(state.view==='admin' && !state.adminUnlocked) render(); }, ADMIN_LOCKOUT_MS + 200);
      return;
    }
    showToast('كود المنظمين غير صحيح', true);
    vibrate([30,40,30]);
    const boxes = document.querySelectorAll('.admin-otp-box');
    boxes.forEach(b=>{ b.value=''; b.classList.remove('filled'); });
    if(boxes[0]) boxes[0].focus();
    syncAdminOtpHidden();
  }
}

async function doSaveLogistics(pid){
  const g = id => document.getElementById(id);
  const room = g('lg-room-'+pid), roommate = g('lg-roommate-'+pid), meals = g('lg-meals-'+pid), food = g('lg-food-'+pid),
        gather = g('lg-gather-'+pid), depart = g('lg-depart-'+pid), bus = g('lg-bus-'+pid), sup = g('lg-super-'+pid), status = g('lg-status-'+pid);
  if(!room) return;
  const kit = {};
  KIT_ITEMS.forEach(it=>{ const cb = g('lg-kit-'+it.key+'-'+pid); kit[it.key] = !!(cb && cb.checked); });
  LOGISTICS[pid] = {
    room: room.value.trim(), roommate: roommate.value.trim(), mealTimes: meals.value.trim(), foodLocation: food.value.trim(),
    gatherPoint: gather.value.trim(), departTime: depart.value.trim(), busNumber: bus.value.trim(), supervisor: sup.value.trim(),

  };
  await saveLogistics(LOGISTICS);
  state.editingLogisticsId = null;
  showToast('اتحفظت بيانات المشارك');
  render();
}

async function doSaveAdminPasscode(){
  const curEl = document.getElementById('admin-pass-current');
  const newEl = document.getElementById('admin-pass-new');
  const confEl = document.getElementById('admin-pass-confirm');
  const current = curEl ? curEl.value.trim() : '';
  const fresh = newEl ? newEl.value.trim() : '';
  const confirm_ = confEl ? confEl.value.trim() : '';
  if(!current || !fresh || !confirm_){ showToast('املأ كل الحقول الأول', true); return; }
  if(!/^\d+$/.test(fresh) || fresh.length !== ADMIN_PASSCODE_LEN){ showToast(`الكود الجديد لازم يكون ${ADMIN_PASSCODE_LEN} أرقام بالظبط`, true); return; }
  if(fresh !== confirm_){ showToast('الكود الجديد وتأكيده مش متطابقين', true); return; }
  const currentHash = await sha256Hex(current);
  if(currentHash !== ADMIN_PASSCODE_HASH){ showToast('الكود الحالي غلط', true); return; }
  if(fresh === current){ showToast('الكود الجديد لازم يكون مختلف عن الحالي', true); return; }
  const newHash = await sha256Hex(fresh);
  const ok = await saveAdminPasscodeHash(newHash);
  if(!ok){ showToast('تعذر حفظ الكود، تحقق من الاتصال وحاول تاني', true); return; }
  ADMIN_PASSCODE_HASH = newHash;
  [curEl, newEl, confEl].forEach(el=>{ if(el) el.value=''; });
  showToast('تم تغيير كود دخول المنظمين');
}
