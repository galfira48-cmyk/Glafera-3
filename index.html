    text-align:center; white-space:nowrap; overflow:hidden;
    transition:opacity .35s ease, transform .35s ease, border-color .35s ease, box-shadow .35s ease;}
  .gallery-card:not(.gc-focused) .gc-title-bar{opacity:.62; transform:scale(.92);}
  .gallery-card.gc-focused .gc-title-bar{border-color:rgba(244,183,64,.4); box-shadow:0 10px 22px rgba(0,0,0,.32), 0 0 0 1px rgba(244,183,64,.12);}
  .gallery-card.gc-focused .gc-title-bar::after{content:''; position:absolute; inset:-1px; border-radius:12px;
    border:1px solid rgba(244,183,64,.3); pointer-events:none; animation:gcFocusPulse 2.4s ease-out infinite;}
  @keyframes gcFocusPulse{0%{opacity:.65; transform:scale(1);} 100%{opacity:0; transform:scale(1.12);}}
  .gallery-card .gc-title-eyebrow{font-family:'Cairo',sans-serif; font-weight:800; font-size:8px; letter-spacing:1.8px;
    text-transform:uppercase; color:var(--gold-2); opacity:.9; text-shadow:0 1px 3px rgba(0,0,0,.4);}
  .gallery-card .gc-title-main{display:inline-block; font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:16px;
    color:#fff; line-height:1.25; text-shadow:0 1px 3px rgba(0,0,0,.4);
    overflow:hidden; text-overflow:ellipsis; max-width:100%; position:relative; padding-top:2px;}
  .gallery-card .gc-title-main::before{content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:22px; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent);}

  /* ---------- gallery album (photo grid page) ---------- */
  .album-hero{position:relative; height:172px; margin-top:12px; border-radius:22px; overflow:hidden;
    background-size:cover; background-position:center; background-color:var(--surface-2);
    border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .album-hero::after{content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.72) 100%);}
  .album-hero.no-cover{background:linear-gradient(135deg, var(--surface-2), var(--surface));}
  .album-hero-content{position:absolute; left:16px; right:16px; bottom:14px; z-index:2;}
  .album-hero-title{font-family:'Cairo',sans-serif; font-weight:900; font-size:19px; color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5); line-height:1.3;}
  .album-hero-sub{font-family:'Tajawal',sans-serif; font-size:12px; color:var(--gold); font-weight:700;
    margin-top:4px; display:flex; align-items:center; gap:5px;}
  .album-grid{display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:108px; gap:8px; margin-top:14px;}
  .album-grid.album-grid-few{grid-template-columns:repeat(2,1fr); grid-auto-rows:165px;}
  .album-item{position:relative; border-radius:16px; overflow:hidden; cursor:pointer;
    background-size:cover; background-position:center; background-color:var(--surface);
    border:1px solid var(--border); box-shadow:0 4px 14px rgba(0,0,0,.18);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;
    animation:albumItemIn .5s cubic-bezier(.22,.68,0,1.02) backwards;}
  .album-item.featured{grid-column:span 2; grid-row:span 2;}
  .album-item::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,.3) 100%); opacity:0; transition:opacity .22s ease;}
  .album-item:active{transform:scale(.94); box-shadow:0 2px 8px rgba(0,0,0,.22);}
  .album-item:active::after{opacity:1;}
  .album-item .ai-expand{position:absolute; top:7px; right:7px; width:22px; height:22px; border-radius:50%;
    background:rgba(10,8,20,.45); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(.7); transition:opacity .22s ease, transform .22s ease; color:#fff;}
  .album-item .ai-expand svg{width:11px; height:11px;}
  .album-item:active .ai-expand{opacity:1; transform:scale(1);}
  @keyframes albumItemIn{0%{opacity:0; transform:scale(.9) translateY(8px);} 100%{opacity:1; transform:scale(1) translateY(0);}}
  .album-empty{text-align:center; padding:50px 16px; color:var(--text-muted);}
  .album-empty .ae-ico{font-size:40px; display:block; margin-bottom:10px;}

  /* ---------- gallery lightbox ---------- */
  .lightbox-backdrop{position:fixed; inset:0; background:rgba(5,4,15,.94); z-index:9999;
    display:flex; align-items:center; justify-content:center; touch-action:pan-y;}
  .lightbox-img-wrap{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  .lightbox-img-wrap img{max-width:92%; max-height:78%; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.6);
    object-fit:contain; user-select:none; -webkit-user-drag:none;}
  .lightbox-close{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); left:14px; width:36px; height:36px;
    border-radius:50%; background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.18); z-index:2;}
  .lightbox-counter{position:absolute; top:calc(env(safe-area-inset-top,0px) + 20px); right:16px; color:var(--gold);
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; z-index:2;}
  .lightbox-arrows{display:flex; justify-content:space-between; position:absolute; top:50%; left:10px; right:10px;
    transform:translateY(-50%); z-index:2;}
  .lightbox-arrow-btn{width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.1);
    backdrop-filter:blur(6px); color:#fff; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.18);}
  .lightbox-arrow-btn:active{transform:scale(.9);}
  .lightbox-download-btn{position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); right:18px;
    width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.16); cursor:pointer; z-index:3;
    background:rgba(20,17,38,.55);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center; color:#F6F5FF;
    box-shadow:0 2px 6px rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.22);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), background .22s ease;}
  .lightbox-download-btn:active{transform:scale(.90); background:rgba(20,17,38,.72);}
  .lightbox-download-btn svg{width:18px; height:18px; position:relative; z-index:1;}

  /* ---------- admin: gallery manager ---------- */
  .gallery-admin-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .gallery-admin-thumb{position:relative; width:74px; height:74px; border-radius:12px; background-size:cover;
    background-position:center; background-color:var(--surface-2); border:1px solid var(--border);}
  .gallery-admin-thumb .gat-cover-tag{position:absolute; bottom:3px; right:3px; left:3px; text-align:center;
    background:rgba(0,0,0,.55); color:var(--gold); font-size:8.5px; font-weight:800; border-radius:6px; padding:1px 0;
    font-family:'Cairo',sans-serif;}
  .gallery-admin-thumb-del{position:absolute; top:-6px; left:-6px; width:20px; height:20px; border-radius:50%;
    background:#FF6B6B; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--surface); line-height:1;}
  .gallery-admin-thumb-cover-btn{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--gold); color:#1a1633; font-size:10px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--surface); line-height:1; cursor:pointer;}
  .gallery-admin-upload-label{margin-top:10px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;}

  /* ---------- admin: private participant photos (Photo) ---------- */
  .pphoto-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .pphoto-thumb{position:relative; width:74px; height:74px; border-radius:12px; background-size:cover;
    background-position:center; background-color:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;}
  .pphoto-thumb-loading{font-size:18px; opacity:.6;}
  .pphoto-thumb-del{position:absolute; top:-6px; left:-6px; width:20px; height:20px; border-radius:50%;
    background:#FF6B6B; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--surface); line-height:1;}

  /* ---------- chat (group chat between all participants) ---------- */
  .chat-messages{ display:flex; flex-direction:column; gap:10px; max-height:56vh; overflow-y:auto; padding:6px 2px 14px; }
  .chat-bubble{ max-width:78%; padding:9px 12px; border-radius:16px; position:relative; }
  .chat-bubble.theirs{ align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-right-radius:4px; }
  .chat-bubble.mine{ align-self:flex-end; background:linear-gradient(145deg,#3FDCC9,#2AB8A6); color:#0c2b28; border-bottom-left-radius:4px; }
  .chat-bubble-name{ font-family:'Cairo',sans-serif; font-weight:800; font-size:10.5px; color:var(--gold,#F4B740); margin-bottom:3px; }
  .chat-bubble-text{ font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .chat-bubble-time{ font-size:9px; opacity:.6; margin-top:4px; text-align:left; }
  .chat-bubble-img{ max-width:100%; border-radius:10px; display:block; cursor:pointer; }
  .chat-bubble-video{ max-width:100%; border-radius:10px; display:block; }
  .chat-bubble-audio{ width:200px; max-width:100%; }
  .chat-voice-dur{ font-size:9.5px; opacity:.7; margin-top:3px; }
  .chat-media-loading{ font-size:12px; opacity:.7; padding:6px 0; }
  .chat-input-bar{ position:sticky; bottom:0; background:var(--bg); padding:8px 0 4px; border-top:1px solid var(--border); z-index:5; }
  .chat-quick-emoji{ display:flex; gap:6px; margin-bottom:6px; overflow-x:auto; }
  .chat-emoji-btn{ flex:none; background:var(--surface); border:1px solid var(--border); border-radius:10px; font-size:16px; padding:4px 8px; cursor:pointer; }
  .chat-input-row{ display:flex; align-items:center; gap:6px; }
  .chat-input-row .field{ flex:1; margin:0; }
  .chat-attach-btn{ flex:none; width:38px; height:38px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }
  .chat-send-btn{ flex:none; width:38px; height:38px; border-radius:50%; border:none; background:linear-gradient(145deg,#3FDCC9,#845EC2);
    color:#fff; display:flex; align-items:center; justify-content:center; transform:scaleX(-1); }
  .chat-voice-btn{ flex:none; width:38px; height:38px; border-radius:50%; border:none; background:var(--surface); border:1px solid var(--border);
    font-size:16px; display:flex; align-items:center; justify-content:center; }
  .chat-voice-btn.recording{ background:#FF6B6B; color:#fff; animation:chatPulse 1s ease-in-out infinite; }
  @keyframes chatPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,107,.5);} 50%{ box-shadow:0 0 0 8px rgba(255,107,107,0);} }

  /* ---------- participant-facing: my photos (Photo) page ---------- */
  .myphotos-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .myphotos-thumb{position:relative; aspect-ratio:1/1; border-radius:16px; background-size:cover; background-position:center;
    background-color:var(--surface-2); border:1px solid var(--border); overflow:hidden; cursor:pointer;}
  .myphotos-thumb-loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; opacity:.5;}

  /* ---------- ask a question box (inside session) ---------- */
  .ask-box{padding:14px; border:1.5px dashed var(--teal);}
  .ask-box-title{display:flex; align-items:center; gap:6px; font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; color:var(--teal);}
  .ask-box textarea{width:100%; min-height:60px; margin-top:10px; background:var(--bg-2); border:1.5px solid var(--border); border-radius:14px;
    padding:11px; color:var(--text); font-family:'Tajawal',sans-serif; font-size:13px; resize:vertical; outline:none;}
  .ask-box textarea:focus{border-color:var(--teal);}

  /* ---------- report a problem ---------- */
  .report-box textarea{width:100%; min-height:70px; background:var(--bg-2); border:1.5px solid var(--border); border-radius:14px;
    padding:12px; color:var(--text); font-family:'Tajawal',sans-serif; font-size:13.5px; resize:vertical; outline:none;}
  .report-box textarea:focus{border-color:var(--danger);}

  /* ---------- opinion / feedback page ---------- */
  .opinion-hero{position:relative; overflow:hidden; border-radius:20px; padding:22px 18px;
    background:linear-gradient(150deg,#241D4A,#3A2E6E 55%,#241D4A); border:1px solid rgba(255,255,255,.08);
    text-align:center; margin-bottom:16px;}
  .opinion-hero::before{content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 20% 0%, rgba(63,220,201,.16), transparent 55%),
               radial-gradient(circle at 85% 100%, rgba(155,140,255,.16), transparent 55%);}
  .opinion-hero-ico{position:relative; z-index:1; width:52px; height:52px; margin:0 auto 10px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    background:linear-gradient(145deg,#3FDCC9,#845EC2); box-shadow:0 8px 20px rgba(63,220,201,.28);}
  .opinion-hero-title{position:relative; z-index:1; font-family:'Cairo',sans-serif; font-weight:900; font-size:17px; color:#fff;}
  .opinion-hero-sub{position:relative; z-index:1; font-size:12.5px; color:rgba(255,255,255,.72); margin-top:6px; line-height:1.6;}
  .opinion-hero-edit{position:relative; z-index:1; display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    font-size:11px; font-weight:800; color:#1a1633; background:var(--gold, #F4B740); border-radius:20px; padding:5px 12px;}

  .opinion-field{border-radius:18px; padding:16px; margin-bottom:12px; background:var(--surface);
    border:1.5px solid var(--border); border-inline-start:4px solid var(--op-accent, var(--teal));
    transition:border-color .2s ease;}
  .opinion-field:focus-within{border-color:var(--op-accent, var(--teal));}
  .opinion-field-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .opinion-field-ico{width:34px; height:34px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:16px; background:rgba(63,220,201,.16); background:color-mix(in srgb, var(--op-accent, var(--teal)) 18%, transparent);}
  .opinion-field-lab{font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; color:var(--text);}
  .opinion-field textarea, .opinion-field input[type="text"]{width:100%; background:var(--bg-2); border:1.5px solid var(--border);
    border-radius:13px; padding:12px; color:var(--text); font-family:'Tajawal',sans-serif; font-size:13.5px;
    resize:vertical; outline:none; box-sizing:border-box; transition:border-color .2s ease, box-shadow .2s ease;}
  .opinion-field textarea{min-height:84px;}
  .opinion-field textarea:focus, .opinion-field input[type="text"]:focus{
    border-color:var(--op-accent, var(--teal)); box-shadow:0 0 0 3px rgba(63,220,201,.18);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--op-accent, var(--teal)) 18%, transparent);}
  .opinion-send-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:6px;}

  /* ---------- admin: opinions list + detail ---------- */
  .op-admin-row{width:100%; display:flex; align-items:center; gap:12px; padding:13px 14px; margin-bottom:9px;
    background:var(--surface); border:1px solid var(--border); border-radius:15px; cursor:pointer; text-align:right;
    font-family:'Tajawal',sans-serif; transition:border-color .2s ease, transform .15s ease;}
  .op-admin-row:active{transform:scale(.98);}
  .op-admin-row-avatar{width:38px; height:38px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:900; font-size:14px; color:#1a1633;
    background:linear-gradient(145deg,#3FDCC9,#845EC2);}
  .op-admin-row-body{flex:1; min-width:0;}
  .op-admin-row-name{font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; color:var(--text);}
  .op-admin-row-time{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
  .op-admin-row-chev{flex:none; color:var(--text-muted); transform:scaleX(-1);}
  .op-admin-back-link{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; color:var(--teal);
    margin-bottom:14px; cursor:pointer;}
  .op-admin-detail-field{border-radius:16px; padding:14px; margin-bottom:10px; background:var(--surface);
    border:1.5px solid var(--border); border-inline-start:4px solid var(--op-accent, var(--teal));}
  .op-admin-detail-lab{font-family:'Cairo',sans-serif; font-weight:800; font-size:12px; color:var(--op-accent, var(--teal)); margin-bottom:6px;}
  .op-admin-detail-val{font-size:13.5px; line-height:1.7; color:var(--text); white-space:pre-wrap;}

  /* ---------- photo crop modal ---------- */
  .crop-modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
  .crop-modal-box{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:16px;
    width:100%; max-width:360px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .crop-modal-title{ font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; color:var(--text); margin-bottom:10px; text-align:center; }
  .crop-modal-imgwrap{ width:100%; height:280px; background:#111; border-radius:14px; overflow:hidden; }
  .crop-modal-imgwrap img{ display:block; max-width:100%; }
  .crop-modal-hint{ font-size:11px; color:var(--text-muted); text-align:center; margin-top:8px; }
  .crop-modal-actions{ display:flex; gap:8px; margin-top:14px; }
  .crop-modal-actions .btn{ flex:1; }

  /* ============================= GAMES HUB & MINI-GAMES ============================= */
  .game-hub-list{display:flex; flex-direction:column; gap:12px; margin-top:4px;}
  .game-hub-card{display:flex; align-items:center; gap:14px; width:100%; text-align:right; padding:16px;
    background:linear-gradient(180deg, var(--surface), var(--surface-2)); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:0 8px 18px rgba(0,0,0,.18); transition:transform .18s ease;}
  .game-hub-card:active{transform:scale(.97);}
  .ghc-ico{width:52px; height:52px; min-width:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:24px; box-shadow:0 6px 14px rgba(0,0,0,.22);}
  .ghc-text{flex:1; display:flex; flex-direction:column; gap:3px; min-width:0;}
  .ghc-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:15px;}
  .ghc-sub{font-size:12px; color:var(--text-muted);}
  .ghc-chev{color:var(--text-muted); transform:scaleX(-1); flex-shrink:0;}

  .game-mode-switch{display:flex; gap:8px; margin:6px 0 14px;}
  .gms-btn{flex:1; padding:11px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface);
    color:var(--text-muted); font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; transition:all .2s ease;}
  .gms-btn.active{border-color:var(--gold); color:var(--gold); background:linear-gradient(180deg, var(--surface), var(--surface-2));
    box-shadow:0 0 0 1px var(--gold) inset;}

  .xo-score-row{display:flex; gap:8px; margin-bottom:12px;}
  .xo-score-pill{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 6px;
    text-align:center; display:flex; flex-direction:column; gap:2px;}
  .xo-score-pill span{font-size:11px; color:var(--text-muted); font-weight:700;}
  .xo-score-pill b{font-family:'Cairo',sans-serif; font-size:17px; color:var(--gold);}
  .xo-score-pill.draw b{color:var(--text-muted);}
  .xo-score-pill.o b{color:var(--good);}

  /* ---------- player avatars inside games (participant photo instead of name) ---------- */
  .pl-avatar{position:relative; width:40px; height:40px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; color:#1a1633; flex:0 0 auto;
    box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--border);}
  .pl-avatar.pl-ai{background:var(--surface-2); font-size:22px; color:var(--text);}
  .pl-avatar.sm{width:28px; height:28px; font-size:10px; display:inline-flex; vertical-align:middle; margin:0 4px;}
  .pl-avatar.xs{width:24px; height:24px; font-size:9px; margin:0; box-shadow:0 0 0 2px rgba(0,0,0,.35);}
  .pl-badge{position:absolute; bottom:-5px; right:-5px; min-width:18px; height:18px; padding:0 3px; border-radius:9px; box-sizing:border-box;
    background:var(--gold); color:#1a1633; font-style:normal; font-size:10px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--surface);}
  .pl-badge.pl-dot{width:18px; padding:0; border-radius:50%; box-shadow:inset 0 -2px 3px rgba(0,0,0,.25);}
  .pl-badge.pl-x{background:#E5484D; color:#fff;}
  .xo-score-pill.has-av{padding-top:10px; gap:6px; align-items:center;}
  .xo-score-pill.has-av span{line-height:1.2;}

  /* ---------- connect four: color picker ---------- */
  .c4-picker{margin:0 0 14px; text-align:center;}
  .c4-picker-label{font-size:12px; font-weight:800; color:var(--text-muted); margin-bottom:9px;}
  .c4-swatches{display:flex; flex-wrap:wrap; gap:11px; justify-content:center;}
  .c4-swatch{position:relative; width:42px; height:42px; border-radius:50%; border:none; padding:0; background:transparent; color:#fff; font-weight:900; font-size:17px;
    display:flex; align-items:center; justify-content:center;}
  .c4-sw-fill{position:absolute; inset:0; border-radius:50%; box-shadow:inset 0 -3px 4px rgba(0,0,0,.28);}
  .c4-swatch.sel .c4-sw-fill{box-shadow:0 0 0 3px var(--gold), inset 0 -3px 4px rgba(0,0,0,.28);}
  .c4-swatch.taken{cursor:default;}
  .c4-swatch.taken .c4-sw-fill{opacity:.35; filter:saturate(.5);}
  .c4-swatch .c4-sw-mark{position:relative; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .c4-swatch:not(:disabled):active{transform:scale(.9);}
  .c4-vs-row{display:flex; align-items:center; justify-content:center; gap:22px; margin:6px 0 14px;}

  /* ---------- VS intro (when both players are in the room) ---------- */
  .vs-overlay{position:fixed; inset:0; z-index:10001; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
    background:radial-gradient(circle at 50% 42%, #2f2170 0%, #150f3d 45%, #07051a 100%); overflow:hidden; direction:ltr;
    animation:vsFadeIn .35s ease both; -webkit-tap-highlight-color:transparent;}
  .vs-overlay.out{animation:vsFadeOut .45s ease forwards;}
  .vs-overlay::before{content:''; position:absolute; inset:-30%; background:conic-gradient(from 0deg, transparent 0 20%, rgba(244,183,64,.10) 25%, transparent 32% 70%, rgba(63,220,201,.10) 75%, transparent 82%);
    animation:vsSweep 6s linear infinite;}
  .vs-overlay::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 46%, rgba(255,255,255,.10) 50%, transparent 54%); transform:translateX(-120%); animation:vsStreak 1.1s ease-out 1s both;}
  .vs-tag{position:relative; z-index:2; font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; letter-spacing:3px; color:rgba(255,255,255,.55);
    animation:vsRise .6s ease .1s both;}
  .vs-stage{--s:min(29vw,124px); position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:calc(var(--s)*.78);}
  .vs-p{position:relative; width:var(--s); height:var(--s);}
  .vs-p.left{animation:vsInL .8s cubic-bezier(.16,1.15,.3,1) .2s both;}
  .vs-p.right{animation:vsInR .8s cubic-bezier(.16,1.15,.3,1) .2s both;}
  .vs-ring{position:absolute; inset:-7px; border-radius:50%; background:conic-gradient(from 0deg, var(--c1), var(--c2), var(--c1)); animation:vsSpin 2.6s linear infinite;
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));}
  .vs-glow{position:absolute; inset:-18px; border-radius:50%; background:radial-gradient(circle, var(--c1) 0%, transparent 68%); opacity:.35; animation:vsPulse 1.8s ease-in-out infinite;}
  .vs-photo{position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-family:'Cairo',sans-serif; font-weight:900; font-size:calc(var(--s)*.34); color:#1a1633; box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.07);}
  .vs-p.me{--c1:#F4B740; --c2:#FF7A59;}
  .vs-p.opp{--c1:#3FDCC9; --c2:#9B8CFF;}
  .vs-mid{position:absolute; left:50%; top:50%; width:0; height:0; z-index:3;}
  .vs-badge{position:absolute; left:0; top:0; transform:translate(-50%,-50%); font-family:'Cairo',sans-serif; font-weight:900; font-style:italic; font-size:clamp(34px,11vw,50px); line-height:1;
    background:linear-gradient(180deg,#fff 10%,#FFDE94 55%,#F4B740 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 14px rgba(244,183,64,.65)); animation:vsSlam .55s cubic-bezier(.2,1.7,.4,1) 1s both;}
  .vs-shock{position:absolute; left:0; top:0; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:3px solid rgba(255,222,148,.9); opacity:0; animation:vsShock .9s ease-out 1.05s both;}
  .vs-shock.b{animation-delay:1.22s; border-color:rgba(63,220,201,.8);}
  .vs-game{position:relative; z-index:2; display:flex; align-items:center; gap:10px; padding:10px 20px; border-radius:999px; background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; font-family:'Cairo',sans-serif; font-weight:800; font-size:16px; direction:rtl;
    animation:vsRise .6s ease 1.7s both;}
  .vs-game .vg-ico{font-size:22px;}
  .vs-go{position:relative; z-index:2; font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; color:rgba(255,255,255,.6); direction:rtl; animation:vsRise .6s ease 2.1s both, vsBlink 1.4s ease-in-out 2.7s infinite;}
  @keyframes vsFadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes vsFadeOut{to{opacity:0; transform:scale(1.04);}}
  @keyframes vsSweep{to{transform:rotate(360deg);}}
  @keyframes vsStreak{to{transform:translateX(120%);}}
  @keyframes vsRise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  @keyframes vsInL{from{opacity:0; transform:translateX(-140%) scale(.6) rotate(-12deg);} to{opacity:1; transform:none;}}
  @keyframes vsInR{from{opacity:0; transform:translateX(140%) scale(.6) rotate(12deg);} to{opacity:1; transform:none;}}
  @keyframes vsSpin{to{transform:rotate(360deg);}}
  @keyframes vsPulse{0%,100%{transform:scale(.94); opacity:.28;} 50%{transform:scale(1.06); opacity:.5;}}
  @keyframes vsSlam{0%{opacity:0; transform:translate(-50%,-50%) scale(3.4) rotate(-8deg);} 60%{opacity:1;} 100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);}}
  @keyframes vsShock{0%{opacity:.95; transform:scale(1);} 100%{opacity:0; transform:scale(15);}}
  @keyframes vsBlink{0%,100%{opacity:.35;} 50%{opacity:.8;}}

  /* ---------- emoji reactions ---------- */
  .emoji-bar{position:sticky; bottom:12px; z-index:60; display:flex; align-items:center; justify-content:center; gap:4px; margin:22px auto 0; width:fit-content; max-width:100%;
    padding:6px 8px; border-radius:999px; background:rgba(30,24,78,.72); border:1px solid var(--border);
    backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3); box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .emoji-btn{width:38px; height:38px; border-radius:50%; border:none; background:transparent; font-size:22px; line-height:1; padding:0; display:flex; align-items:center; justify-content:center;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease;}
  .emoji-btn:active{transform:scale(1.35) translateY(-3px); background:rgba(255,255,255,.12);}
  .emoji-btn.sent{animation:emojiSent .45s ease;}
  @keyframes emojiSent{0%{transform:scale(1);} 40%{transform:scale(1.4) translateY(-4px);} 100%{transform:scale(1);}}
  #react-layer{position:fixed; inset:0; pointer-events:none; z-index:10002; overflow:hidden;}
  .react-float{position:absolute; bottom:96px; display:flex; flex-direction:column; align-items:center; gap:4px; animation:reactUp 2.6s cubic-bezier(.2,.7,.3,1) forwards;}
  .react-float .rf-emoji{font-size:54px; line-height:1; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45)); animation:reactPop .5s cubic-bezier(.34,1.8,.5,1) both;}
  .react-float .pl-avatar{width:34px; height:34px; font-size:12px; box-shadow:0 0 0 2px #fff, 0 4px 12px rgba(0,0,0,.4);}
  @keyframes reactUp{0%{opacity:0; transform:translateY(20px);} 12%{opacity:1;} 70%{opacity:1;} 100%{opacity:0; transform:translateY(-300px) translateX(var(--dx,0px));}}
  @keyframes reactPop{from{transform:scale(.2) rotate(-25deg);} to{transform:scale(1) rotate(0);}}
  .c4-vs-player{display:flex; flex-direction:column; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--text-muted);}
  .c4-dot{display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; box-shadow:inset 0 -2px 3px rgba(0,0,0,.25);}
  .xo-status{text-align:center; font-family:'Cairo',sans-serif; font-weight:800; font-size:14.5px; margin-bottom:12px;
    min-height:20px; color:var(--text);}
  .xo-board{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; max-width:330px; margin:0 auto;}
  .xo-cell{aspect-ratio:1/1; border-radius:18px; background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1.5px solid var(--border); font-family:'Cairo',sans-serif; font-weight:900; font-size:34px;
    display:flex; align-items:center; justify-content:center; color:var(--text); transition:transform .12s ease;}
  .xo-cell:not(:disabled):active{transform:scale(.92);}
  .xo-cell.xo-x{color:var(--gold);}
  .xo-cell.xo-o{color:var(--good);}
  .xo-cell.xo-x, .xo-cell.xo-o{animation:xoMarkPop .28s cubic-bezier(.34,1.56,.64,1);}
  .xo-cell.xo-win{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset, 0 0 18px rgba(244,183,64,.35); animation:xoWinPulse 1s ease-in-out infinite;}
  @keyframes xoMarkPop{0%{transform:scale(.3) rotate(-15deg); opacity:0;} 70%{transform:scale(1.15) rotate(4deg); opacity:1;} 100%{transform:scale(1) rotate(0);}}
  @keyframes xoWinPulse{0%,100%{box-shadow:0 0 0 2px var(--gold) inset, 0 0 18px rgba(244,183,64,.35);} 50%{box-shadow:0 0 0 2px var(--gold) inset, 0 0 30px rgba(244,183,64,.6);}}

  .c4-board{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:370px; margin:0 auto;
    background:linear-gradient(180deg, var(--surface-2), var(--surface)); padding:10px; border-radius:18px; border:1px solid var(--border);}
  .c4-cell{aspect-ratio:1/1; border-radius:50%; background:var(--bg); border:none; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .c4-cell:disabled{cursor:default;}
  .c4-cell:not(:disabled):active{transform:scale(.9);}
  .c4-disc{width:82%; height:82%; border-radius:50%; background:transparent; transition:background .15s;}
  .c4-cell.c4-r{animation:xoMarkPop .28s cubic-bezier(.34,1.56,.64,1);}
  .c4-cell.c4-y{animation:xoMarkPop .28s cubic-bezier(.34,1.56,.64,1);}
  .c4-cell.c4-r .c4-disc{background:linear-gradient(145deg,#FF7A59,#D6473A); box-shadow:inset 0 -3px 4px rgba(0,0,0,.28);}
  .c4-cell.c4-y .c4-disc{background:linear-gradient(145deg,#FFDE94,#F4B740); box-shadow:inset 0 -3px 4px rgba(0,0,0,.28);}
  .c4-cell.c4-win{animation:xoWinPulse 1s ease-in-out infinite;}
  .c4-cell.c4-win .c4-disc{box-shadow:0 0 0 3px var(--gold) inset, 0 0 14px rgba(244,183,64,.55);}

  .domino-opp-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 10px; flex-wrap:wrap;}
  .domino-opp-label{font-size:12.5px; color:var(--text-muted); font-weight:700;}
  .domino-opp-tiles{display:flex; gap:3px; flex-wrap:wrap; max-width:60%; justify-content:flex-end;}
  .domino-back{width:14px; height:22px; border-radius:3px; background:linear-gradient(145deg, var(--violet), #6C5CE7); border:1px solid rgba(255,255,255,.25); flex-shrink:0;}
  .domino-chain{display:flex; gap:4px; overflow-x:auto; padding:14px 10px; background:linear-gradient(180deg, var(--surface-2), var(--surface)); border-radius:16px; border:1px solid var(--border); -webkit-overflow-scrolling:touch;}
  .domino-empty-hint{margin:0 auto; color:var(--text-muted); font-size:13px; font-weight:700; padding:10px; white-space:nowrap;}
  .domino-tile-h{display:flex; flex-direction:row; width:60px; height:32px; min-width:60px; background:linear-gradient(180deg,#FFFDF6,#EDE7D3); border-radius:6px; border:1px solid rgba(0,0,0,.25); box-shadow:0 2px 4px rgba(0,0,0,.2); overflow:hidden; flex-shrink:0;}
  .domino-tile-h .domino-half:first-child{border-left:2px solid rgba(0,0,0,.35);}
  .domino-hand-label{font-size:12.5px; color:var(--text-muted); font-weight:700; margin:14px 0 8px;}
  .domino-hand{display:flex; gap:7px; overflow-x:auto; padding:6px 2px 10px; -webkit-overflow-scrolling:touch;}
  .domino-tile{display:flex; flex-direction:column; width:46px; height:86px; min-width:46px; background:linear-gradient(180deg,#FFFDF6,#EDE7D3); border-radius:8px; border:1px solid rgba(0,0,0,.25); box-shadow:0 3px 6px rgba(0,0,0,.25); overflow:hidden; padding:0; cursor:pointer; flex-shrink:0;}
  .domino-tile .domino-half:first-child{border-bottom:2px solid rgba(0,0,0,.35);}
  .domino-tile.playable{box-shadow:0 3px 10px rgba(244,183,64,.4), 0 0 0 2px var(--gold);}
  .domino-tile:disabled{opacity:.4; cursor:default;}
  .domino-tile:not(:disabled):active{transform:scale(.92);}
  .domino-half{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2px; flex:1; padding:4px;}
  .dpip{border-radius:50%; background:#2b2440;}
  .dpip.empty{background:transparent;}
  .domino-side-picker{display:flex; gap:8px; margin:10px 0;}
  .domino-side-picker .btn{flex:1;}

  .memory-stats-row{display:flex; gap:8px; margin-bottom:14px;}
  .memory-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:360px; margin:0 auto;}
  .memory-card{aspect-ratio:1/1; perspective:600px; background:transparent; border:none; padding:0;}
  .mc-inner{position:relative; width:100%; height:100%; display:block; transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.34,1.2,.64,1); border-radius:14px;}
  .memory-card.flipped .mc-inner{transform:rotateY(180deg);}
  .memory-card.matched .mc-inner{transform:rotateY(180deg) scale(.94); filter:saturate(1.3);}
  .mc-back, .mc-front{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    border-radius:14px; backface-visibility:hidden; font-size:22px; border:1.5px solid var(--border);}
  .mc-back{background:linear-gradient(155deg, var(--surface-2), var(--surface)); color:var(--gold); font-size:17px;}
  .mc-front{background:linear-gradient(155deg, var(--surface), var(--surface-2)); transform:rotateY(180deg); font-size:24px;}
  .memory-card.matched .mc-front{border-color:var(--good); box-shadow:0 0 12px rgba(95,224,164,.4);}

  .rps-battle{display:flex; align-items:center; justify-content:center; gap:18px; margin:10px 0 6px;}
  .rps-side{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .rps-emoji{font-size:46px; width:88px; height:88px; border-radius:24px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--surface), var(--surface-2)); border:1.5px solid var(--border);}
  .rps-emoji.spin{animation:rpsSpin .55s linear infinite;}
  @keyframes rpsSpin{0%{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.08);} 100%{transform:rotate(360deg) scale(1);}}
  .rps-vs{font-family:'Cairo',sans-serif; font-weight:900; color:var(--text-muted); font-size:13px;}
  .rps-lab{font-size:12px; color:var(--text-muted); font-weight:700;}
  .rps-choices{display:flex; gap:10px; margin-top:16px;}
  .rps-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px 6px; border-radius:18px;
    background:linear-gradient(180deg, var(--surface), var(--surface-2)); border:1.5px solid var(--border); font-size:30px; color:var(--text);}
  .rps-btn span{font-size:12px; font-weight:700; color:var(--text-muted);}
  .rps-btn:not(:disabled):active{transform:scale(.93);}
  .rps-btn:disabled{opacity:.5;}

  .numguess-display{font-family:'Cairo',sans-serif; font-weight:900; font-size:44px; text-align:center; color:var(--gold);
    background:linear-gradient(180deg, var(--surface), var(--surface-2)); border:1.5px solid var(--border); border-radius:20px;
    padding:18px 10px; margin:14px 0; min-height:64px; display:flex; align-items:center; justify-content:center;}
  .numguess-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .numguess-key{padding:16px 0; border-radius:14px; font-family:'Cairo',sans-serif; font-weight:800; font-size:18px;
    background:linear-gradient(180deg, var(--surface), var(--surface-2)); border:1.5px solid var(--border); color:var(--text);}
  .numguess-key:not(:disabled):active{transform:scale(.93);}
  .numguess-key:disabled{opacity:.5;}

  .room-join-row{display:flex; gap:10px; align-items:center;}
  .room-code-input{flex:1; text-align:center; letter-spacing:6px; font-family:'Cairo',sans-serif; font-weight:800; font-size:22px;
    padding:14px 10px; border-radius:14px; background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1.5px solid var(--border); color:var(--text);}
  .room-waiting{text-align:center; padding:20px 10px;}
  .room-code-display{font-family:'Cairo',sans-serif; font-weight:900; font-size:20px; color:var(--text);
    background:linear-gradient(180deg, var(--surface), var(--surface-2)); border:1.5px solid var(--gold); border-radius:20px;
    padding:18px; display:inline-block; min-width:200px;}
  .room-code-display b{font-size:38px; color:var(--gold); letter-spacing:8px;}

  /* ============================= GAMES HUB — GLASS TILES ============================= */
  .gh-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:6px;}
  .gh-grid > .gh-tile:last-child:nth-child(odd){grid-column:1 / -1; width:calc(50% - 7px); justify-self:center;}
  .gh-tile{position:relative; aspect-ratio:1/1; border-radius:26px; overflow:hidden; isolation:isolate; color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px; text-align:center;
    font-family:inherit;
    background:linear-gradient(145deg, rgba(255,255,255,.17), rgba(255,255,255,.04));
    -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,.17);
    box-shadow:0 14px 32px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(255,255,255,.05);
    transition:transform .18s ease, box-shadow .25s ease, border-color .25s ease;
    animation:ghPop .5s cubic-bezier(.2,.9,.3,1) backwards; animation-delay:calc(var(--i,0) * 55ms);}
  .gh-tile::before{content:""; position:absolute; width:78%; height:78%; top:-26%; right:-22%; border-radius:50%;
    background:var(--g); opacity:.55; filter:blur(34px); z-index:-1; transition:opacity .25s ease;}
  .gh-tile::after{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; border-radius:inherit;
    background:linear-gradient(125deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,0) 38%);}
  button.gh-tile{cursor:pointer;}
  button.gh-tile:active{transform:scale(.95);}
  button.gh-tile:hover::before{opacity:.75;}
  @keyframes ghPop{from{opacity:0; transform:translateY(14px) scale(.94);}to{opacity:1; transform:none;}}
  .gh-ico{width:60px; height:60px; min-width:60px; border-radius:20px; display:flex; align-items:center; justify-content:center;
    font-size:30px; background:var(--g); box-shadow:0 10px 22px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.45);}
  .gh-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; line-height:1.3;}
  .gh-sub{font-size:11.5px; line-height:1.45; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  /* friend tile: front face -> reveals join / create inside the same square */
  .gh-face{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px;
    transition:opacity .3s ease, transform .3s ease; color:inherit; font-family:inherit; text-align:center; background:none; border:0;}
  .gh-front{cursor:pointer;}
  .gh-back{opacity:0; transform:scale(.9); pointer-events:none; gap:9px;}
  .gh-tile.is-open .gh-front{opacity:0; transform:scale(1.08); pointer-events:none;}
  .gh-tile.is-open .gh-back{opacity:1; transform:none; pointer-events:auto;}
  .gh-back-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px; color:var(--text); opacity:.85; margin-top:2px;}
  .gh-panel{width:100%; display:flex; flex-direction:column; gap:9px; align-items:stretch;}
  .gh-panel-join{display:none;}
  .gh-tile.is-join .gh-panel-menu{display:none;}
  .gh-tile.is-join .gh-panel-join{display:flex;}
  .gh-act{width:100%; padding:11px 8px; border-radius:15px; font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; color:var(--text);
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.20); box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; transition:transform .15s ease, background .2s ease;}
  .gh-act:active{transform:scale(.95);}
  .gh-act-primary{background:linear-gradient(135deg, var(--gold-2), var(--gold)); color:#1a1633; border-color:transparent;
    box-shadow:0 8px 18px rgba(244,183,64,.30);}

  /* ============================= CHEF RATING ============================= */

  html[data-theme="light"] .chef-star{color:rgba(30,24,10,.16);}
  html[data-theme="light"] .chef-star.on{color:#F0A500; text-shadow:0 0 8px rgba(240,165,0,.45);}
  html[data-theme="light"] .dish-score{background:rgba(30,24,10,.07); color:#9A6A00; border-color:rgba(30,24,10,.10);}
  html[data-theme="light"] .chef-count{background:rgba(30,24,10,.05); border-color:rgba(30,24,10,.10);}
  html[data-theme="light"] .chef-hero{background:linear-gradient(145deg, rgba(255,255,255,.9), rgba(255,255,255,.5)); border-color:rgba(30,24,10,.10); box-shadow:0 12px 28px rgba(30,24,10,.12);}

  /* admin */
  .sp-picker{display:flex; gap:2px; margin:6px 0 2px;}

  .ds-title{font-family:'Cairo',sans-serif; font-weight:900; font-size:18px; line-height:1.3; word-break:break-word;}

  .ds-fstars{position:relative; display:inline-block; font-size:15px; letter-spacing:1px; line-height:1; margin-top:6px; direction:ltr;}

  .ds-count{font-size:11.5px; color:var(--text-muted); margin-top:5px;}
  .ds-dist{flex:1; display:flex; flex-direction:column; gap:4px; min-width:0;}
  .ds-drow{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-muted); direction:ltr;}
  .ds-drow .lab{width:16px; text-align:right; font-weight:800;}
  .ds-drow .bar{flex:1; height:7px; border-radius:7px; background:rgba(255,255,255,.10); overflow:hidden;}
  .ds-drow .bar i{display:block; height:100%; width:0; border-radius:7px; background:linear-gradient(90deg,#FFC93C,#FF9A3C); animation:dsBar .9s cubic-bezier(.2,.9,.3,1) forwards; animation-delay:.25s;}
  @keyframes dsBar{to{width:var(--w);}}
  .ds-drow .num{width:20px; font-weight:700;}
  .ds-official{display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:5px 11px; border-radius:20px; font-size:11.5px; font-weight:700;
    background:rgba(255,201,60,.12); border:1px solid rgba(255,201,60,.30); color:#FFE08A;}
  .ds-rate-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; margin-bottom:2px;}
  .ds-rate-hint{font-size:11.5px; color:var(--text-muted);}
  .ds-stars{display:flex; justify-content:center; gap:2px; margin:12px 0 4px; direction:rtl;}
  .ds-star{background:none; border:0; padding:2px 3px; font-size:clamp(28px, 9vw, 38px); line-height:1; color:rgba(255,255,255,.20); cursor:pointer; transition:transform .15s ease, color .15s ease;}
  .ds-star.on{color:#FFC93C; text-shadow:0 0 14px rgba(255,201,60,.6);}
  .ds-star.pop{animation:dsStarPop .38s cubic-bezier(.2,.9,.3,1.4);}
  @keyframes dsStarPop{0%{transform:scale(.6);}60%{transform:scale(1.35);}100%{transform:scale(1);}}
  .ds-star-label{text-align:center; min-height:22px; font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; color:#FFE08A;}
  .ds-star-label.pop{animation:dsFade .3s ease;}
  .ds-text{width:100%; box-sizing:border-box; margin-top:10px; padding:11px 13px; border-radius:16px; min-height:64px; resize:none; font-family:inherit; font-size:14px; line-height:1.6;

  .ds-text:focus{border-color:var(--gold);}
  .ds-text::placeholder{color:var(--text-muted); opacity:.7;}
  .ds-counter{font-size:10.5px; color:var(--text-muted); text-align:left; margin-top:3px; direction:ltr;}

  .ds-rev-name{font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px;}
  .ds-mine-badge{font-size:10px; font-weight:800; padding:1px 8px; border-radius:20px; background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:#1a1633;}

  html[data-theme="light"] .ds-star, html[data-theme="light"] .ds-fstars .bg, html[data-theme="light"] .ds-rev-stars .off{color:rgba(30,24,10,.16);}

/* Renders a QR code at a resolution matched to the current page zoom + device pixel
   ratio, then locks its visual box back to the intended CSS size — keeps codes crisp
   instead of being blurrily stretched when the auto-scale zoom is active on tablets. */
function createQR(el, opts){
  const target = typeof el === 'string' ? document.getElementById(el) : el;
  if(!target) return null;
  const displayW = opts.width, displayH = opts.height;
  const z = (parseFloat(document.documentElement.style.zoom) || 1) * (window.devicePixelRatio || 1);
  const hiOpts = Object.assign({}, opts, {
    width: Math.round(displayW * z),
    height: Math.round(displayH * z)
  });
  const qr = new QRCode(target, hiOpts);
  const media = target.querySelector('img') || target.querySelector('canvas');
  if(media){
    media.style.width = displayW + 'px';
    media.style.height = displayH + 'px';
  }
  return qr;
}

/* ---- gallery albums (admin-managed slots, each holding multiple photos) ---- */
const GALLERY_DEFAULT_COUNT = 7;
const GALLERY_PHOTO_CACHE = {};
function emptyGalleryAlbums(n){ return Array.from({length:n||GALLERY_DEFAULT_COUNT}, ()=>({title:'', photoIds:[]})); }
async function loadGalleryAlbums(){
  try{
    const r = await window.storage.get('glavera-gallery-albums', true);
    if(!r || !r.value) return emptyGalleryAlbums();
    const raw = JSON.parse(r.value);
    if(!Array.isArray(raw) || !raw.length) return emptyGalleryAlbums();
    return raw.map(a=>({ title: (a && a.title) || '', photoIds: (a && Array.isArray(a.photoIds)) ? a.photoIds : [] }));
  }catch(e){ console.error('loadGalleryAlbums failed:', e); return emptyGalleryAlbums(); }
}
async function saveGalleryAlbums(arr){
  try{ await window.storage.set('glavera-gallery-albums', JSON.stringify(arr), true); return true; }
  catch(e){ console.error('saveGalleryAlbums failed:', e); return false; }
}
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }
/* بمحاولات إعادة، عشان لو حصل ضغط مؤقت على التخزين (rate limit) مايفشلش نهائي */
async function saveGalleryAlbumsWithRetry(arr, attempt){
  attempt = attempt || 1;
  const ok = await saveGalleryAlbums(arr);
  if(ok) return true;
  if(attempt < 3){ await sleep(800*attempt); return saveGalleryAlbumsWithRetry(arr, attempt+1); }
  return false;
}
async function saveGalleryPhoto(photoId, dataUrl, attempt){
  attempt = attempt || 1;
  try{
    const r = await window.storage.set('glavera-gallery-photo-'+photoId, dataUrl, true, 45000); // مهلة أطول (45 ثانية) لأن الصور أكبر بكتير من باقي البيانات، خصوصًا على نت ضعيف
    if(!r) throw new Error(_fbLastError||'save failed');
    return true;
  }catch(e){
    console.error('saveGalleryPhoto failed (attempt '+attempt+'):', e);
    if(attempt < 3){ await sleep(900*attempt); return saveGalleryPhoto(photoId, dataUrl, attempt+1); }
    return false;
  }
}
async function deleteGalleryPhoto(photoId){
  try{ await window.storage.delete('glavera-gallery-photo-'+photoId, true); }catch(e){}

async function preloadGalleryPhotos(albums){

}

/* ---------- conference countdown / progress widget ---------- */
function confCountdownCalc(){
  if(!CONF_SETTINGS || !CONF_SETTINGS.startAt || !CONF_SETTINGS.endAt) return null;
  const start = new Date(CONF_SETTINGS.startAt).getTime();
  const end = new Date(CONF_SETTINGS.endAt).getTime();
  if(isNaN(start) || isNaN(end) || end<=start) return null;
  const now = Date.now();
  let phase, targetTime, pct;
  if(now < start){
    phase = 'before'; targetTime = start; pct = 0;
  } else if(now >= end){
    phase = 'after'; targetTime = end; pct = 100;
  } else {
    phase = 'during'; targetTime = end;
    pct = Math.round(((now-start)/(end-start))*1000)/10;
  }
  let diff = Math.max(0, targetTime-now);
  const days = Math.floor(diff/86400000); diff -= days*86400000;
  const hours = Math.floor(diff/3600000); diff -= hours*3600000;
  const mins = Math.floor(diff/60000); diff -= mins*60000;
  const secs = Math.floor(diff/1000);
  return {phase, pct, days, hours, mins, secs};
}
const CONF_CD_RADIUS = 68;
const CONF_CD_CIRC = 2*Math.PI*CONF_CD_RADIUS;
const DAY_TOTAL_RADIUS = 58;
const DAY_TOTAL_CIRC = 2*Math.PI*DAY_TOTAL_RADIUS;
function confCdPhaseLabel(phase){
  return phase==='before' ? tr('cd_before') : (phase==='during' ? tr('cd_during') : tr('cd_after'));
}
function confCountdownHtml(){
  const c = confCountdownCalc();
  if(!c) return '';
  const offset = CONF_CD_CIRC * (1 - c.pct/100);
  return `<div class="conf-cd-card" id="conf-count-widget">
    <div class="conf-cd-ring-wrap">
      <svg class="conf-cd-ring" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="confCdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--teal)"/>
            <stop offset="100%" stop-color="var(--gold)"/>
          </linearGradient>
        </defs>
        <circle class="conf-cd-ring-track" cx="80" cy="80" r="${CONF_CD_RADIUS}"></circle>
        <circle class="conf-cd-ring-fill" id="conf-cd-ring-fill" cx="80" cy="80" r="${CONF_CD_RADIUS}"
          style="stroke-dasharray:${CONF_CD_CIRC};stroke-dashoffset:${offset};"></circle>
      </svg>
      <div class="conf-cd-ring-center">
        <div class="conf-cd-pct" id="conf-cd-pct">${c.phase==='before'?'0%':(c.phase==='after'?'100%':c.pct+'%')}</div>
        <div class="conf-cd-pct-lab">${c.phase==='during'?tr('cd_during_sub'):(c.phase==='before'?tr('cd_before_sub'):tr('cd_after_sub'))}</div>
      </div>
    </div>
    <div class="conf-cd-phase" id="conf-cd-phase">${confCdPhaseLabel(c.phase)}</div>
    ${c.phase==='after' ? '' : `
    <div class="conf-cd-units" id="conf-cd-units">
      <div class="conf-cd-unit-glass"><span class="conf-cd-val" id="conf-cd-days">${String(c.days)}</span><span class="conf-cd-lab">${tr('cd_days')}</span></div>
      <div class="conf-cd-unit-glass"><span class="conf-cd-val" id="conf-cd-hours">${String(c.hours).padStart(2,'0')}</span><span class="conf-cd-lab">${tr('cd_hours')}</span></div>
      <div class="conf-cd-unit-glass"><span class="conf-cd-val" id="conf-cd-mins">${String(c.mins).padStart(2,'0')}</span><span class="conf-cd-lab">${tr('cd_mins')}</span></div>
      <div class="conf-cd-unit-glass"><span class="conf-cd-val" id="conf-cd-secs">${String(c.secs).padStart(2,'0')}</span><span class="conf-cd-lab">${tr('cd_secs')}</span></div>
    </div>`}
  </div>`;
}
function tickConfCountdown(){
  const widget = document.getElementById('conf-count-widget');
  if(!widget) return;
  const c = confCountdownCalc();
  if(!c) return;
  const phaseEl = document.getElementById('conf-cd-phase');
  const ringEl = document.getElementById('conf-cd-ring-fill');
  const pctEl = document.getElementById('conf-cd-pct');
  const dEl = document.getElementById('conf-cd-days');
  const hEl = document.getElementById('conf-cd-hours');
  const mEl = document.getElementById('conf-cd-mins');
  const sEl = document.getElementById('conf-cd-secs');
  if(phaseEl) phaseEl.textContent = confCdPhaseLabel(c.phase);
  if(ringEl) ringEl.style.strokeDashoffset = String(CONF_CD_CIRC * (1 - c.pct/100));
  if(pctEl) pctEl.textContent = (c.phase==='before'?'0%':(c.phase==='after'?'100%':c.pct+'%'));
  if(c.phase==='after'){
    const unitsEl = document.getElementById('conf-cd-units');
    if(unitsEl) unitsEl.remove();
    return;
  }
  if(dEl) dEl.textContent = String(c.days);
  if(hEl) hEl.textContent = String(c.hours).padStart(2,'0');
  if(mEl) mEl.textContent = String(c.mins).padStart(2,'0');
  if(sEl) sEl.textContent = String(c.secs).padStart(2,'0');
}
async function shareConfCountdown(){
  const widget = document.getElementById('conf-count-widget');
  const btn = document.getElementById('conf-cd-share-btn');
  if(!widget) return;
  if(typeof html2canvas==='undefined'){ showToast('تعذّر تجهيز الصورة، جرّب تاني', true); return; }
  if(btn) btn.style.visibility = 'hidden';
  try{
    const canvas = await html2canvas(widget, {
      backgroundColor: getComputedStyle(document.body).getPropertyValue('--bg') || '#0E0D2B',
      scale: 2, useCORS: true
    });
    if(btn) btn.style.visibility = '';
    canvas.toBlob(async (blob)=>{
      if(!blob){ showToast('تعذّر تجهيز الصورة', true); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'glavera3-countdown.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      showToast('اتحمّلت الصورة');
    }, 'image/png');
  }catch(e){
    if(btn) btn.style.visibility = '';
    showToast('حصل خطأ في تجهيز الصورة', true);
  }
}
function checkConfTimeAlerts(){
  if(!state.pid || !CONF_SETTINGS || !CONF_SETTINGS.startAt || !CONF_SETTINGS.endAt) return;
  const start = new Date(CONF_SETTINGS.startAt).getTime();
  const end = new Date(CONF_SETTINGS.endAt).getTime();
  if(isNaN(start) || isNaN(end)) return;
  const now = Date.now();
  const extra = myExtra(state.pid);
  if(!extra.confAlertsSent) extra.confAlertsSent = {};
  let changed = false;
  if(now >= start-3600000 && now < start && !extra.confAlertsSent.beforeStart){
    pushNotification(state.pid, 'باقي ساعة على بداية المؤتمر — يلا نستعد! 🎉', '⏰');
    notifyNative('جلافيرا 3', 'باقي ساعة على بداية المؤتمر');
    extra.confAlertsSent.beforeStart = true; changed = true;
  }
  if(now >= end-3600000 && now < end && !extra.confAlertsSent.beforeEnd){
    pushNotification(state.pid, 'باقي ساعة على ختام المؤتمر — متفوتش آخر الفقرات 💫', '⏰');
    notifyNative('جلافيرا 3', 'باقي ساعة على ختام المؤتمر');
    extra.confAlertsSent.beforeEnd = true; changed = true;
  }
  if(changed) saveProfileExtra(PROFILE_EXTRA);
}
function exportParticipantsXlsx(){
  if(typeof XLSX==='undefined'){ showToast('تعذّر تجهيز ملف Excel', true); return; }

  const rows = PARTICIPANTS.map(p=>{
    const team = teamOf(p.teamId);
    const attended = flatSessions().filter(f=>CHECKINS[p.id+'__'+f.session.id]).length;
    return {
      'الكود': p.id,
      'الاسم': p.name,
      'الفريق': team ? team.name : '',
      'النقاط': participantTotal(p.id),
      'عدد الفقرات المحضورة': attended,
      'إجمالي الفقرات': totalSessions,
      'نسبة الحضور %': totalSessions ? Math.round((attended/totalSessions)*1000)/10 : 0
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:24},{wch:16},{wch:10},{wch:20},{wch:14},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'المشاركين');
  XLSX.writeFile(wb, `glavera3-participants-${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('اتحمّل تقرير الإكسل');
}

function currentLang(){
  return (state.pid && PROFILE_EXTRA[state.pid] && PROFILE_EXTRA[state.pid].lang) || 'ar';
}
function tr(key){
  const lang = currentLang();
  return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || (TRANSLATIONS.ar[key]) || key;
}
function trFmt(key, vals){
  let s = tr(key);
  Object.keys(vals||{}).forEach(k=>{ s = s.replace('{'+k+'}', vals[k]); });
  return s;
}
async function doToggleLang(){
  const extra = myExtra(state.pid);
  extra.lang = (extra.lang==='en') ? 'ar' : 'en';
  document.documentElement.lang = extra.lang==='en' ? 'en' : 'ar';
  await saveProfileExtra(PROFILE_EXTRA);
  render();
}
async function doToggleSessionReminders(){
  const extra = myExtra(state.pid);
  extra.reminders = !extra.reminders;
  if(extra.reminders && typeof Notification !== 'undefined' && Notification.permission==='default'){
    try{ await Notification.requestPermission(); }catch(e){}
  }
  await saveProfileExtra(PROFILE_EXTRA);
  showToast(extra.reminders ? '🔔 هيتم تذكيرك بمواعيد الفقرات لما الموقع يبقى مفتوح' : 'تم إيقاف تذكير الفقرات');
  render();
}
let _remindedSessionIds = new Set();
function checkSessionReminders(){
  if(!state.pid) return;
  const extra = myExtra(state.pid);
  if(!extra.reminders) return;
  const nowMin = nowMinutes();
  DAYS.forEach(day=>{
    if(day.locked) return; // بنذكّر بس بفقرات اليوم المفتوح حاليًا
    day.sessions.forEach(s=>{
      if(_remindedSessionIds.has(s.id)) return;
      const info = SESSION_INFO[s.id] || {};
      const startMin = parseArabicTime(info.timeFrom);
      if(startMin===null) return;
      const diff = startMin - nowMin;
      if(diff>0 && diff<=15){
        _remindedSessionIds.add(s.id);
        const label = info.name || s.name;
        showToast(`⏰ فقرة "${label}" هتبدأ بعد ${diff} دقيقة`);
        if(typeof Notification !== 'undefined' && Notification.permission==='granted'){
          try{ new Notification('جلافيرا 3', { body:`فقرة "${label}" هتبدأ بعد ${diff} دقيقة`, icon:'icon-192.png' }); }catch(e){}
        }
      }
    });
  });
}
if(typeof window !== 'undefined'){ setInterval(checkSessionReminders, 60000); }

/* ============================= DAILY QUESTS ============================= */
function currentJourneyDay(pid){
  const idx = DAYS.findIndex(d=>dayTotal(pid,d)===0);
  return idx>=0 ? DAYS[idx] : DAYS[DAYS.length-1];
}
function dayQuests(pid, day){
  const extra = myExtra(pid);
  const claimed = extra.questsClaimed || {};
  const doneCount = day.sessions.filter(s=>sessionPoints(pid,s.id)>0).length;
  const dayPts = dayTotal(pid, day);
  const defs = [
    { key:'attend1', icon:'✅', label:'سجّل حضورك في فقرة واحدة اليوم', progress:Math.min(1,doneCount), goal:1, reward:5 },
    { key:'attendAll', icon:'🎯', label:`اكمل كل فقرات ${day.label} (${day.sessions.length} فقرات)`, progress:Math.min(doneCount, day.sessions.length), goal:day.sessions.length, reward:15 },
    { key:'points20', icon:'⚡', label:'اجمع 20 نقطة من فقرات اليوم', progress:Math.min(20,dayPts), goal:20, reward:10 },
  ];
  return defs.map(q=>{
    const claimKey = day.id+'_'+q.key;
    return {...q, claimKey, done:q.progress>=q.goal, claimed:!!claimed[claimKey]};
  });
}

function pushNotification(pid, text, icon){
  const extra = myExtra(pid);
  if(!extra.notifs) extra.notifs = [];
  extra.notifs.unshift({ id:'n'+Date.now()+Math.random().toString(36).slice(2,6), text, icon:icon||'✨', ts:Date.now(), read:false });
  if(extra.notifs.length>40) extra.notifs.length = 40;
  saveProfileExtra(PROFILE_EXTRA);
}
function unreadNotifCount(pid){
  const extra = myExtra(pid);
  return (extra.notifs||[]).filter(n=>!n.read).length;
}
function timeAgoAr(ts){
  const diff = Math.max(0, Date.now()-ts);
  const mins = Math.floor(diff/60000);
  if(mins<1) return 'الآن';
  if(mins<60) return `منذ ${mins} دقيقة`;
  const hrs = Math.floor(mins/60);
  if(hrs<24) return `منذ ${hrs} ساعة`;
  return `منذ ${Math.floor(hrs/24)} يوم`;
}

function initials(name){
  const parts = name.trim().split(' ');
  return (parts[0]?.[0]||'') + (parts[1]?.[0]||'');
}
function teamOf(teamId){ return TEAMS.find(t=>t.id===teamId); }

  if(h<12) return 'صباح الخير';
  if(h<18) return 'نهارك سعيد';
  return 'مساء الخير';

function sessionPoints(pid, sid){ return CHECKINS[pid+'__'+sid]?.points || 0; }
function participantTotal(pid){
  let sum=0;
  DAYS.forEach(d=>d.sessions.forEach(s=>{ sum += sessionPoints(pid,s.id); }));
  return Math.max(0, sum + (BONUS[pid]||0));
}
function dayTotal(pid, day){
  return day.sessions.reduce((sum,s)=>sum+sessionPoints(pid,s.id),0);
}
function rankedParticipants(){
  return PARTICIPANTS.map(p=>({...p, total:participantTotal(p.id)}))
    .sort((a,b)=>b.total-a.total);
}
function rankedTeams(){
  return TEAMS.map(t=>{
    const members = PARTICIPANTS.filter(p=>p.teamId===t.id);
    const total = members.reduce((s,p)=>s+participantTotal(p.id),0) + (TEAM_BONUS[t.id]||0);
    return {...t, total, count:members.length};
  }).sort((a,b)=>b.total-a.total);
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function avatarHtml(p, extraStyle){
  if(p.photo){
    return `<div class="avatar" style="background-image:url('${p.photo}');background-size:cover;background-position:center;${extraStyle||''}"></div>`;
  }
  return null;
}
function normalizeDigits(str){
  if(str===null || str===undefined) return str;
  const eastern = '٠١٢٣٤٥٦٧٨٩';
  const persian = '۰۱۲۳۴۵۶۷۸۹';
  return String(str).replace(/[٠-٩۰-۹]/g, ch=>{
    let idx = eastern.indexOf(ch);
    if(idx===-1) idx = persian.indexOf(ch);
    return idx===-1 ? ch : String(idx);
  });
}
function migrateParticipantId(p, oldId, newId){
  const newChk = {};
  Object.keys(CHECKINS).forEach(k=>{
    if(k.startsWith(oldId+'__')) newChk[newId+'__'+k.slice(oldId.length+2)] = CHECKINS[k];
    else newChk[k] = CHECKINS[k];
  });
  CHECKINS = newChk;
  if(PROFILE_EXTRA[oldId]){ PROFILE_EXTRA[newId] = PROFILE_EXTRA[oldId]; delete PROFILE_EXTRA[oldId]; }
  if(BONUS[oldId]!==undefined){ BONUS[newId] = BONUS[oldId]; delete BONUS[oldId]; }
  p.id = newId;
  saveCheckins(CHECKINS); saveProfileExtra(PROFILE_EXTRA); saveBonus(BONUS);
}
function findSessionById(sid){
  for(const d of DAYS){ const s = d.sessions.find(x=>x.id===sid); if(s) return {day:d, session:s}; }
  return null;
}
function parseArabicTime(str){
  if(!str) return null;
  const m = String(str).trim().match(/(\d{1,2}):(\d{2})\s*(ص|م|am|pm|AM|PM)?/);
  if(!m) return null;
  let h = parseInt(m[1],10), mnt = parseInt(m[2],10);
  const mer = (m[3]||'').toLowerCase();
  if(mer==='م' || mer==='pm'){ if(h<12) h+=12; }
  else if(mer==='ص' || mer==='am'){ if(h===12) h=0; }
  if(isNaN(h)||isNaN(mnt)) return null;
  return h*60+mnt;
}
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function flatSessions(){
  const out=[]; DAYS.forEach(d=>d.sessions.forEach(s=>out.push({day:d, session:s}))); return out;
}
function medalTier(total){ if(total>=100) return 3; if(total>=50) return 2; return 1; }
function computeStreak(pid){
  const flat = flatSessions();
  let cur=0;
  for(let i=flat.length-1;i>=0;i--){ if(CHECKINS[pid+'__'+flat[i].session.id]) cur++; else break; }
  let max=0, run=0;
  flat.forEach(f=>{ if(CHECKINS[pid+'__'+f.session.id]){ run++; max=Math.max(max,run); } else run=0; });
  return { current: cur, max };
}
function computeBadges(pid){
  const badges = [];
  const myKeys = Object.keys(CHECKINS).filter(k=>k.startsWith(pid+'__'));
  if(myKeys.length>0) badges.push({icon:'🥇', label:'أول تسجيل حضور'});
  DAYS.forEach(d=>{
    if(d.sessions.length>0 && d.sessions.every(s=>CHECKINS[pid+'__'+s.id])) badges.push({icon:'📅', label:'حضور كامل — '+d.label});
  });
  DAYS.forEach(d=>d.sessions.forEach(s=>{
    const regs = Object.entries(CHECKINS).filter(([k])=>k.endsWith('__'+s.id))
      .map(([k,v])=>({pid:k.split('__')[0], ts:v.ts})).sort((a,b)=>a.ts-b.ts).slice(0,5);
    if(regs.some(r=>r.pid===pid)) badges.push({icon:'⚡', label:'من أول 5: '+s.name});
  }));
  const streak = computeStreak(pid);
  if(streak.max>=5) badges.push({icon:'🔥', label:'متتالية 5 فقرات'});
  return badges;
}
function computeSecretBadges(pid){
  const secrets = [];
  DAYS.forEach(d=>d.sessions.forEach(s=>{
    const c = CHECKINS[pid+'__'+s.id];
    const info = SESSION_INFO[s.id];
    if(!c || !info || !info.timeFrom) return;
    const startMin = parseArabicTime(info.timeFrom);
    if(startMin==null) return;
    const checkinDate = new Date(c.ts);
    const checkinMin = checkinDate.getHours()*60+checkinDate.getMinutes()+checkinDate.getSeconds()/60;
    if(checkinMin >= startMin && checkinMin <= startMin+1){
      secrets.push({icon:'🕵️', label:'دقيقة الذهب — سجّلت في أول 60 ثانية من: '+s.name});
    }
  }));
  return secrets;
}
function computeTitle(pid){
  const tally={};
  DAYS.forEach(d=>d.sessions.forEach(s=>{ if(CHECKINS[pid+'__'+s.id]) tally[s.type]=(tally[s.type]||0)+1; }));
  const entries=Object.entries(tally);
  if(!entries.length || entries.reduce((s,[,c])=>s+c,0) < 2) return null;
  entries.sort((a,b)=>b[1]-a[1]);
  const map = {opening:'نجم الافتتاح', lecture:'محب المعرفة', workshop:'بطل الورش', activity:'بطل الأنشطة', closing:'روح الختام'};
  return map[entries[0][0]] || null;
}
function recommendationMessage(pid){
  const tally={};
  DAYS.forEach(d=>d.sessions.forEach(s=>{ if(CHECKINS[pid+'__'+s.id]) tally[s.type]=(tally[s.type]||0)+1; }));
  const entries=Object.entries(tally);
  if(!entries.length) return null;
  entries.sort((a,b)=>b[1]-a[1]);
  if(entries[0][1] < 2) return null;
  const type = entries[0][0];
  const label = SESSION_TYPE_LABELS[type];
  let next=null;
  DAYS.forEach(d=>d.sessions.forEach(s=>{ if(!next && s.type===type && !CHECKINS[pid+'__'+s.id]) next=s; }));
  return next ? `بتميل لـ${label} أكتر — الفقرة الجاية "${next.name}" هتعجبك` : `بتميل لـ${label} أكتر — استمتعت بمعظم رحلتك بهذا النوع 👏`;
}
const TYPE_COLORS = { opening:'#F4B740', lecture:'#3FDCC9', workshop:'#FF7A59', activity:'#9B8CFF', closing:'#5FE0A4' };
function findLiveSessionForDay(day){
  const nm = nowMinutes();
  for(const s of day.sessions){
    const info = SESSION_INFO[s.id]||{};
    const from = parseArabicTime(info.timeFrom), to = parseArabicTime(info.timeTo);
    if(from!=null && to!=null && nm>=from && nm<=to) return s;
  }
  return null;
}
function autoDetectLiveSession(){
  const nm = nowMinutes();
  for(const d of DAYS){
    const s = findLiveSessionForDay(d);
    if(s) return s;
  }
  return null;
}
function checkinsForSession(sid){
  return Object.keys(CHECKINS).filter(k=>k.endsWith('__'+sid)).length;
}

async function doToggleReminder(el, sid){
  if(!state.pid) return;
  const extra = myExtra(state.pid);
  extra.remindersOff = extra.remindersOff || {};
  extra.remindersOff[sid] = !extra.remindersOff[sid];
  await saveProfileExtra(PROFILE_EXTRA);
  const on = !extra.remindersOff[sid];
  el.textContent = on ? '🔔' : '🔕';
  el.classList.toggle('on', on);
  el.title = on ? 'نبّهني قبل الفقرة بـ 10 دقائق' : 'التذكير متوقف لهذه الفقرة';
  showToast(on ? 'هننبهك قبل الفقرة بـ 10 دقايق 🔔' : 'اتوقف التذكير لهذه الفقرة');
}

function myRatingFor(pid, sid){ return (myExtra(pid).sessionRatings||{})[sid] || 0; }
async function doRateSession(sid, star){
  if(!state.pid) return;
  const extra = myExtra(state.pid);
  extra.sessionRatings = extra.sessionRatings || {};
  extra.sessionRatings[sid] = star;
  await saveProfileExtra(PROFILE_EXTRA);
  vibrate(12);
  SND.cheer();
  render();
}
function avgRatingOverall(){
  let sum=0, n=0;
  Object.values(PROFILE_EXTRA).forEach(ex=>{
    Object.values(ex.sessionRatings||{}).forEach(v=>{ sum+=v; n++; });
  });
  return n ? (sum/n) : 0;
}

}

/* ============================= RENDER: SPLASH ============================= */
function renderSplash(){
  return `
    <div class="splash-scene ${state.splashLeaving?'leave':''}">
      <div class="splash-ring-wrap">
        <div class="splash-ring"></div>
        <div class="splash-ring-inner"></div>
        <div class="splash-logo ${CONF_SETTINGS.logo?'has-custom-logo':''}">${confLogoHtml()}</div>
      </div>
      <div class="splash-title">جلافيرا 3</div>
      <div class="splash-sub">بوابة المشاركين</div>
      <div class="splash-lamp-wrap">
        <div class="splash-lamp-shade"></div>
        <div class="splash-lamp-stem"></div>
        <div class="splash-cord-swing" id="lamp-swing">
          <div class="splash-cord-hit" id="lamp-cord">

/* ============================= RENDER: LOGIN ============================= */
function renderLogin(){
  const boxes = [0,1,2,3].map(i=>`<span class="otp-circle-wrap"><input type="tel" class="otp-box otp-circle" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-idx="${i}" style="animation-delay:${i*80}ms" ${i===0?'autofocus':''} /><span class="otp-digit-visual" data-idx="${i}"></span></span>`).join('');
  return `
    <div class="login-page">
      <div class="login-hero">
        <div class="logo-wrap ${CONF_SETTINGS.logo?'has-custom-logo':''}" id="login-logo-gesture">${confLogoHtml()}</div>
        <div class="brand-title">جلافيرا 3</div>
        <div class="tag">بوابة المشاركين — سجّل حضورك وتابع نقاطك</div>
      </div>
      <div class="card otp-card" style="margin-top:18px;">
        <div class="otp-lock">🔐</div>
        <div class="otp-title">كود الدخول الخاص بك</div>
        <div class="otp-sub">أدخل الكود المكوّن من 4 أرقام</div>
        <div class="otp-boxes-row">
          <div class="otp-boxes" id="otp-boxes" dir="ltr">${boxes}</div>
          <button type="button" class="otp-scan-btn" data-action="open-scan" data-mode="login" title="امسح بطاقتك الرقمية">${ICO.cam}</button>
        </div>
        <div class="otp-progress-track"><div class="otp-progress-fill" id="otp-progress-fill"></div></div>
        <input type="hidden" id="login-code-input" />
        <button type="button" class="btn btn-primary" id="otp-submit-btn" data-action="submit-login" style="margin-top:20px;">دخول</button>
      </div>
      <div class="designer-credit">صُمم بواسطة <span class="designer-credit-name">Te epistoly</span></div>
    </div>
  `;
}

/* ============================= RENDER: WELCOME ============================= */
function renderWelcome(){
  const p = PARTICIPANTS.find(x=>x.id===state.pid);
  const team = p ? teamOf(p.teamId) : null;
  const photoStyle = p && p.photo
    ? `background-image:url('${p.photo}');background-size:cover;background-position:center;`
    : `background:linear-gradient(150deg, ${team?team.color:'#F4B740'}, ${team?team.color:'#F4B740'}88);`;
  const points = p ? participantTotal(p.id) : 0;
  const rankList = rankedParticipants();
  const rankIdx = p ? rankList.findIndex(x=>x.id===p.id) : -1;
  const rank = rankIdx>=0 ? rankIdx+1 : null;
  let teamRank = null;
  if(team){
    const teamRankList = rankedTeams();
    const teamRankIdx = teamRankList.findIndex(t=>t.id===team.id);
    teamRank = teamRankIdx>=0 ? teamRankIdx+1 : null;
  }
  return `
    <div class="welcome-scene">
      <div class="welcome-glow"></div>
      <div class="welcome-greeting">${timeGreeting()}${p?', '+escapeHtml(p.name.split(' ')[0]):''}</div>
      <div class="welcome-crest ${CONF_SETTINGS.logo?'has-custom-logo':''}">${confLogoHtml()}</div>
      <div class="welcome-en-pre">WELCOME TO</div>
      <div class="welcome-en-title">Glafera</div>
      <div class="welcome-rule"><span></span><i>III</i><span></span></div>
      <div class="welcome-photo-frame"${team?` style="--wp-accent:${team.color}"`:''}>
        <div class="welcome-photo-frame-ring"></div>
        <div class="welcome-photo" style="${photoStyle}">${p&&!p.photo?`<span class="welcome-photo-fallback">${initials(p.name)}</span>`:''}</div>
      </div>
      <div class="welcome-name-wrap">
        <div class="welcome-name">${p?escapeHtml(p.name):''}</div>
      </div>
      <div class="welcome-login-msg"><span class="wlm-tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span><span class="wlm-text">تم تسجيل دخولك</span></div>
      <div class="welcome-loader"><svg class="welcome-loader-ring" viewBox="0 0 32 32"><circle class="wlr-track" cx="16" cy="16" r="13"/><circle class="wlr-fill" cx="16" cy="16" r="13"/></svg><span class="welcome-loader-cap">جارٍ تجهيز حسابك...</span></div>
    </div>
  `;
}

/* ============================= LIVE WALL ============================= */
function buildLiveWallHTML(){
  const entries = Object.entries(CHECKINS).map(([k,v])=>{
    const [pid, sid] = k.split('__');
    const p = PARTICIPANTS.find(x=>x.id===pid);
    return { name: p?p.name:pid, ts:v.ts };
  }).sort((a,b)=>b.ts-a.ts).slice(0,8);
  if(!entries.length) return `<div class="hint">لسه محدش سجل حضوره</div>`;

function renderRadialMenu(){
  const items = radialMenuItemsList();
  const n = items.length;
  const radius = 122;
  const itemsHtml = items.map((it,i)=>{
    const angle = (360/n)*i - 90;
    const rad = angle*Math.PI/180;
    const dx = Math.round(Math.cos(rad)*radius);
    const dy = Math.round(Math.sin(rad)*radius);
    const delay = (i*0.032).toFixed(3);
    const attrs = `data-action="radial-tap" data-page="${it.page||''}" ${it.logout?'data-logout="1"':''}`;
    const nameCls = dy < -10 ? 'below' : '';
    const label = tr(it.labelKey);
    return `<button type="button" class="radial-item" style="--dx:${dx}px;--dy:${dy}px;--delay:${delay}s;background:${it.color}" ${attrs} aria-label="${escapeHtml(label)}">
      <span class="radial-name ${nameCls}">${escapeHtml(label)}</span>
      <span class="ri-ico">${it.icon}</span>
    </button>`;
  }).join('');
  return `
    <div class="radial-backdrop" data-action="toggle-radial-menu"></div>
    <div class="radial-ring" id="radial-ring">${itemsHtml}</div>
  `;
}
function radialItemTap(el, page, isLogout){
  document.querySelectorAll('.radial-item.show-tip').forEach(d=>d.classList.remove('show-tip'));
  document.querySelectorAll('.radial-item.show-name').forEach(d=>d.classList.remove('show-name'));
  el.classList.add('show-tip');
  el.classList.add('show-name');
  SND.nav();
  setTimeout(()=>{
    state.radialMenuOpen = false;
    if(isLogout){ stopAmbient(); state = FRESH_STATE(); render(); }
    else { go(page); }
  }, 550);
}
let radialPressTimer = null;
let radialPressedEl = null;
let radialLongPressed = false;
let suppressNextRadialClick = false;
function radialPressStart(e){
  const el = e.target.closest('.radial-item');
  if(!el) return;
  radialPressedEl = el;
  radialLongPressed = false;
  clearTimeout(radialPressTimer);
  radialPressTimer = setTimeout(()=>{
    radialLongPressed = true;
    document.querySelectorAll('.radial-item.show-name').forEach(d=>d.classList.remove('show-name'));
    el.classList.add('show-name');
    vibrate(10);
  }, 420);
}
function radialPressEnd(){
  clearTimeout(radialPressTimer);
  if(radialLongPressed && radialPressedEl){
    const el = radialPressedEl;
    suppressNextRadialClick = true;
    setTimeout(()=>{ el.classList.remove('show-name'); }, 900);
  }
  radialPressedEl = null;
}
document.addEventListener('pointerdown', radialPressStart, {passive:true});
document.addEventListener('pointerup', radialPressEnd, {passive:true});
document.addEventListener('pointercancel', radialPressEnd, {passive:true});
document.addEventListener('pointerleave', radialPressEnd, {passive:true});

/* الخانات السبعة وصورها بقت بيتحكم فيها الأدمن بالكامل من "لوحة المنظمين ← معرض الصور" — مفيش تعديل كود مطلوب. */
let galleryIndex = 0;
let galleryAutoTimer = null;

function galleryCardCount(){ return GALLERY_ALBUMS.length; }
function galleryAlbumAt(i){ return (GALLERY_ALBUMS && GALLERY_ALBUMS[i]) || {title:'', photoIds:[]}; }
function galleryAlbumCover(i){

function renderGalleryPage(){
  if(!GALLERY_ALBUMS.length){
    return `
      <div class="back-row">

    `;
  }
  if(galleryIndex >= GALLERY_ALBUMS.length) galleryIndex = 0;
  return `
