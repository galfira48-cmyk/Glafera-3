    background:rgba(255,255,255,.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  html[data-palette="cyber"]{
    --bg:#08060F; --bg-2:#0F0B1D; --surface:#160F2B; --surface-2:#1D1438; --border:rgba(255,255,255,.10);
    --gold:#B026FF; --gold-2:#D66BFF; --teal:#22D3EE; --coral:#FF2ED1; --violet:#7C3AED;
    --text:#F3EAFE; --text-muted:#B79CDD; --danger:#FF6B6B; --good:#22D3EE;
  }
  html[data-palette="royalpurple"]{
    --bg:#0F0A1A; --bg-2:#171025; --surface:#1F1732; --surface-2:#28203F; --border:rgba(255,255,255,.08);
    --gold:#7B4FE0; --gold-2:#9F7CEE; --teal:#C6C6D6; --coral:#9560D9; --violet:#6A3FCB;
    --text:#F1EDFB; --text-muted:#A99BC7; --danger:#FF6B6B; --good:#4CD787;
  }
  html[data-palette="sandgold"]{
    --bg:#F1E6D2; --bg-2:#EADDC4; --surface:#FBF5EA; --surface-2:#F3EAD8; --border:rgba(60,40,10,.10);
    --gold:#B08D57; --gold-2:#C6A575; --teal:#B08D57; --coral:#B08D57; --violet:#B08D57;
    --text:#2E2312; --text-muted:#8A7550; --danger:#B0432E; --good:#4C8C5C;
  }
  html[data-palette="midnightblue"]{
    --bg:#050C1A; --bg-2:#0A1428; --surface:#101E38; --surface-2:#152848; --border:rgba(255,255,255,.08);
    --gold:#3FA9D9; --gold-2:#6FC4E8; --teal:#3FA9D9; --coral:#3FA9D9; --violet:#3FA9D9;
    --text:#EAF4FA; --text-muted:#7FA3BE; --danger:#FF6B6B; --good:#4CD787;
  }
  html[data-palette="graphite"]{
    --bg:#121314; --bg-2:#1A1B1D; --surface:#222325; --surface-2:#2A2B2E; --border:rgba(255,255,255,.08);
    --gold:#9CA1A8; --gold-2:#C4C8CE; --teal:#9CA1A8; --coral:#9CA1A8; --violet:#9CA1A8;
    --text:#F2F3F4; --text-muted:#8E9298; --danger:#FF6B6B; --good:#4CD787;
  }
  html[data-palette="forestelite"]{
    --bg:#0A140D; --bg-2:#0F1E13; --surface:#15291A; --surface-2:#1B3421; --border:rgba(255,255,255,.08);
    --gold:#C9A227; --gold-2:#E0BE55; --teal:#3E8E5C; --coral:#4CA36B; --violet:#5C8E6E;
    --text:#EAF5EC; --text-muted:#8FBF9E; --danger:#FF6B6B; --good:#3E8E5C;
  }
  html[data-palette="champagne"]{
    --bg:#F7EFE1; --bg-2:#F0E5D0; --surface:#FBF7EE; --surface-2:#F5EEDD; --border:rgba(60,40,10,.08);
    --gold:#C9A96E; --gold-2:#DDBF8E; --teal:#C9A96E; --coral:#C9A96E; --violet:#C9A96E;
    --text:#3B2E1E; --text-muted:#8A7355; --danger:#B0432E; --good:#4C8C5C;
  }

  .theme-pal-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .theme-pal-btn{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:8px 4px 7px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer;}
  .theme-pal-btn.active{border-color:var(--gold); box-shadow:0 0 0 2px rgba(244,183,64,.25);}
  .theme-pal-swatch{width:34px; height:34px; border-radius:50%; border:2px solid rgba(255,255,255,.25); box-shadow:0 3px 8px rgba(0,0,0,.2);}
  .theme-pal-label{font-family:'Tajawal',sans-serif; font-weight:700; font-size:10.5px; color:var(--text-muted); text-align:center; line-height:1.2;}
  .theme-pal-btn.active .theme-pal-label{ color:var(--text); }
  .theme-pal-check{position:absolute; top:-5px; left:-5px; width:18px; height:18px; border-radius:50%; background:var(--gold);
    color:#171449; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.3);}

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  :focus-visible{outline:2.5px solid var(--gold); outline-offset:2px; border-radius:10px;}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2.5px solid var(--gold); outline-offset:2px;
  }
  html,body{margin:0;padding:0;}
  html{transition:background-color .45s ease;}
  body{
    background:
      radial-gradient(circle at 18% 8%, rgba(244,183,64,.10), transparent 40%),
      radial-gradient(circle at 85% 18%, rgba(63,220,201,.10), transparent 42%),
      linear-gradient(180deg,#0E0D2B 0%, #171449 45%, #0E0D2B 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    transition:background .45s ease, color .35s ease;
  }
  .card,.top-bar,.field,.icon-btn,.chip,.btn,.pill,.nav-tile,.dock-icon{transition:background-color .35s ease, border-color .35s ease, color .35s ease, box-shadow .35s ease;}
  /* ---------- day/night toggle ---------- */
  .theme-toggle-btn{position:relative; overflow:hidden;}
  .theme-toggle-btn .tt-ico{display:inline-block; transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;}
  .display{font-family:'Cairo',sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; padding:0 16px 40px; position:relative;}
  a,button,input{font-family:inherit;}
  button{cursor:pointer; border:none; background:none; color:inherit;}
  input{color:inherit;}

  /* ---------- header / brand ---------- */
  .brand-row{display:flex; align-items:center; gap:12px; padding:22px 2px 10px;}
  .logo-wrap{width:52px; height:52px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,var(--gold),var(--coral)); box-shadow:0 6px 20px rgba(244,183,64,.35); overflow:hidden;}
  .logo-wrap svg{width:28px; height:28px;}
  .logo-wrap.has-custom-logo, .splash-logo.has-custom-logo, .welcome-crest.has-custom-logo{background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.04) inset;}
  .conf-logo-img{width:100%; height:100%; object-fit:contain; padding:3%; box-sizing:border-box; display:block; border-radius:inherit;
    animation:confLogoPop .45s cubic-bezier(.34,1.56,.64,1);}
  @keyframes confLogoPop{from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);}}
  .brand-title{font-family:'Cairo',sans-serif; font-weight:900; font-size:26px; letter-spacing:.5px;
    background:linear-gradient(95deg,var(--gold-2),var(--teal) 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.1;}
  .brand-sub{color:var(--text-muted); font-size:12.5px; margin-top:2px;}
  .top-bar{display:flex; align-items:center; justify-content:space-between;}
  .icon-btn{width:38px; height:38px; border-radius:12px; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-muted);}
  .back-row{display:flex; align-items:center; gap:10px; padding:18px 0 8px;}
  .back-row .icon-btn{transform:scaleX(-1);}
  .back-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:19px;}

  /* ---------- card ---------- */
  .card{background:linear-gradient(180deg, var(--surface), var(--surface-2)); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  .card-sm{border-radius:var(--radius-sm); padding:14px;}

  /* ---------- splash (entry gate) ---------- */
  .splash-scene{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:82vh; text-align:center;}
  .splash-scene.leave{opacity:0; transition:opacity .25s ease;}
  .wipe-overlay{position:fixed; inset:0; z-index:95; pointer-events:none; will-change:clip-path;
    background:radial-gradient(circle, var(--gold-2) 0%, var(--gold) 55%, #8a611f 100%);}
  .splash-ring-wrap{position:relative; width:132px; height:132px; display:flex; align-items:center; justify-content:center; margin-bottom:26px;}
  .splash-ring{position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0%, var(--gold) 18%, transparent 36%, transparent 64%, var(--gold-2) 82%, transparent 100%);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation:ringSpin 5s linear infinite; opacity:.8;}
  @keyframes ringSpin{to{transform:rotate(360deg);}}
  .splash-ring-inner{position:absolute; inset:14px; border-radius:50%; border:1px solid var(--border);}
  .splash-logo{position:relative; width:112px; height:112px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,var(--gold),var(--coral)); box-shadow:0 10px 30px rgba(244,183,64,.4); overflow:hidden;}
  .splash-logo svg{width:36px; height:36px;}
  .splash-title{font-family:'Cairo',sans-serif; font-weight:900; font-size:40px; letter-spacing:.5px; line-height:1.1;
    background:linear-gradient(100deg, var(--gold) 15%, #fff 42%, var(--gold-2) 55%, var(--gold) 85%);
    background-size:220% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 3.2s linear infinite;}
  .splash-sub{color:var(--text-muted); font-size:13.5px; margin-top:10px; letter-spacing:.3px;}

  /* ---------- conference verse (شعار المؤتمر) ---------- */
  .verse-float{position:relative; text-align:center; padding:8px 20px 22px; margin-bottom:2px;
    animation:verseDrift 5s ease-in-out infinite;}
  @keyframes verseDrift{0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);}}
  .verse-mark{font-family:'Cormorant Garamond',serif; font-size:34px; line-height:.5; color:var(--gold); opacity:.6; display:block; margin-bottom:6px;}
  .verse-text{font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:19px; line-height:1.65;
    background:linear-gradient(95deg, var(--gold-2), var(--text) 40%, var(--text) 60%, var(--gold-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .verse-ref{margin-top:10px; font-family:'Cairo',sans-serif; font-weight:800; font-size:11px; letter-spacing:.5px; color:var(--text-muted);}
  .verse-ref::before, .verse-ref::after{content:'—'; margin:0 6px; opacity:.5;}

  /* ---------- day total points glass ring card ---------- */
  .day-total-ring-card{position:relative; display:flex; flex-direction:column; align-items:center;
    padding:18px 16px 16px; margin-bottom:16px; border-radius:24px; overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 14px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.14);}
  html[data-theme="light"] .day-total-ring-card{background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,.22));
    border:1px solid rgba(30,24,10,.10); box-shadow:0 12px 26px rgba(120,100,50,.14), inset 0 1px 0 rgba(255,255,255,.5);}
  .day-total-ring-card::before{content:''; position:absolute; top:-40%; left:-15%; width:65%; height:140%;
    background:radial-gradient(circle, rgba(244,183,64,.16), transparent 65%); pointer-events:none;}
  .day-total-ring-wrap{position:relative; width:110px; height:110px; margin-bottom:8px;}
  .day-total-ring-svg{width:110px; height:110px; transform:rotate(-90deg);}
  .day-total-ring-track{fill:none; stroke:rgba(255,255,255,.12); stroke-width:9;}
  html[data-theme="light"] .day-total-ring-track{stroke:rgba(30,24,10,.08);}
  .day-total-ring-fill{fill:none; stroke:var(--gold); stroke-width:9; stroke-linecap:round;}
  .day-total-ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,255,255,.05); backdrop-filter:blur(6px); margin:10px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);}
  html[data-theme="light"] .day-total-ring-center{background:rgba(255,255,255,.35);}
  .day-total-icon{font-size:16px; margin-bottom:1px; animation:dayTotalIconPulse 2.6s ease-in-out infinite;}
  @keyframes dayTotalIconPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.12);}}
  .day-total-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:22px; line-height:1.1;
    color:var(--gold); font-variant-numeric:tabular-nums;}
  .day-total-unit{font-family:'Cairo',sans-serif; font-weight:700; font-size:9.5px; color:var(--text-muted); margin-top:1px;}
  .day-total-cap{position:relative; z-index:1; font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px; color:var(--gold);}

  /* ---------- conference countdown widget (glass circular) ---------- */
  .conf-cd-card{position:relative; background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.16); border-radius:22px; padding:14px 12px 12px; margin:0 0 14px; text-align:center;
    box-shadow:0 12px 28px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.14); overflow:hidden;}
  html[data-theme="light"] .conf-cd-card{background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,.22));
    border:1px solid rgba(30,24,10,.10); box-shadow:0 12px 24px rgba(120,100,50,.14), inset 0 1px 0 rgba(255,255,255,.5);}
  .conf-cd-card::before{content:''; position:absolute; top:-40%; left:-20%; width:70%; height:140%;
    background:radial-gradient(circle, rgba(244,183,64,.14), transparent 65%); pointer-events:none;}
  .conf-cd-ring-wrap{position:relative; width:96px; height:96px; margin:0 auto 8px;}
  .conf-cd-ring{width:96px; height:96px; transform:rotate(-90deg);}
  .conf-cd-ring-track{fill:none; stroke:rgba(255,255,255,.12); stroke-width:8;}
  html[data-theme="light"] .conf-cd-ring-track{stroke:rgba(30,24,10,.08);}
  .conf-cd-ring-fill{fill:none; stroke:url(#confCdGrad); stroke-width:8; stroke-linecap:round;
    transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1); filter:drop-shadow(0 0 5px rgba(244,183,64,.45));}
  .conf-cd-ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,255,255,.05); backdrop-filter:blur(6px); margin:9px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);}
  html[data-theme="light"] .conf-cd-ring-center{background:rgba(255,255,255,.35);}
  .conf-cd-pct{font-family:'Cairo',sans-serif; font-weight:900; font-size:17px; color:var(--text); font-variant-numeric:tabular-nums;
    background:linear-gradient(95deg, var(--teal), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .conf-cd-pct-lab{font-family:'Cairo',sans-serif; font-weight:700; font-size:8px; color:var(--text-muted); margin-top:1px;}
  .conf-cd-phase{font-family:'Cairo',sans-serif; font-weight:800; font-size:11.5px; color:var(--gold); margin-bottom:9px; position:relative;}
  .conf-cd-units{display:flex; justify-content:center; gap:7px; position:relative;}
  .conf-cd-unit-glass{display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.07); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.16); box-shadow:0 5px 12px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.12);}
  html[data-theme="light"] .conf-cd-unit-glass{background:rgba(255,255,255,.5); border:1px solid rgba(30,24,10,.08);
    box-shadow:0 5px 10px rgba(120,100,50,.12), inset 0 1px 0 rgba(255,255,255,.6);}
  .conf-cd-val{font-family:'Cairo',sans-serif; font-weight:900; font-size:12px; color:var(--text); font-variant-numeric:tabular-nums; line-height:1.1;}
  .conf-cd-lab{font-family:'Cairo',sans-serif; font-weight:600; font-size:7px; color:var(--text-muted); margin-top:1px;}
  .conf-cd-share-btn{margin-top:11px; font-family:'Cairo',sans-serif; font-weight:700; font-size:11px; color:var(--text);
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:6px 16px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;}
  html[data-theme="light"] .conf-cd-share-btn{background:rgba(255,255,255,.55); border:1px solid rgba(30,24,10,.1);}
  .conf-cd-share-btn:active{transform:scale(.96);}

  /* ---------- splash lamp trigger (drag to pull) ---------- */
  .splash-lamp-wrap{position:relative; margin-top:38px; display:flex; flex-direction:column; align-items:center;}
  .splash-lamp-shade{width:66px; height:38px; border-radius:38px 38px 5px 5px/38px 38px 5px 5px;
    background:#3B3870; border:1px solid var(--border); transition:background .3s ease, box-shadow .3s ease;}
  .splash-lamp-stem{width:5px; height:22px; background:linear-gradient(180deg,#8b87ab,#54507c); margin-top:-1px;}
  .splash-cord-swing{transform-origin:top center; animation:splashSwing 2.6s ease-in-out infinite;}
  .splash-cord-hit{position:relative; width:40px; height:64px; margin-top:-2px; display:flex; justify-content:center;
    cursor:grab; touch-action:none;}
  .splash-cord-hit.dragging{cursor:grabbing;}
  .splash-cord-line{width:2px; height:98px; transform-origin:top center; transform:scaleY(0.367347); background:rgba(255,255,255,.35); transition:transform .28s cubic-bezier(.34,1.56,.64,1); will-change:transform;}
  .splash-cord-hit.dragging .splash-cord-line{transition:none;}
  .splash-bead{width:13px; height:13px; border-radius:50%; background:var(--gold); position:absolute; top:36px;
    box-shadow:0 0 9px rgba(244,183,64,.55); transition:transform .28s cubic-bezier(.34,1.56,.64,1);}
  .splash-cord-hit.dragging .splash-bead{transition:none;}
  @keyframes splashSwing{0%,100%{transform:rotate(0deg);} 50%{transform:rotate(4deg);}}
  .splash-lamp-hint{margin-top:12px; font-size:11.5px; color:var(--text-muted); opacity:.8;}

  /* ---------- login page ---------- */
  .login-page{animation:pageIn .5s ease;}
  @keyframes pageIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .login-hero{text-align:center; padding:18px 6px 8px;}
  .login-hero .logo-wrap{margin:0 auto 14px; width:100px; height:100px; border-radius:50%; position:relative;}
  .login-hero .logo-wrap svg{width:40px; height:40px;}
  .login-hero .logo-wrap.admin-gesture-charging{ animation:adminGesturePulse 1.4s ease forwards; }
  .login-hero .logo-wrap.admin-gesture-charging::after{ content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--gold-2); opacity:0; animation:adminGestureRing 1.4s ease forwards; }
  @keyframes adminGesturePulse{ 0%{transform:scale(1);} 100%{transform:scale(.9);} }
  @keyframes adminGestureRing{ 0%{opacity:0; transform:scale(.85);} 30%{opacity:.9;} 100%{opacity:1; transform:scale(1.08);} }
  .login-hero .brand-title{font-size:34px;}
  .login-hero .tag{color:var(--text-muted); font-size:14px; margin-top:6px;}
  .field{width:100%; background:var(--bg-2); border:1.5px solid var(--border); border-radius:16px; padding:15px 16px;
    color:var(--text); font-size:16px; text-align:center; letter-spacing:1px; outline:none;}
  .field:focus{border-color:var(--teal);}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px; border-radius:16px;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:16px;}
  .btn-primary{background:linear-gradient(95deg,var(--gold),var(--gold-2)); color:#221900; box-shadow:0 8px 20px rgba(244,183,64,.28);}
  .btn-outline{background:transparent; border:1.5px solid var(--teal); color:var(--teal);}
  .btn-ghost{background:var(--surface); border:1px solid var(--border); color:var(--text);}
  .btn:disabled{opacity:.5;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px;}

  /* ============================= OTP EMBOSSED CODE INPUT ============================= */
  .otp-card{ text-align:center; padding:26px 20px; }
  .otp-divider{ display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--text-muted); font-size:11.5px; }
  .otp-divider::before, .otp-divider::after{ content:''; flex:1; height:1px; background:var(--border); }
  .otp-lock{ width:60px; height:60px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
    font-size:24px; background:linear-gradient(160deg, var(--surface), var(--surface-2));
    box-shadow:6px 6px 14px rgba(0,0,0,.45), -4px -4px 12px rgba(255,255,255,.035); animation:otpLockFloat 2.6s ease-in-out infinite;
    position:relative; transition:transform .4s cubic-bezier(.34,1.56,.64,1); }
  .otp-lock.unlocked{ animation:none; transform:rotate(-8deg) scale(1.12); box-shadow:6px 6px 14px rgba(0,0,0,.45), 0 0 22px rgba(244,183,64,.55); }
  @keyframes otpLockFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
  .otp-title{ font-family:'Cairo',sans-serif; font-weight:800; font-size:16px; margin-bottom:4px; }
  .otp-sub{ font-size:12px; color:var(--text-muted); margin-bottom:20px; }

  @keyframes titleUnderline{ from{ width:0; opacity:0;} to{ width:30px; opacity:1;} }
  .section-title .sub{font-size:12px; font-weight:500; color:var(--text-muted);}

  /* ---------- days journey ---------- */
  .journey{position:relative; padding:6px 4px 2px; overflow-x:auto;}
  .journey-track{display:flex; justify-content:space-between; position:relative; min-width:340px; padding:0 6px;}
  .journey-track::before{content:''; position:absolute; top:23px; right:22px; left:22px; height:2px; background:var(--border); z-index:0;}
  .journey-fill{position:absolute; top:23px; right:22px; height:2px; background:linear-gradient(90deg,var(--gold-2),var(--gold)); z-index:0; width:0%; transition:width 1s ease;}
  .day-node{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; width:64px;}
  .day-circle{position:relative; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:16px; border:2px solid var(--border); background:var(--bg-2); color:var(--text-muted);}
  .day-circle.done{background:linear-gradient(145deg,var(--gold),var(--coral)); border-color:transparent; color:#1a1633; box-shadow:0 6px 16px rgba(244,183,64,.3);}
  .day-circle.day-locked{background:var(--bg-2); border-color:rgba(214,71,58,.4); color:var(--danger); opacity:.75;}
  .day-node-lock-badge{position:absolute; bottom:-3px; inset-inline-end:-3px; width:19px; height:19px; border-radius:50%; background:var(--danger);
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35), 0 0 0 2px var(--bg);}
  .day-node-lock-badge svg{width:10px; height:10px; color:#fff;}
  .day-current-dot{position:absolute; top:-3px; inset-inline-end:-2px; width:11px; height:11px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 0 rgba(244,183,64,.6); animation:pulseDot 1.7s ease-out infinite;}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(244,183,64,.55);} 70%{box-shadow:0 0 0 9px rgba(244,183,64,0);} 100%{box-shadow:0 0 0 0 rgba(244,183,64,0);}}
  .day-lab{font-size:11px; color:var(--text-muted); text-align:center;}
  .day-pts{font-family:'Cairo',sans-serif; font-size:11.5px; color:var(--gold); font-weight:800;}

  /* ---------- session / day list ---------- */
  .list-row{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .lr-left{display:flex; align-items:center; gap:12px;}
  .lr-num{width:34px; height:34px; border-radius:11px; background:var(--bg-2); display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; color:var(--text-muted); flex:0 0 auto;}
  .lr-title{font-weight:700; font-size:14.5px;}
  .lr-sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .lr-badge{font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; padding:6px 11px; border-radius:999px;}
  .reminder-bell{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px;
    background:var(--bg-2); border:1px solid var(--border); opacity:.55; transition:all .25s cubic-bezier(.34,1.56,.64,1); }
  .reminder-bell.on{ opacity:1; background:rgba(244,183,64,.14); border-color:rgba(244,183,64,.4); animation:bellIdle 2.6s ease-in-out infinite; }
  .reminder-bell:active{ transform:scale(.82); }
  @keyframes bellIdle{ 0%,85%,100%{ transform:rotate(0);} 88%{ transform:rotate(-10deg);} 91%{ transform:rotate(8deg);} 94%{ transform:rotate(0);} }
  .lr-badge.pending{background:var(--bg-2); color:var(--text-muted); border:1px solid var(--border);}
  .lr-badge.done{background:rgba(95,224,164,.15); color:var(--good);}
  .lr-badge.locked{background:rgba(214,71,58,.14); color:var(--danger); border:1px solid rgba(214,71,58,.35); display:inline-flex; align-items:center; gap:5px;}
  .lr-badge.locked svg{width:12px; height:12px;}
  .list-row.is-locked{opacity:.6;}
  .list-row.is-locked .lr-num{background:rgba(214,71,58,.12); color:var(--danger);}
  .chevron{color:var(--text-muted); margin-inline-start:6px;}

  /* ---------- session glass squares (فقرات اليوم) ---------- */
  .day-sessions-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; align-items:stretch; }
  .session-glass{ position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:8px;
    min-height:152px; padding:14px 14px 13px; border-radius:20px; cursor:pointer; overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02) 65%);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 10px 28px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .2s cubic-bezier(.22,.9,.28,1), box-shadow .2s ease, border-color .2s ease; }
  .session-glass::before{ content:''; position:absolute; inset:0 0 auto 0; height:3px;
    background:linear-gradient(90deg, rgba(244,183,64,.7), rgba(255,222,148,.35)); opacity:.65; }
  .session-glass:active{ transform:scale(.97); }
  .session-glass .sg-shine{ position:absolute; top:-60%; left:-25%; width:65%; height:220%;
    background:linear-gradient(120deg, rgba(255,255,255,.20), transparent 65%); transform:rotate(-14deg); pointer-events:none; }
  .session-glass.is-done{ border-color:rgba(95,224,164,.38); box-shadow:0 10px 28px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 1px rgba(95,224,164,.10); }
  .session-glass.is-done::before{ background:linear-gradient(90deg, var(--good), rgba(95,224,164,.35)); opacity:.9; }
  .session-glass.is-locked{ opacity:.6; }
  .session-glass.is-locked::before{ background:linear-gradient(90deg, var(--danger), rgba(255,107,107,.3)); opacity:.55; }
  .sg-top-row{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .sg-num-title{ display:flex; align-items:center; gap:9px; min-width:0; flex:1 1 auto; }
  .sg-num{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px; color:var(--gold-2);
    background:radial-gradient(circle at 32% 28%, rgba(244,183,64,.38), rgba(244,183,64,.07) 72%);
    border:1.5px solid rgba(244,183,64,.5);
    box-shadow:0 0 0 3px rgba(244,183,64,.10), inset 0 1px 1px rgba(255,255,255,.25); }
  .session-glass.is-done .sg-num{ color:#171449; background:linear-gradient(160deg, var(--gold-2), var(--gold));
    border-color:var(--gold-2); box-shadow:0 0 0 3px rgba(95,224,164,.16), inset 0 1px 1px rgba(255,255,255,.45); }
  .session-glass.is-locked .sg-num{ color:var(--danger); background:rgba(214,71,58,.12);
    border-color:rgba(214,71,58,.4); box-shadow:0 0 0 3px rgba(214,71,58,.08); }
  .session-glass .reminder-bell{ width:26px; height:26px; font-size:12px; flex:0 0 auto; }
  .session-glass .type-badge{ font-size:9px; padding:3px 9px; background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.12); }
  .sg-title{ font-weight:800; font-size:13px; line-height:1.3; color:var(--text); min-width:0; letter-spacing:.1px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sg-sub{ font-size:9.5px; line-height:1.4; color:var(--text-muted);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .session-glass .lr-badge{ margin-top:auto; align-self:flex-start; font-size:10.5px; padding:4px 10px; font-weight:800; }
  html[data-theme="light"] .session-glass{
    background:linear-gradient(150deg, rgba(255,255,255,.55), rgba(255,255,255,.22) 60%);
    border-color:rgba(30,24,10,.10); box-shadow:0 10px 26px rgba(120,100,60,.16), inset 0 1px 0 rgba(255,255,255,.6); }
  html[data-theme="light"] .sg-num{ box-shadow:0 0 0 3px rgba(198,135,31,.10), inset 0 1px 1px rgba(255,255,255,.5); }
  html[data-theme="light"] .session-glass.is-done .sg-num{ color:#fff; }

  /* ---------- id card glass (صورة + الاسم/الكود/الفريق) ---------- */
  .id-card-glass{ position:relative; display:flex; align-items:center; gap:16px; margin:4px 0 18px; padding:18px;
    border-radius:24px; overflow:hidden;
    background:linear-gradient(150deg, rgba(255,255,255,.10), rgba(255,255,255,.025) 60%);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 10px 30px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.18); }
  .id-card-glass::before{ content:''; position:absolute; top:-60%; left:-25%; width:65%; height:220%;
    background:linear-gradient(120deg, rgba(255,255,255,.20), transparent 65%); transform:rotate(-14deg); pointer-events:none; }
  .id-photo{ position:relative; z-index:1; width:108px; height:108px; border-radius:21px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; }
  .id-photo-fallback{ font-family:'Cairo',sans-serif; font-weight:800; font-size:30px; color:#fff; }
  .id-info{ position:relative; z-index:1; flex:1; display:flex; flex-direction:column; gap:13px; min-width:0;
    direction:ltr; align-items:flex-start; text-align:left; }
  .id-row{ display:flex; align-items:baseline; gap:9px; }
  .id-label{ font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:17px; letter-spacing:.2px;
    color:var(--gold-2); flex:0 0 auto; }
  .id-label::after{ content:':'; margin-inline-start:1px; opacity:.75; }
  .id-value{ font-family:'Cairo',sans-serif; font-weight:900; font-size:19px; letter-spacing:-.1px; color:var(--text); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .id-value-name{ font-family:var(--name-font-family,'Tajawal'),sans-serif; font-weight:700; font-size:var(--name-font-size,15px); letter-spacing:0; }
  html[data-theme="light"] .id-card-glass{
    background:linear-gradient(150deg, rgba(255,255,255,.55), rgba(255,255,255,.22) 60%);
    border-color:rgba(30,24,10,.10); box-shadow:0 10px 26px rgba(120,100,60,.16), inset 0 1px 0 rgba(255,255,255,.6); }

  /* ---------- participant: closed session panel ---------- */
  .closed-panel{display:flex; flex-direction:column; align-items:center; text-align:center; padding:22px 10px 8px;}
  .closed-panel-icon{width:58px; height:58px; border-radius:50%; background:rgba(214,71,58,.12); border:1.5px solid rgba(214,71,58,.35);
    display:flex; align-items:center; justify-content:center; color:var(--danger); margin-bottom:14px;}
  .closed-panel-icon svg{width:24px; height:24px;}
  .closed-panel-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; color:var(--danger);}
  .closed-panel-sub{font-size:12.5px; color:var(--text-muted); margin-top:6px; line-height:1.7; max-width:260px;}
  .day-locked-banner{display:flex; align-items:center; gap:10px; background:rgba(214,71,58,.12); border:1px solid rgba(214,71,58,.35);
    border-radius:14px; padding:12px 14px; margin-bottom:14px; color:var(--danger); font-size:12.5px; line-height:1.7;}
  .day-locked-banner svg{width:18px; height:18px; flex:0 0 auto;}

  /* ---------- team roster ---------- */
  .roster-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  /* ============================= TEAM MESSAGES ============================= */
  .team-msg-list{ display:flex; flex-direction:column; gap:10px; }
  .team-msg{ background:linear-gradient(160deg,var(--surface),var(--surface-2)); border:1px solid var(--border); border-radius:16px;
    padding:12px 14px; animation:fadeInUp .35s ease; }
  .team-msg.mine{ border-color:rgba(244,183,64,.4); background:linear-gradient(160deg, rgba(244,183,64,.08), var(--surface-2)); }
  .team-msg-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .team-msg-name{ font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px; color:var(--gold-2); }
  .team-msg-time{ font-size:10px; color:var(--text-muted); }
  .team-msg-text{ font-size:13px; line-height:1.6; color:var(--text); }
  .team-msg-love{ margin-top:8px; display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--text-muted);
    background:var(--bg-2); border:1px solid var(--border); border-radius:999px; padding:4px 11px; transition:all .25s cubic-bezier(.34,1.56,.64,1); }
  .team-msg-love.on{ color:#fff; background:linear-gradient(95deg,var(--coral),#ff9a7d); border-color:transparent; animation:loveBeat .5s ease; }
  .team-msg-love:active{ transform:scale(.88); }
  @keyframes loveBeat{ 0%{ transform:scale(1);} 30%{ transform:scale(1.3);} 55%{ transform:scale(.92);} 100%{ transform:scale(1);} }
  .member-card{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:7px;
    padding:18px 10px; aspect-ratio:1; justify-content:center; overflow:hidden; border-radius:22px;
    background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.015)) !important;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.14) !important;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12); }
  .member-card::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(135deg, rgba(244,183,64,.4), transparent 42%, transparent 58%, rgba(244,183,64,.18));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; }
  .member-card::after{ content:''; position:absolute; top:-40%; left:-40%; width:60%; height:200%;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.10) 45%, transparent 70%);
    transform:rotate(20deg); pointer-events:none; }
  .member-card.me{ border-color:rgba(244,183,64,.55) !important; box-shadow:0 12px 30px -12px rgba(0,0,0,.55), inset 0 0 0 1px rgba(244,183,64,.5), inset 0 1px 0 rgba(255,255,255,.12), 0 0 22px rgba(244,183,64,.25); }
  .member-card .avatar{width:48px; height:48px; font-size:16px; position:relative; z-index:1; box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .member-card .mname{font-size:12.5px; font-weight:700; position:relative; z-index:1;}
  .member-card .mpts{font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; color:var(--gold); position:relative; z-index:1;}
  .member-card .cheer-btn{ position:relative; z-index:1; }

  /* ---------- session detail ---------- */
  .session-value{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .session-value .v{font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; color:var(--gold);}
  .checkin-status{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:20px 6px;}
  .checkin-status .big-check{width:64px; height:64px; border-radius:50%; background:rgba(95,224,164,.15); display:flex; align-items:center; justify-content:center;
    animation:checkPop .5s cubic-bezier(.34,1.56,.64,1) both, checkRing 1.6s ease-out .5s infinite; }
  .checkin-status .big-check svg{ animation:checkDraw .5s ease-out both; }
  @keyframes checkPop{ 0%{ transform:scale(0) rotate(-30deg); opacity:0;} 60%{ transform:scale(1.18) rotate(6deg); opacity:1;} 100%{ transform:scale(1) rotate(0);} }
  @keyframes checkRing{ 0%{ box-shadow:0 0 0 0 rgba(95,224,164,.5);} 100%{ box-shadow:0 0 0 14px rgba(95,224,164,0);} }
  @keyframes checkDraw{ 0%{ stroke-dasharray:40; stroke-dashoffset:40; opacity:0;} 30%{ opacity:1;} 100%{ stroke-dashoffset:0; opacity:1;} }
  .checkin-status .earned{font-family:'Cairo',sans-serif; font-weight:900; font-size:26px; color:var(--good); animation:earnedPop .5s cubic-bezier(.34,1.56,.64,1) .35s both;}
  @keyframes earnedPop{ 0%{ transform:translateY(10px) scale(.7); opacity:0;} 100%{ transform:translateY(0) scale(1); opacity:1;} }
  .checkin-status .total-note{font-size:12px; color:var(--text-muted);}
  .scan-row{display:flex; gap:10px;}
  .divider-or{display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:12px; margin:14px 0;}
  .divider-or::before,.divider-or::after{content:''; flex:1; height:1px; background:var(--border);}
  .manual-row{display:flex; gap:8px;}
  .manual-row .field{text-align:center; padding:13px;}
  .toast{position:fixed; bottom:28px; left:50%; transform:translate(-50%,0) scale(1);
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-family:'Tajawal',sans-serif; font-weight:600; font-size:14px; line-height:1.4;
    padding:12px 18px 13px 14px; border-radius:16px; z-index:60; overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.16);
    animation:toastIn .45s cubic-bezier(.34,1.56,.64,1); display:flex; align-items:center; gap:10px; max-width:86vw;}
  .toast.leaving{animation:toastOut .3s cubic-bezier(.4,0,1,1) forwards;}
  .toast .toast-ico{position:relative; flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--good);
    display:flex; align-items:center; justify-content:center;}
  .toast .toast-ico::after{content:''; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--good);
    animation:toastRing 1.7s ease-out infinite;}
  .toast .toast-ico svg{width:12px; height:12px; position:relative; z-index:1;}
  .toast .toast-txt{position:relative; z-index:1;}
  .toast .toast-progress{position:absolute; left:0; right:0; bottom:0; height:2.5px; background:rgba(128,128,128,.18);}
  .toast .toast-progress i{display:block; height:100%; width:100%; background:var(--good);
    animation:toastShrink 2.2s linear forwards; transform-origin:right;}
  .toast.err .toast-ico{background:var(--danger);}
  .toast.err .toast-ico::after{border-color:var(--danger);}
  .toast.err .toast-progress i{background:var(--danger);}
  .toast.locked{background:var(--surface); border:1px solid var(--border); color:var(--text);
    box-shadow:0 10px 26px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.16); position:relative; overflow:hidden;}
  .toast.locked .toast-lock-ico{position:relative; flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--danger);
    display:flex; align-items:center; justify-content:center;}
  .toast.locked .toast-lock-ico::after{content:''; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--danger);
    animation:toastRing 1.7s ease-out infinite;}
  .toast.locked .toast-lock-ico svg{width:11px; height:11px; position:relative; z-index:1;}
  .toast.locked .toast-txt{font-size:13.5px; line-height:1.5; position:relative; z-index:1;}
  .toast.locked .toast-progress i{background:var(--danger); animation-duration:2.4s;}
  @keyframes toastRing{0%{transform:scale(.75); opacity:.55;} 100%{transform:scale(1.7); opacity:0;}}
  @keyframes toastShrink{from{transform:scaleX(1);} to{transform:scaleX(0);}}
  @keyframes toastOut{0%{opacity:1; transform:translate(-50%,0) scale(1);} 100%{opacity:0; transform:translate(-50%,14px) scale(.92);}}
  @keyframes toastIn{0%{opacity:0; transform:translate(-50%,26px) scale(.85);} 60%{opacity:1; transform:translate(-50%,-4px) scale(1.04);} 100%{opacity:1; transform:translate(-50%,0) scale(1);}}
  @keyframes shakeLocked{0%,100%{transform:translateX(0);} 15%{transform:translateX(-7px) rotate(-1deg);} 30%{transform:translateX(6px) rotate(1deg);} 45%{transform:translateX(-5px);} 60%{transform:translateX(4px);} 75%{transform:translateX(-2px);} 90%{transform:translateX(1px);}}
  .shake-locked{animation:shakeLocked .5s cubic-bezier(.36,.07,.19,.97) both;}

  /* ---------- leaderboard ---------- */
  .lb-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:26px; text-align:center; font-family:'Cairo',sans-serif; font-weight:800; color:var(--text-muted); flex:0 0 auto;}
  .lb-rank.top1{color:var(--gold);} .lb-rank.top2{color:#D8D8E8;} .lb-rank.top3{color:var(--coral);}
  .lb-row.top1 .avatar{box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--gold), 0 0 14px rgba(244,183,64,.5);}
  .lb-crown{font-size:13px; margin-inline-end:2px; display:inline-block; animation:top3IcoWobble 1.8s ease-in-out infinite;}
  .lb-name{flex:1; font-size:13.5px; font-weight:600;}
  .lb-sub{font-size:11px; color:var(--text-muted);}
  .lb-pts{font-family:'Cairo',sans-serif; font-weight:800; color:var(--gold); font-size:13px;}
  .tabs{display:flex; gap:8px; margin-bottom:14px; position:relative;}

  .scan-frame{position:absolute; inset:16px; pointer-events:none;}
  .scan-frame .corner{position:absolute; width:26px; height:26px; border:3px solid var(--gold);}
  .scan-frame .corner.tl{top:0; left:0; border-right:none; border-bottom:none; border-top-left-radius:10px;}

  @keyframes scanSweep{0%,100%{top:6%; opacity:.4;} 50%{top:92%; opacity:1;}}
  .scan-status-bar{position:relative; display:flex; align-items:center; justify-content:center; gap:9px;
    max-width:340px; margin:0 auto 14px; padding:10px 18px; border-radius:14px;
    background:var(--surface); border:1px solid var(--border); box-shadow:0 10px 24px rgba(0,0,0,.24);
    font-family:'Cairo',sans-serif; font-weight:700; font-size:13.5px; color:var(--text); transition:background .25s ease;}
  .scan-status-ico{position:relative; flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--gold);
    color:#fff; display:flex; align-items:center; justify-content:center; transition:background .25s ease;}
  .scan-status-ico::after{content:''; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--gold);
    animation:toastRing 1.7s ease-out infinite; transition:border-color .25s ease;}
  .scan-status-ico svg{width:12px; height:12px; position:relative; z-index:1;}
  .scan-status-bar.error .scan-status-ico{background:var(--danger);}
  .scan-status-bar.error .scan-status-ico::after{border-color:var(--danger);}
  .modal-status{font-family:'Cairo',sans-serif; font-weight:700; margin:16px 0; text-align:center; color:var(--text-muted); font-size:14px;}
  .modal-close{margin-top:6px;}
  .confirm-overlay{background:rgba(6,5,20,.78); padding:20px; z-index:200;}
  .confirm-card{background:var(--bg-2); border:1px solid var(--border); border-radius:22px; padding:22px 20px; max-width:340px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.4); animation:confirmPop .22s ease;}
  @keyframes confirmPop{from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);}}
  .confirm-icon{font-size:34px; text-align:center; margin-bottom:10px;}
  .confirm-msg{font-family:'Cairo',sans-serif; font-weight:800; font-size:15.5px; text-align:center; color:var(--text); line-height:1.6;}
  .confirm-sub{font-size:12.5px; color:var(--text-muted); text-align:center; margin-top:8px; line-height:1.7;}
  .confirm-actions{display:flex; gap:10px; margin-top:20px;}
  .confirm-actions .btn{padding:12px; margin:0;}
  .trash-empty-btn{margin-bottom:12px;}

  .empty-note{text-align:center; color:var(--text-muted); font-size:13px; padding:20px 6px;}

  /* ---------- team ambient tint ---------- */
  #team-tint-bg{position:fixed; inset:0; z-index:-1; pointer-events:none; transition:background 1s ease;}

  /* ---------- badges ---------- */
  .badge-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .badge-item{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; text-align:center;}
  .badge-item .b-ico{font-size:24px;}
  .badge-item .b-lab{font-size:10.5px; color:var(--text-muted); line-height:1.3;}
  .badge-item.secret{background:linear-gradient(180deg,rgba(155,140,255,.14),rgba(155,140,255,.04)); border-color:rgba(155,140,255,.35);}

  /* ---------- streak ---------- */
  .streak-pill{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:rgba(244,183,64,.12); border:1px solid rgba(244,183,64,.35); font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; color:var(--gold); animation:streakGlow 1.8s ease-in-out infinite;}
  @keyframes streakGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(244,183,64,0);} 50%{ box-shadow:0 0 14px 1px rgba(244,183,64,.35);} }

  /* ---------- earned title ---------- */
  .earned-title{display:inline-block; margin-top:6px; font-size:11.5px; color:var(--violet); background:rgba(155,140,255,.12); border:1px solid rgba(155,140,255,.3); padding:3px 10px; border-radius:999px;}

  /* ---------- medal tiers ---------- */
  .medal-crown-ico{position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:26px;
    animation:crownFloat 2.4s ease-in-out infinite, crownGlow 2.4s ease-in-out infinite; transform-origin:center bottom; z-index:2;}
  @keyframes crownFloat{ 0%,100%{ transform:translateX(-50%) translateY(0) rotate(-5deg);} 50%{ transform:translateX(-50%) translateY(-7px) rotate(5deg);} }
  @keyframes crownGlow{ 0%,100%{ filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)) drop-shadow(0 0 0 rgba(244,183,64,0));} 50%{ filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)) drop-shadow(0 0 12px rgba(244,183,64,.75));} }
  .medal.tier-2::after{content:''; position:absolute; inset:-7px; border-radius:50%; border:2px dashed var(--teal); opacity:.55;}
  .medal.tier-3::after{content:''; position:absolute; inset:-9px; border-radius:50%; border:2.5px solid var(--gold-2); box-shadow:0 0 18px rgba(244,183,64,.5); opacity:.85;}
  .medal.flipped{transform:rotateY(180deg);}
  .medal-wrap{perspective:900px;}
  .medal{transition:transform .5s cubic-bezier(.34,1.56,.64,1);}

  /* ---------- DNA ring ---------- */
  .dna-legend span{display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--text-muted); margin-inline-end:10px; margin-top:6px;}
  .dna-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  /* ---------- recommendation ---------- */
  .reco-card{display:flex; align-items:center; gap:10px; padding:14px;}
  .reco-ico{font-size:22px; flex:0 0 auto;}
  .reco-txt{font-size:12.5px; color:var(--text-muted); line-height:1.6;}

  /* ---------- mini agenda ---------- */
  .agenda-row{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border); font-size:12.5px;}
  .agenda-row:last-child{border-bottom:none;}
  .agenda-time{font-family:'Cairo',sans-serif; font-weight:800; color:var(--teal); font-size:11.5px; width:64px; flex:0 0 auto;}
  .agenda-name{flex:1;}
  .agenda-badge{font-size:10px; padding:3px 8px; border-radius:999px; background:var(--bg-2); color:var(--text-muted);}

  /* ---------- missed-past banner ---------- */
  .missed-banner{display:flex; align-items:center; gap:10px; padding:13px 14px; border-radius:16px; background:rgba(255,122,89,.1); border:1px solid rgba(255,122,89,.3); font-size:12.5px; color:var(--coral); margin-bottom:14px;}

  /* ---------- live now on stage ---------- */
  .live-now-card{position:relative; overflow:hidden; padding:14px 16px; margin-bottom:14px; border-color:rgba(63,220,201,.4);}
  .live-now-tag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--teal); font-weight:800; font-family:'Cairo',sans-serif;}
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:pulseDot 1.5s ease-out infinite;}
  .live-now-title{font-weight:700; font-size:14.5px; margin-top:4px;}

  /* ---------- live wall ticker ---------- */
  .live-wall{display:flex; gap:8px; overflow-x:auto; padding:2px 0;}
  .live-wall-item{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:11.5px; white-space:nowrap; animation:fadeInUp .35s ease;}

  /* ---------- rank gap ---------- */
  .lb-gap{font-size:10.5px; color:var(--text-muted); margin-top:1px;}

  /* ---------- compare ---------- */
  .compare-pick-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border);}
  .compare-pick-row:last-child{border-bottom:none;}
  .compare-bar-row{margin-bottom:14px;}
  .compare-bar-lab{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-muted); margin-bottom:5px;}
  .compare-bar-track{display:flex; align-items:center; gap:4px; height:14px;}
  .compare-bar-half{flex:1; height:100%; background:var(--bg-2); border-radius:6px; overflow:hidden; display:flex;}
  .compare-bar-half.left{justify-content:flex-end;}
  .compare-fill{height:100%;}
  .compare-stats-row{display:flex; justify-content:space-around; text-align:center; margin-top:10px;}
  .compare-stats-row .cs-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:18px; color:var(--gold);}
  .compare-stats-row .cs-lab{font-size:10.5px; color:var(--text-muted);}

  /* ---------- cheer ---------- */
  .cheer-btn{margin-top:4px; display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:4px 10px; border-radius:999px; background:var(--bg-2); border:1px solid var(--border); color:var(--text-muted);}
  .cheer-btn.pop{animation:cheerPop .4s ease;}
  @keyframes cheerPop{0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);}}

  /* ---------- admin progress ---------- */
  .admin-progress-track{height:6px; border-radius:4px; background:var(--bg-2); overflow:hidden; margin-top:8px; width:100%;}
  .admin-progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--good)); transition:width .5s ease;}
  .admin-progress-lab{font-size:10.5px; color:var(--text-muted); margin-top:4px;}

  /* ---------- live pulse (organizer big screen) ---------- */
  .pulse-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center;}
  .pulse-num{font-family:'Cairo',sans-serif; font-weight:900; font-size:88px; line-height:1; background:linear-gradient(100deg,var(--gold),var(--gold-2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .pulse-of{font-size:15px; color:var(--text-muted); margin-top:6px;}
  .pulse-session-name{font-family:'Cairo',sans-serif; font-weight:800; font-size:19px; margin-top:18px;}
  .pulse-select{margin-top:18px; width:100%; max-width:320px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; color:var(--text); font-size:13px;}

  /* ---------- timeline ---------- */
  .tl-row{display:flex; gap:12px; padding:4px 0 20px; position:relative;}
  .tl-row:last-child{padding-bottom:2px;}
  .tl-dot-col{display:flex; flex-direction:column; align-items:center; flex:0 0 auto;}
  .tl-dot{width:12px; height:12px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px rgba(244,183,64,.15); margin-top:3px;}
  .tl-line{flex:1; width:2px; background:var(--border); margin-top:4px;}
  .tl-row:last-child .tl-line{display:none;}
  .tl-time{font-family:'Cairo',sans-serif; font-weight:800; font-size:11.5px; color:var(--teal); margin-bottom:2px;}
  .tl-name{font-weight:700; font-size:13.5px;}
  .tl-sub{font-size:11px; color:var(--text-muted); margin-top:2px;}

  /* ---------- settings ---------- */
  .theme-swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .theme-swatch{width:32px; height:32px; border-radius:50%; border:2px solid transparent;}
  .theme-swatch.active{border-color:#fff; box-shadow:0 0 0 2px var(--bg);}
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--border); font-size:13px;}
  .settings-row:last-child{border-bottom:none;}
  .switch{position:relative; width:44px; height:25px; border-radius:999px; background:var(--bg-2); border:1px solid var(--border); flex:0 0 auto;}
  .switch::after{content:''; position:absolute; top:2px; inset-inline-start:2px; width:19px; height:19px; border-radius:50%; background:var(--text-muted); transition:inset-inline-start .2s ease, background .2s ease;}
  .switch.on{background:rgba(95,224,164,.25); border-color:var(--good);}
  .switch.on::after{inset-inline-start:calc(100% - 21px); background:var(--good);}

  /* ---------- day cinematic transition ---------- */
  .day-transition{position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#0E0D2B 0%, #171449 45%, #0E0D2B 100%); text-align:center; animation:dayTransFade 1.6s ease forwards;}
  @keyframes dayTransFade{0%{opacity:0;} 12%{opacity:1;} 82%{opacity:1;} 100%{opacity:0; pointer-events:none;}}
  .day-transition .dnum{font-family:'Cairo',sans-serif; font-weight:900; font-size:64px; color:var(--gold);}
  .day-transition .dlab{font-family:'Cairo',sans-serif; font-weight:800; font-size:22px; margin-top:8px;}

  /* ---------- long-press achievement card (3D) ---------- */
  .ach-overlay{position:fixed; inset:0; z-index:85; background:rgba(6,5,20,.88); display:flex; align-items:center; justify-content:center; padding:30px;}
  .ach-card-scene{perspective:1000px; width:230px; height:300px;}
  .ach-card{width:100%; height:100%; position:relative; transform-style:preserve-3d; animation:achSpin 1.1s cubic-bezier(.34,1.2,.4,1);}
  @keyframes achSpin{from{transform:rotateY(-180deg) scale(.7); opacity:0;} to{transform:rotateY(0) scale(1); opacity:1;}}
  .ach-face{position:absolute; inset:0; border-radius:24px; background:linear-gradient(160deg,var(--surface),var(--surface-2)); border:1.5px solid var(--gold); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 20px 50px rgba(0,0,0,.5); backface-visibility:hidden;}
  .ach-face .ach-num{font-family:'Cairo',sans-serif; font-weight:900; font-size:52px; color:var(--gold);}
  .ach-face .ach-lab{font-size:12.5px; color:var(--text-muted); margin-top:6px;}
  .ach-face .ach-tier{margin-top:14px; font-size:22px;}
  .ach-close-hint{color:var(--text-muted); font-size:11.5px; margin-top:16px; text-align:center;}

  /* ---------- admin: glass boxes (alerts tab) ---------- */
  .admin-glass-box{ position:relative; border-radius:20px; padding:16px; margin-bottom:16px; overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 28px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10); }
  .admin-glass-box::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(135deg, rgba(244,183,64,.35), transparent 40%, transparent 60%, rgba(244,183,64,.15));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; }
  .admin-glass-title{ font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }

  .admin-team-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .admin-team-tile{ position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; padding:16px 10px; border-radius:20px; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 28px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.02);
    overflow:hidden; }
  .admin-team-tile::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg, rgba(244,183,64,.35), transparent 40%, transparent 60%, rgba(244,183,64,.15));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
  .admin-team-tile:active{ transform:scale(.96); }
  .admin-team-tile .avatar{ width:48px; height:48px; font-size:16px; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .admin-team-tile .att-name{ font-weight:800; font-family:'Cairo',sans-serif; font-size:13px; }
  .admin-team-tile .att-meta{ font-size:10.5px; color:var(--text-muted); line-height:1.5; }
  .admin-team-tile .att-pts{ font-family:'Cairo',sans-serif; font-weight:900; font-size:15px; color:var(--gold-2); }
  .admin-team-tile .att-chev{ position:absolute; top:10px; left:10px; opacity:.45; font-size:12px; }
  .admin-team-tile .att-rank{ position:absolute; top:8px; right:8px; z-index:1; font-family:'Cairo',sans-serif; font-weight:800; font-size:10.5px;
    padding:3px 8px; border-radius:999px; letter-spacing:.3px; }
  .admin-team-tile .att-rank.rank-1{ color:#3a2a05; background:linear-gradient(135deg,#FFE9B0,#F4B740); box-shadow:0 3px 10px rgba(244,183,64,.45); }
  .admin-team-tile .att-rank.rank-2{ color:#2c2f36; background:linear-gradient(135deg,#EDEFF3,#B8C0CC); box-shadow:0 3px 10px rgba(184,192,204,.35); }
  .admin-team-tile .att-rank.rank-3{ color:#3a1f10; background:linear-gradient(135deg,#E3A272,#C47A43); box-shadow:0 3px 10px rgba(196,122,67,.4); }
  .admin-team-tile .att-rank.rank-n{ color:var(--text-muted); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }

  /* ---------- admin: team members glass squares ---------- */
  .admin-member-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
  .admin-member-tile{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:7px;
    padding:16px 10px 12px; border-radius:20px; overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.015));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 10px 26px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10); }
  .admin-member-tile::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;

    -webkit-mask-composite:xor; mask-composite:exclude; }
  .admin-member-tile.is-leader{ border-color:rgba(244,183,64,.5); box-shadow:0 10px 26px -12px rgba(0,0,0,.5), inset 0 0 0 1px rgba(244,183,64,.4), inset 0 1px 0 rgba(255,255,255,.10); }
  .admin-member-tile .avatar{ width:42px; height:42px; font-size:13px; position:relative; z-index:1; box-shadow:0 4px 12px rgba(0,0,0,.35); }
  .admin-member-tile .amt-name{ font-size:12px; font-weight:700; position:relative; z-index:1; line-height:1.3; }
  .admin-member-tile .amt-pts{ font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px; color:var(--gold-2); position:relative; z-index:1; }
  .admin-member-tile .amt-crown{ position:absolute; top:8px; right:10px; font-size:13px; z-index:1; }
  .admin-member-tile .amt-move{ width:100%; margin-top:4px; font-size:10.5px; padding:6px 8px; border-radius:10px; position:relative; z-index:1;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); color:var(--text-muted); }

  /* ---------- login otp inline scan icon ---------- */
  .otp-boxes-row{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:nowrap; }
  .otp-boxes-row .otp-boxes{ gap:7px; flex-wrap:nowrap; }
  .otp-boxes-row .otp-box{ width:40px; height:50px; font-size:17px; border-radius:12px; }
  .otp-boxes-row .otp-box.otp-circle{ width:52px; height:52px; font-size:21px; border-radius:50%; }
  .otp-scan-btn{ position:relative; width:42px; height:42px; border-radius:13px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    color:var(--gold-2); background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.015));
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(244,183,64,.25);

    cursor:pointer; overflow:hidden; isolation:isolate;
    animation:otpScanFloat 3.2s ease-in-out infinite; }
  .otp-scan-btn svg{ width:16px; height:16px; }
  .otp-scan-btn::before{ content:''; position:absolute; inset:-2px; z-index:-2; border-radius:inherit;
    background:conic-gradient(from 0deg, rgba(244,183,64,0) 0%, var(--gold-2) 18%, rgba(244,183,64,0) 40%, rgba(244,183,64,0) 100%);
    animation:otpScanSpin 3.6s linear infinite; opacity:.85; }
  .otp-scan-btn::after{ content:''; position:absolute; inset:1.5px; z-index:-1; border-radius:12px;
    background:linear-gradient(160deg, var(--surface), var(--surface-2)); }
  .otp-scan-btn svg{ position:relative; z-index:1; filter:drop-shadow(0 0 6px rgba(244,183,64,.45)); }
  .otp-scan-btn:active{ transform:scale(.9); }
  @keyframes otpScanSpin{ 0%{ transform:rotate(0deg);} 100%{ transform:rotate(360deg);} }
  @keyframes otpScanFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }

  body.data-saver *{animation-duration:.001s !important; transition-duration:.05s !important;}


  /* ============================= LUXURY POLISH ============================= */
  .card{position:relative; box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 14px 34px -20px rgba(0,0,0,.55);
    transition:transform .18s ease, box-shadow .18s ease;}
  [data-action]{transition:transform .12s ease, opacity .12s ease, filter .12s ease;}
  [data-action]:active{transform:scale(.97); filter:brightness(.96);}
  .btn-primary{position:relative; overflow:hidden;}
  .btn-primary::after{content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.45) 48%, transparent 66%);
    background-size:220% 100%; background-position:150% 0; transition:background-position .7s ease;}
  .btn-primary:active::after{background-position:-30% 0;}
  .brand-title, .splash-title, .welcome-en-title{filter:drop-shadow(0 2px 10px rgba(244,183,64,.18));}

  .radial-fab .ham-line{ width:22px; height:2.5px; border-radius:2px; background:#1a1633; transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .25s ease; }
  .radial-fab.is-open .ham-line:nth-child(1){ transform:translateY(7.5px) rotate(45deg); }

  .radial-backdrop{ position:fixed; inset:0; background:rgba(10,9,30,.76); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);

  .radial-item.pop{ transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1); opacity:1; }
  .radial-item.show-tip{ transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.14) !important;

  .radial-name.below{ bottom:auto; top:100%; margin-bottom:0; margin-top:12px; transform:translateX(-50%) translateY(-8px) scale(.7); }

  .nav-tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .nav-tile:active{ transform:scale(.96); }

  @keyframes iconWobble{ 0%,100%{ transform:rotate(0) scale(1);} 25%{ transform:rotate(-12deg) scale(1.08);} 50%{ transform:rotate(10deg) scale(1.08);} 75%{ transform:rotate(-6deg) scale(1.04);} }
  .nt-chev{ position:absolute; top:14px; left:14px; color:var(--text-muted); opacity:.45; transform:scaleX(-1); }

  /* ============================= STAR RATING ============================= */

  .star-btn.on{ color:var(--gold); -webkit-text-stroke:1px var(--gold-2); transform:scale(1.12); text-shadow:0 0 10px rgba(244,183,64,.5); }

  /* ============================= DAILY GIFT BOX ============================= */
  .gift-box-wrap{ width:120px; height:120px; margin:0 auto; display:flex; align-items:center; justify-content:center;

  /* ---------- success celebration overlay (premium) ---------- */
  .success-celebrate-overlay{position:fixed; inset:0; z-index:120; display:flex; align-items:center; justify-content:center;

  .success-celebrate-card{text-align:center; padding:34px 40px; border-radius:26px; position:relative;
